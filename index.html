.lt-item{display:flex; gap:8px; align-items:center; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text); font:inherit; text-align:left; cursor:pointer;}
.lt-item span{flex:1;}
.lt-item small{color:var(--text-muted);}
.reader-layout{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr); gap:14px; align-items:start;}
.reader-pdf iframe{width:100%; height:78vh; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff;}
.reader-side{max-height:78vh; overflow-y:auto;}
.lt-q{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
.pe-opts{margin:4px 0 6px; padding-left:22px; font-size:14px;}
.cloze-row{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--border); font-size:14px; cursor:pointer;}
.cloze-row>span{display:flex; flex-direction:column; gap:2px;}
.cloze-row mark{background:var(--accent-soft); color:var(--accent-text); padding:0 4px; border-radius:4px; font-weight:700;}
.tl-card{display:flex; flex-direction:column; gap:6px; align-items:flex-start; text-align:left; font:inherit; color:var(--text); cursor:pointer;}
.tl-card small{color:var(--text-muted);}
.tl-track{display:flex; gap:0; overflow-x:auto; padding:10px 6px 16px; margin-top:12px; position:relative; min-height:300px; background:linear-gradient(var(--border),var(--border)) center/100% 3px no-repeat;}
.tl-ev{flex:0 0 180px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; height:280px;}
.tl-ev.down{justify-content:flex-end;}
.tl-dot{position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--accent); border:3px solid var(--surface);}
.tl-bubble{position:relative; width:166px; padding:8px 10px; border-radius:var(--radius-sm); background:var(--surface-2); border:1px solid var(--border); display:flex; flex-direction:column; gap:2px; font-size:13px; max-height:126px; overflow:hidden;}
.tl-date{font-weight:800; color:var(--primary-strong); font-size:12.5px;}
.tl-bubble small{color:var(--text-muted); font-size:11.5px; line-height:1.35;}
.tl-x{position:absolute; top:4px; right:4px; border:none; background:none; color:var(--text-muted); cursor:pointer; opacity:0; font-size:12px;}
.tl-bubble:hover .tl-x{opacity:1;}
.tl-game{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.tl-game-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); cursor:grab;}
.tl-game-item b{flex:1; font-weight:600;}
.tl-game-item.ok{border-color:var(--success); background:var(--success-soft, var(--surface-2));}
.tl-game-item.bad{border-color:var(--danger);}
.tl-game-item.dragging{opacity:.5;}
.tl-n{font-weight:800; color:var(--text-muted); width:20px;}
.tl-move button{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; width:30px; height:28px; cursor:pointer;}
.tl-move button:disabled{opacity:.35; cursor:default;}
.formula-card h4{margin:8px 0 4px;}
.fm-math{overflow-x:auto; padding:4px 0;}
.fm-preview{min-height:40px; padding:6px 10px; border-radius:var(--radius-sm); background:var(--surface-2); margin-bottom:12px; overflow-x:auto;}
/* Boletim */
.bol-config{max-width:720px;}
.bol-table{width:100%; border-collapse:collapse; font-size:14px;}
.bol-table th,.bol-table td{padding:8px 6px; border-bottom:1px solid var(--border); text-align:center;}
.bol-table th:first-child,.bol-table td:first-child{text-align:left;}
.bol-cell{min-width:58px; padding:6px 8px; border-radius:8px; border:1px dashed var(--border); background:var(--surface-2); color:var(--text); font:inherit; font-weight:700; cursor:pointer; display:inline-flex; flex-direction:column; align-items:center;}
.bol-cell.ok{border-style:solid; border-color:var(--success); color:var(--success);}
.bol-cell.bad{border-style:solid; border-color:var(--danger); color:var(--danger);}
.bol-cell small{font-size:10px; font-weight:600; color:var(--accent-text);}
.bol-avg{font-size:16px;} .bol-avg.ok{color:var(--success);} .bol-avg.bad{color:var(--danger);}
.bol-status{font-size:12.5px; text-align:left !important; min-width:200px;}
.bol-status.bad{color:var(--danger);} .bol-status.warn{color:var(--accent-text);} .bol-status.ok{color:var(--success);}
.bol-bar{display:grid; grid-template-columns:110px 1fr 40px; gap:8px; align-items:center; margin:8px 0; font-size:13px;}
.bol-track{position:relative; height:10px; border-radius:999px; background:var(--surface-2);}
.bol-track>div{height:100%; border-radius:999px;}
.bol-track i{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text);}
.bol-need{display:flex; flex-direction:column; padding:8px 10px; margin-bottom:6px; border-radius:var(--radius-sm); background:var(--surface-2); border-left:4px solid var(--success); font-size:13.5px;}
.bol-need.warn{border-left-color:var(--accent);} .bol-need.bad{border-left-color:var(--danger);}
.bol-need span{font-weight:700;}
.bol-entries{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
.bol-entry{display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--surface-2); border-radius:var(--radius-sm); font-size:14px;}
.bol-entry span{flex:1; color:var(--text-muted);}
/* Catálogo de vídeos */
.vid-tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.catalog-bar{display:flex; gap:10px; flex-wrap:wrap;}
.catalog-bar .input{flex:1; min-width:220px;}
.catalog-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.cat-card{display:flex; flex-direction:column; text-align:left; padding:0; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; background:var(--surface); color:var(--text); font:inherit; cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.cat-card:hover{transform:translateY(-2px); border-color:var(--primary);}
.cat-thumb{position:relative; aspect-ratio:16/9; background:var(--surface-2);}
.cat-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.cat-badge{position:absolute; left:8px; bottom:8px; background:var(--accent); color:#1C1C1C; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px;}
.cat-badge.seen{left:auto; right:8px; background:var(--success); color:#fff;}
.cat-info{display:flex; flex-direction:column; gap:4px; padding:10px 12px 12px;}
.cat-info b{font-size:14px; line-height:1.35;}
.cat-info small{font-size:12px; color:var(--text-muted);}
@media (max-width:900px){ .reader-layout{grid-template-columns:1fr;} .reader-pdf iframe{height:60vh;} .tl-ev{flex-basis:150px;} .tl-bubble{width:140px;} }

/* ============ RESPONSIVE / MOBILE NAV ============ */
@media (max-width:760px){
  .sidebar{
    position:fixed; left:0; bottom:0; top:auto; width:100%; height:auto;
    flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:8px 8px;
    border-right:none; border-top:1px solid var(--border); z-index:50;

  .main{padding-bottom:64px;}

}

<script>
/* =========================================================================
   ZEN ESTUDOS — app de estudos do Lucca e do Antonio (um perfil para cada)
   Tudo em um arquivo só. Dados ficam salvos no localStorage do navegador.
   ========================================================================= */

/* ---------- CONFIG: insira sua chave do Gemini aqui ---------- */
const GEMINI_API_KEY = "COLOQUE_SUA_CHAVE_AQUI"; // <- troque pela sua chave (https://aistudio.google.com/apikey)
const GEMINI_MODEL = "gemini-3.5-flash";        // <- se a API disser que o modelo não existe, troque o nome aqui
const GEMINI_FAST_MODEL = "gemini-2.5-flash";   // <- usado só quando o "⚡ Modo rápido" está ligado (botão ⚙️ no topo)

/* ---------- PERFIS (Lucca e Antonio no mesmo app) ---------- */
// Cada perfil guarda os dados com um prefixo próprio no navegador. O Lucca continua com o prefixo
// original ("zenEstudos_"), então tudo o que ele já fez continua no lugar.
const PROFILE_COLORS = {
  verde:   {label:'Verde',   light:{primary:'#2C6E5C', strong:'#1F4D40', soft:'#DCEAE4'}, dark:{primary:'#4FA98A', strong:'#6FC2A4', soft:'#1E3830', heroFrom:'#24584A', heroTo:'#163A30'}},
  azul:    {label:'Azul',    light:{primary:'#2F5F8A', strong:'#1F4266', soft:'#DCE7F2'}, dark:{primary:'#6FA3D6', strong:'#9CC2E8', soft:'#1D2D3D', heroFrom:'#244A70', heroTo:'#17314B'}},
  roxo:    {label:'Roxo',    light:{primary:'#6A4C93', strong:'#4B3470', soft:'#E9E1F3'}, dark:{primary:'#A58AD1', strong:'#C3AEE6', soft:'#2B2238', heroFrom:'#4A3670', heroTo:'#30224A'}},
  laranja: {label:'Laranja', light:{primary:'#B5562B', strong:'#8A3E1D', soft:'#F6E1D6'}, dark:{primary:'#E58C5E', strong:'#F2AE88', soft:'#3A261C', heroFrom:'#7A3B1E', heroTo:'#4F2613'}},
  rosa:    {label:'Rosa',    light:{primary:'#A63D6E', strong:'#7A2A50', soft:'#F5DDE8'}, dark:{primary:'#E07BB0', strong:'#EFA6CB', soft:'#3A1F2D', heroFrom:'#7A2E52', heroTo:'#4E1D35'}}
};
const PROFILE_AVATARS = ['🦫','🦊','🐼','🐯','🦁','🐸','🐧','🦉','🐺','🐻','🐨','🐙','🦖','🚀','⚽','🎮','🎧','📚'];
const DEFAULT_PROFILES = [
  {id:'lucca',   name:'Lucca',   avatar:'🦫', color:'verde', prefix:'zenEstudos_',         filesDB:'zenEstudosArquivos'},
  {id:'antonio', name:'Antonio', avatar:'🦊', color:'azul',  prefix:'zenEstudos_antonio_', filesDB:'zenEstudosArquivos_antonio'}
];
function loadProfiles(){
  let saved = [];
  try{ saved = JSON.parse(localStorage.getItem('zenEstudosPerfis')||'[]') || []; }catch(e){}
  // nome/ícone/cor podem ser personalizados; prefixo e banco de arquivos são fixos (é onde estão os dados)
  return DEFAULT_PROFILES.map(d=> Object.assign({}, d, (Array.isArray(saved) && saved.find(x=>x && x.id===d.id)) || {}, {prefix:d.prefix, filesDB:d.filesDB}));
}
const PROFILES = loadProfiles();
const CURRENT_PROFILE = (()=>{ let id = null; try{ id = localStorage.getItem('zenEstudosPerfilAtual'); }catch(e){} return PROFILES.find(p=>p.id===id) || PROFILES[0]; })();
function saveProfiles(){ try{ localStorage.setItem('zenEstudosPerfis', JSON.stringify(PROFILES.map(({id,name,avatar,color})=>({id,name,avatar,color})))); }catch(e){} }
function userName(){ return CURRENT_PROFILE.name; }
function friendProfile(){ return PROFILES.find(p=>p.id!==CURRENT_PROFILE.id) || null; }
function profilePalette(p){ return PROFILE_COLORS[p.color] || PROFILE_COLORS.verde; }
// Cor de cada perfil (verde é a do tema original, então não sobrescreve nada)
function applyProfileColors(){
  const st = document.documentElement.style;
  const keys = ['--primary','--primary-strong','--primary-soft','--hero-from','--hero-to'];
  if(CURRENT_PROFILE.color==='verde' || !PROFILE_COLORS[CURRENT_PROFILE.color]){ keys.forEach(k=> st.removeProperty(k)); return; }
  const pal = profilePalette(CURRENT_PROFILE);
  const dark = typeof state!=='undefined' && state.settings && state.settings.theme==='dark';
  const v = dark ? pal.dark : pal.light;
  const vals = [v.primary, v.strong, v.soft, dark ? v.heroFrom : v.primary, dark ? v.heroTo : v.strong];
  keys.forEach((k,i)=> st.setProperty(k, vals[i]));
}
// Chave do Gemini: a do perfil (salva só neste navegador) ou, se vazia, a do código
function geminiKey(){
  const own = typeof state!=='undefined' && state.settings && String(state.settings.apiKey||'').trim();
  return own || GEMINI_API_KEY;
}
function updateProfileUI(){
  const set = (id, v)=>{ const el = document.getElementById(id); if(el) el.textContent = v; };
  set('profile-avatar', CURRENT_PROFILE.avatar); set('profile-name', CURRENT_PROFILE.name);
  set('sidebar-hello', `oi, ${CURRENT_PROFILE.name} ${CURRENT_PROFILE.avatar}`);
  set('sidebar-version', `feito com carinho pro ${CURRENT_PROFILE.name} 💚`);
}
// Tela "Quem vai estudar agora?"
function showProfilePicker(opts){
  opts = opts||{};
  const old = document.getElementById('profile-picker'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'profile-picker'; el.id = 'profile-picker';
  el.innerHTML = `<div class="pp-inner" role="dialog" aria-modal="true" aria-label="Escolher usuário">
    ${capySVG('happy','mascot-float',84)}
    <h2>Quem vai estudar agora?</h2>
    <div class="pp-grid">${PROFILES.map(p=>`<button type="button" class="pp-card ${p.id===CURRENT_PROFILE.id?'current':''}" data-pid="${p.id}" style="--pc:${profilePalette(p).light.primary}">
      <span class="pp-avatar">${p.avatar}</span><b>${escapeHTML(p.name)}</b>${p.id===CURRENT_PROFILE.id?'<small>usuário atual</small>':'<small>&nbsp;</small>'}</button>`).join('')}</div>
    <label class="check-row pp-remember"><input type="checkbox" id="pp-remember"> Não perguntar de novo neste aparelho</label>
    ${opts.startup ? '' : '<button type="button" class="btn btn-ghost btn-sm" id="pp-cancel">Cancelar</button>'}
  </div>`;
  document.body.appendChild(el);
  el.querySelectorAll('[data-pid]').forEach(b=> b.addEventListener('click', ()=>{
    if(document.getElementById('pp-remember').checked){ try{ localStorage.setItem('zenEstudosPerguntarPerfil','nao'); }catch(e){} }
    chooseProfile(b.dataset.pid);
  }));
  const cancel = document.getElementById('pp-cancel');
  if(cancel) cancel.addEventListener('click', ()=> el.remove());
  setTimeout(()=>{ const c = el.querySelector('.pp-card.current') || el.querySelector('.pp-card'); if(c) c.focus(); }, 50);
}
function chooseProfile(pid){
  try{ sessionStorage.setItem('zenPerfilEscolhido','1'); }catch(e){}
  if(pid!==CURRENT_PROFILE.id && quizSession && !quizSession.finished){ saveQuizProgress('trocou de usuário'); quizSession = null; }
  if(pid===CURRENT_PROFILE.id){ const el = document.getElementById('profile-picker'); if(el) el.remove(); return; }
  flushNoteSave();
  if(typeof stopLive==='function') stopLive(true);
  pomodoroState.running = false;   // não pergunta "sair da página?" por causa do timer
  try{ localStorage.setItem('zenEstudosPerfilAtual', pid); }catch(e){}
  location.reload();
}
function maybeAskProfile(){
  let ask = true;
  try{ ask = localStorage.getItem('zenEstudosPerguntarPerfil')!=='nao' && !sessionStorage.getItem('zenPerfilEscolhido'); }catch(e){}
  if(ask) showProfilePicker({startup:true});
}
// Seção "Meu perfil" dentro do ⚙️
function profileSettingsHTML(){
  let ask = true; try{ ask = localStorage.getItem('zenEstudosPerguntarPerfil')!=='nao'; }catch(e){}
  return `<div class="profile-edit">
    <h4 style="margin-bottom:10px;">${CURRENT_PROFILE.avatar} Perfil do ${escapeHTML(userName())}</h4>
    <div class="field-row">
      <div class="field"><label for="pf-name">Nome</label><input class="input" id="pf-name" value="${escapeHTML(userName())}" maxlength="24"></div>
      <div class="field" style="max-width:120px; min-width:100px;"><label>Ícone</label><button type="button" class="btn btn-ghost" id="pf-avatar" style="font-size:20px;">${CURRENT_PROFILE.avatar}</button></div>
    </div>
    <label>Cor do app</label>
    <div class="chip-row" id="pf-colors" style="margin-bottom:12px;">${Object.entries(PROFILE_COLORS).map(([k,c])=>`<button type="button" class="chip ${CURRENT_PROFILE.color===k?'active':''}" data-color="${k}"><span class="color-swatch" style="background:${c.light.primary}"></span>${c.label}</button>`).join('')}</div>
    <div class="field"><label for="pf-key">Chave do Gemini deste perfil (opcional)</label>
      <input class="input" id="pf-key" type="password" autocomplete="off" placeholder="vazio = usa a chave escrita no código" value="${escapeHTML(state.settings.apiKey||'')}">
      <p class="muted-sm" style="font-size:12px; margin-top:4px;">Fica salva só neste navegador, no perfil do ${escapeHTML(userName())}. Útil se cada um tiver a própria chave (e a própria cota grátis).</p></div>
    <label class="check-row"><input type="checkbox" id="pf-ask" ${ask?'checked':''}> Perguntar "quem vai estudar?" ao abrir o app</label>
    <button type="button" class="btn btn-ghost btn-sm" id="pf-switch">🔄 Trocar de usuário</button>
  </div><hr style="border:none; border-top:1px solid var(--border); margin:18px 0;">`;
}
function bindProfileSettings(){
  const name = document.getElementById('pf-name');
  if(!name) return;
  name.addEventListener('change', ()=>{ const v = name.value.trim().slice(0,24); if(!v) return; CURRENT_PROFILE.name = v; saveProfiles(); updateProfileUI(); toast('Nome atualizado!','success'); });
  document.getElementById('pf-avatar').addEventListener('click', e=>{
    const m = openMenu(e.currentTarget, [], 'icon-menu');
    m.innerHTML = PROFILE_AVATARS.map(a=>`<button type="button" class="icon-opt">${a}</button>`).join('');
    m.querySelectorAll('.icon-opt').forEach(b=> b.addEventListener('click', ()=>{ closeMenu(); CURRENT_PROFILE.avatar = b.textContent; saveProfiles(); updateProfileUI(); document.getElementById('pf-avatar').textContent = b.textContent; }));
  });
  document.querySelectorAll('#pf-colors [data-color]').forEach(b=> b.addEventListener('click', ()=>{
    CURRENT_PROFILE.color = b.dataset.color; saveProfiles(); applyProfileColors();
    document.querySelectorAll('#pf-colors .chip').forEach(c=> c.classList.toggle('active', c===b));
    if(currentView==='progresso' && document.getElementById('chart-minutes')) drawProgressCharts();
  }));
  document.getElementById('pf-key').addEventListener('change', e=>{ state.settings.apiKey = e.target.value.trim(); persist('settings'); toast(e.target.value.trim() ? 'Chave salva neste perfil 🔑' : 'Usando a chave do código', 'success'); });
  document.getElementById('pf-ask').addEventListener('change', e=>{ try{ localStorage.setItem('zenEstudosPerguntarPerfil', e.target.checked ? 'sim' : 'nao'); }catch(err){} });
  document.getElementById('pf-switch').addEventListener('click', ()=>{ closeModal(); showProfilePicker(); });
}

/* ---------- STORAGE ---------- */
const STORAGE_PREFIX = CURRENT_PROFILE.prefix;   // cada usuário tem o seu (o do Lucca continua "zenEstudos_")
function loadData(key, fallback){
  try{ const raw = localStorage.getItem(STORAGE_PREFIX+key); return raw!==null ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveData(key, value){
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); return true; }
  catch(e){ console.error('Zen Estudos: erro ao salvar', key, e); toast('Não consegui salvar os dados (armazenamento cheio ou bloqueado).','error'); return false; }
}

let state = {
  subjects:         loadData('subjects', []),
  resumos:          loadData('resumos', []),
  flashcards:       loadData('flashcards', []),
  questions:        loadData('questions', []),
  quizAttempts:     loadData('quizAttempts', []),
  videos:           loadData('videos', []),
  notes:            loadData('notes', []),
  mindmaps:         loadData('mindmaps', []),
  calendar:         loadData('calendar', {}),       // metas por dia: { 'AAAA-MM-DD': {goals:[], note:''} }
  weeklyGoals:      loadData('weeklyGoals', {}),    // metas por semana: { 'domingo AAAA-MM-DD': [goals] }
  events:           loadData('events', []),         // provas, trabalhos e lembretes com data
  stats:            loadData('stats', {}),
  achievements:     loadData('achievements', []),
  achievementDates: loadData('achievementDates', {}),
  chatHistory:      loadData('chatHistory', []),      // (versão antiga: uma conversa só; migra para "chats")
  chats:            loadData('chats', []),            // conversas salvas com o Zen
  files:            loadData('files', []),            // lista dos anexos (o conteúdo fica no IndexedDB)
  boards:           loadData('boards', []),           // quadros brancos
  essays:           loadData('essays', []),           // redações corrigidas pelo Zen
  grades:           loadData('grades', {}),           // boletim: notas reais da escola
  timelines:        loadData('timelines', []),        // linhas do tempo
  formulas:         loadData('formulas', []),         // fórmulas favoritas
  catalog:          loadData('catalog', {}),          // catálogo de vídeos: resumos, assistidos e achados do Zen
  settings:         loadData('settings', {})
};
// Garante que dados antigos (de versões anteriores do app) tenham todos os campos novos
function normalizeState(){
  const s = state.stats = Object.assign({streak:0, bestStreak:0, lastActiveDate:null, studyLog:{}, subjectMinutes:{}, pomodoroLog:{},
    flashcardsReviewed:0, quizzesTaken:0, pomodorosDone:0, totalXP:0, visitCount:0, lastVisitAt:null, prevVisitAt:null, chatMessages:0, goalsCompleted:0}, state.stats);
  ['studyLog','subjectMinutes','pomodoroLog'].forEach(k=>{ if(!s[k] || typeof s[k]!=='object') s[k]={}; });
  const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  state.settings = Object.assign({theme: prefersDark?'dark':'light', pomodoroWork:25, pomodoroBreak:5, pomodoroLongBreak:15, soundOn:true, lastView:null}, state.settings);

/* ---------- UTILS ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function keyToDate(dateKey){ const [y,m,d] = dateKey.split('-').map(Number); return new Date(y,m-1,d); }
function addDaysKey(dateKey, n){ const dt = keyToDate(dateKey); dt.setDate(dt.getDate()+n); return todayKey(dt); }
function daysBetween(fromKey, toKey){ return Math.round((keyToDate(toKey)-keyToDate(fromKey))/86400000); }
function weekStartKey(dateKey){ const dt = keyToDate(dateKey); dt.setDate(dt.getDate()-dt.getDay()); return todayKey(dt); } // semana começa no domingo
function escapeHTML(str){
  return (str==null ? '' : String(str)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDateBR(dateKey){ return keyToDate(dateKey).toLocaleDateString('pt-BR',{day:'numeric',month:'long'}); }
function formatShort(dateKey){ const [,m,d] = dateKey.split('-'); return `${d}/${m}`; }
function plural(n, one, many){ return n===1 ? one : (many || one+'s'); }
function pick(list){ return list[Math.floor(Math.random()*list.length)]; }
function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function safeUrl(url){ try{ const u = new URL(url); return (u.protocol==='http:' || u.protocol==='https:') ? u.href : null; }catch(e){ return null; } }

/* Markdown simples e seguro: o texto é escapado ANTES de virar HTML (usado nas respostas do Zen e nos resumos) */
// Blocos ```mermaid / ```html / ```chart e fórmulas $$…$$ viram visuais de verdade (veja VISUAIS COM CÓDIGO)
function renderMarkdown(src, opts){
  opts = opts||{};
  const visuals = opts.visuals!==false;
  const blocks = [];
  const keep = html=>{ blocks.push(html); return `\n${blocks.length-1}\n`; };
  let s = String(src||'').replace(/\r\n?/g,'\n')
    .replace(/```([\w-]*)[^\n]*\n?([\s\S]*?)```/g, (m, lang, code)=>{
      code = code.replace(/\n$/,'');
      const vis = visuals && normalizeVisualLang(lang);
      return keep(vis ? visualBlockHTML(vis, code) : `<pre><code${lang?` data-lang="${escapeHTML(lang)}"`:''}>${escapeHTML(code)}</code></pre>`);
    })
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, tex)=> keep(visuals ? visualBlockHTML('math', tex.trim()) : `<pre><code>${escapeHTML(tex.trim())}</code></pre>`));
  s = escapeHTML(s);
  const inline = t=>{
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (m,c)=>{ codes.push(c); return `${codes.length-1}`; });
    // fórmulas $...$ saem antes do negrito/itálico (senão um _ ou * dentro da fórmula estraga tudo)
    const maths = [];
    if(visuals) t = t.replace(/(^|[^\\\w$])\$(?!\s)([^$\n]{1,200}?)(?<!\s)\$(?![\w$])/g, (m, pre, tex)=>{ maths.push(tex); return `${pre}\uE003${maths.length-1}\uE003`; });
    t = t.replace(/\\([%$#{}])/g, '$1');   // "\%" escrito fora de fórmula vira "%"
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>')
         .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<em>$2</em>')
         .replace(/(^|[^\w])_(?!\s)([^_]+?)_(?!\w)/g,'$1<em>$2</em>')
         .replace(/~~([^~]+)~~/g,'<s>$1</s>');
    t = t.replace(/\uE003(\d+)\uE003/g, (m,i)=> `<span class="md-math" data-src="${maths[+i]}">${maths[+i]}</span>`);
    return t.replace(/(\d+)/g, (m,i)=>`<code>${codes[+i]}</code>`);
  };
  let html = '', para = [], list = null, table = [];
  const flush = ()=>{ if(para.length){ html += `<p>${inline(para.join('<br>'))}</p>`; para = []; } };
  const closeList = ()=>{ if(list){ html += `</${list}>`; list = null; } };
  // tabelas no formato | a | b | com a linha |---|---| embaixo do cabeçalho
  const flushTable = ()=>{
    if(!table.length) return;
    const rows = table.map(r=> r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    if(rows.length>=2 && rows[1].every(c=>/^:?-{2,}:?$/.test(c))){
      html += `<table><thead><tr>${rows[0].map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    } else html += `<p>${table.map(inline).join('<br>')}</p>`;
    table = [];
  };
  s.split('\n').forEach(line=>{
    const t = line.trim(); let m;
    if(t.startsWith('|') && t.length>1){ flush(); closeList(); table.push(t); return; }
    flushTable();
    if(!t){ flush(); closeList(); return; }
    if(/^\d+$/.test(t)){ flush(); closeList(); html += t; return; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flush(); closeList(); html += '<hr>'; return; }
    if((m = t.match(/^(#{1,4})\s+(.*)$/))){ flush(); closeList(); const h = Math.min(4, m[1].length+1); html += `<h${h}>${inline(m[2])}</h${h}>`; return; }
    if((m = t.match(/^[-*•]\s+(.*)$/))){ flush(); if(list!=='ul'){ closeList(); html += '<ul>'; list='ul'; } html += `<li>${inline(m[1])}</li>`; return; }
    if((m = t.match(/^\d+[.)]\s+(.*)$/))){ flush(); if(list!=='ol'){ closeList(); html += '<ol>'; list='ol'; } html += `<li>${inline(m[1])}</li>`; return; }
    if((m = t.match(/^&gt;\s?(.*)$/))){ flush(); closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; return; }
    closeList(); para.push(t);
  });
  flushTable(); flush(); closeList();
  return html.replace(/(\d+)/g, (m,i)=> blocks[+i]);
}
// Limpa HTML das anotações (remove scripts e atributos perigosos)
function sanitizeHTML(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html||'';
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(n=>n.remove());
  tpl.content.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const name = a.name.toLowerCase();
      if(name.startsWith('on') || name==='style' || (/^(href|src|xlink:href)$/.test(name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
    });
  });
  return tpl.innerHTML;
}

function sanitizeQuestions(list){
  return (Array.isArray(list)?list:[]).map(q=>{
    q = q||{};
    const options = (Array.isArray(q.options)?q.options:[]).slice(0,5).map(o=>String(o==null?'':o).trim());
    let ci = q.correctIndex;
    if(typeof ci==='string' && /^[A-E]$/i.test(ci.trim())) ci = ci.trim().toUpperCase().charCodeAt(0)-65;
    ci = Number(ci);
    return { question:String(q.question||'').trim(), options, correctIndex: Number.isInteger(ci)?ci:-1, explanation:String(q.explanation||'').trim() };
  }).filter(q=> q.question && q.options.length>=2 && q.options.every(Boolean) && q.correctIndex>=0 && q.correctIndex<q.options.length);
}

  return (Array.isArray(list)?list:[]).map(c=>({front:String((c&&c.front)||'').trim(), back:String((c&&c.back)||'').trim()})).filter(c=>c.front && c.back);

function levelInfo(xp){
  // cada nível pede 25% mais XP que o anterior
  let level = 1, need = 100, acc = 0;
  while(xp >= acc+need){ acc += need; level++; need = Math.round(need*1.25); }
  return { level, current:xp-acc, need, pct:Math.round((xp-acc)/need*100), title:LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1, level-1)] };
}
function addXP(amount){
  if(!amount) return;
  const before = levelInfo(state.stats.totalXP||0).level;
  state.stats.totalXP = (state.stats.totalXP||0) + Math.round(amount);
  onXPGained(Math.round(amount));
  persist('stats');
  const after = levelInfo(state.stats.totalXP).level;
  if(after>before) toast(`Subiu para o nível ${after}: ${levelInfo(state.stats.totalXP).title}! 🦫🎉`, 'success');
}

async function askZen(messages, opts){
  opts = opts||{};
  if(!hasGeminiKey()){ const err = new Error('CHAVE_AUSENTE'); err.code='CHAVE_AUSENTE'; throw err; }
  const body = { contents: buildContents(messages), systemInstruction:{ parts:[{text: opts.system || zenSystemPrompt()}] } };
  if(opts.json) body.generationConfig = { responseMimeType:'application/json' };
  // cache: a mesma pergunta não gasta outro pedido · light: tarefa simples usa o modelo rápido no modo economia
  const key = opts.cache ? aiCacheKey(body, opts) : null;
  if(key){ const hit = aiCacheGet(key); if(hit!=null) return hit; }
  const data = await geminiCall(body, opts.model || (opts.light && economyOn() ? GEMINI_FAST_MODEL : undefined));
  const text = candidateText(data);
  if(key) aiCacheSet(key, text);
  return text;
}
// Mensagens {role, content | parts} → formato da API. A API espera turnos alternados começando pelo usuário,
// então mensagens seguidas do mesmo lado são juntadas (texto, imagens, PDFs…).
function buildContents(messages){
  const contents = [];
  messages.forEach(m=>{
    const role = m.role==='assistant' || m.role==='model' ? 'model' : 'user';
    const parts = m.parts ? m.parts.slice() : [{text:String(m.content==null?'':m.content)}];
    const last = contents[contents.length-1];
    if(last && last.role===role) last.parts.push(...parts);
    else contents.push({role, parts});
  });
  while(contents.length && contents[0].role!=='user') contents.shift();
  return contents;
}
function candidateText(data){
  const cand = data && data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || []).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
  if(!text){ const err = new Error('A IA não retornou texto.'); err.code = (cand && cand.finishReason==='SAFETY') ? 'BLOQUEADO' : 'VAZIO'; throw err; }
  return text;
}
/* Qual modelo usar:
   - o principal (GEMINI_MODEL) para estudar;
   - o rápido (GEMINI_FAST_MODEL) se o "⚡ Modo rápido" estiver ligado, se a cota grátis do principal acabou
     (o plano gratuito do Google dá poucas perguntas por dia) ou se o principal travar. */
const GEMINI_FREE_DAILY_LIMIT = 20;   // limite diário do plano gratuito para o GEMINI_MODEL (com cobrança ativada é bem maior)
let zenAbort = null;                  // botão "Cancelar" do chat
let zenForceModel = null;             // "responder já com o modelo rápido"
const GEMINI_TIMEOUT_MS = 180000;     // desiste do modelo principal depois de 3 minutos e usa o rápido
// O bloqueio por cota vale só para o modelo que estourou (se você trocar GEMINI_MODEL, o novo já é usado)
function mainQuotaBlocked(){ return !!state.settings.mainQuotaUntil && state.settings.mainQuotaModel===GEMINI_MODEL && Date.now() < state.settings.mainQuotaUntil; }
// Ao abrir o app: se GEMINI_MODEL mudou no código, passa a usar o modelo novo nas conversas na hora
function syncModelChange(){
  const prev = state.settings.lastMainModel;
  if(prev===GEMINI_MODEL) return;
  state.settings.lastMainModel = GEMINI_MODEL;
  state.settings.mainQuotaUntil = null; state.settings.mainQuotaModel = null;
  state.settings.fastMode = false;
  persist('settings');
  if(prev) setTimeout(()=> toast(`Modelo trocado: agora o Zen usa ${GEMINI_MODEL} 🦫`, 'success'), 1500);
}
function activeModel(){ return zenForceModel || ((state.settings.fastMode || mainQuotaBlocked() || economyOut()) ? GEMINI_FAST_MODEL : GEMINI_MODEL); }
function aiUsageToday(){
  const u = state.settings.aiUsage;
  if(!u || u.date!==todayKey()) state.settings.aiUsage = {date:todayKey(), counts:{}};
  return state.settings.aiUsage;
}
function countAIRequest(model){ const u = aiUsageToday(); u.counts[model] = (u.counts[model]||0)+1; persist('settings'); updateAILeft(); }
// Chama o modelo pedido e, se o principal estiver sem cota ou travado, repete com o rápido
async function geminiCall(body, model){
  model = model || activeModel();
  try{
    const data = await geminiRequest(body, model);
    data.__model = model;
    return data;
  }catch(err){
    const fallback = model===GEMINI_MODEL && GEMINI_FAST_MODEL && (err.status===429 || err.status===503 || err.code==='TEMPO');
    if(!fallback) throw err;
    if(err.status===429){
      const secs = parseInt((String(err.message).match(/"retryDelay":\s*"(\d+)/)||[])[1]) || 3600;
      state.settings.mainQuotaUntil = Date.now() + secs*1000; state.settings.mainQuotaModel = model; persist('settings');
      const until = new Date(state.settings.mainQuotaUntil).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      toast(`A cota grátis do ${GEMINI_MODEL} acabou por agora. Até ~${until} o Zen usa o modelo rápido. 🦫`, 'info');
    }
    const data = await geminiRequest(body, GEMINI_FAST_MODEL);
    data.__model = GEMINI_FAST_MODEL;
    return data;
  }
}
async function geminiRequest(body, model){
  if(!hasGeminiKey()){ const err = new Error('CHAVE_AUSENTE'); err.code='CHAVE_AUSENTE'; throw err; }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  countAIRequest(model);
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort('timeout'), GEMINI_TIMEOUT_MS);
  const external = zenAbort && zenAbort.signal;
  const onCancel = ()=> ctrl.abort('cancel');
  if(external) external.addEventListener('abort', onCancel);
  try{
    let resp;
    try{
      resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':geminiKey()}, body:JSON.stringify(body), signal:ctrl.signal });
    }catch(e){
      if(ctrl.signal.aborted){ const err = new Error('pedido interrompido'); err.code = ctrl.signal.reason==='cancel' ? 'CANCELADO' : 'TEMPO'; throw err; }
      const err = new Error('Falha de rede: '+e.message); err.code='REDE'; throw err;
    }
    if(!resp.ok){
      const t = await resp.text().catch(()=> '');
      const err = new Error('Erro da API Gemini: '+resp.status+' '+t); err.code='API_ERRO'; err.status=resp.status; throw err;
    }
    return await resp.json();
  } finally {
    clearTimeout(timer);
    if(external) external.removeEventListener('abort', onCancel);
  }
}
// Pede à IA uma resposta só em JSON (usado por resumos/flashcards/quiz automáticos) e faz o parse.
// extraParts: anexos (PDF, imagem, vídeo do YouTube…) que a IA deve ler antes de responder.
async function askZenJSON(promptText, extraParts, opts){
  const text = promptText + '\n\nResponda SOMENTE com JSON válido, sem markdown, sem texto antes ou depois. Dentro das strings, escreva cada barra invertida dobrada (LaTeX: "\\\\frac", "\\\\cdot") e cada quebra de linha como \\n.';
  const raw = await askZen([{role:'user', parts:[...(extraParts||[]), {text}]}], Object.assign({json:true}, opts));
  try{ return parseLooseJSON(raw); }
  catch(e){ console.warn('JSON da IA:', raw); if(opts && opts.cache) aiCacheDropText(raw); const err = new Error('JSON inválido da IA: '+raw.slice(0,200)); err.code='JSON'; throw err; }
}
// A IA às vezes manda JSON "quase certo": LaTeX com \ sem escapar, quebras de linha cruas, vírgula sobrando no fim…
function parseLooseJSON(raw){
  const s = String(raw||'').replace(/^\s*```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const start = s.search(/[\[{]/), end = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if(start<0 || end<start) throw new Error('sem JSON');
  const body = s.slice(start, end+1);
  let data;
  try{ data = JSON.parse(body); }catch(e){ data = JSON.parse(repairJSON(body)); }
  return fixLatexControls(data);
}
function repairJSON(s){
  let out = '', inStr = false;
  for(let i=0;i<s.length;i++){
    const ch = s[i];
    if(!inStr){
      if(ch==='"') inStr = true;
      else if(ch===','){ const rest = s.slice(i+1).match(/^\s*([}\]])/); if(rest) continue; }   // vírgula antes de } ou ]
      out += ch; continue;
    }
    if(ch==='\\'){
      const nx = s[i+1];
      if(nx && '"\\/bfnrt'.includes(nx)){ out += ch + nx; i++; continue; }
      if(nx==='u' && /^[0-9a-fA-F]{4}$/.test(s.substr(i+2, 4))){ out += s.substr(i, 6); i += 5; continue; }
      out += '\\\\'; continue;                                   // \cdot, \sqrt, \Delta… viram \\cdot
    }
    if(ch==='"'){ inStr = false; out += ch; continue; }
    const c = ch.charCodeAt(0);
    if(c < 0x20){ out += ch==='\n' ? '\\n' : ch==='\r' ? '' : ch==='\t' ? '\\t' : ''; continue; }
    out += ch;
  }
  return out;
}
// "\frac" e "\beta" sem escapar viram caracteres de controle no JSON (\f, \b): devolve a barra pro LaTeX
function fixLatexControls(v){
  if(typeof v==='string') return v.replace(/\f/g, '\\f').replace(/\x08/g, '\\b').replace(/\t(?=(?:imes|heta|ext|an|au|riangle|frac)\b)/g, '\\t');
  if(Array.isArray(v)) return v.map(fixLatexControls);
  if(v && typeof v==='object'){ Object.keys(v).forEach(k=> v[k] = fixLatexControls(v[k])); return v; }
  return v;
}
function zenErrorMessage(err){
  if(!err) return 'O Zen não conseguiu responder agora.';
  if(err.code==='CHAVE_AUSENTE') return 'Adicione sua chave do Gemini na constante GEMINI_API_KEY (no começo do <script> do index.html) para usar o Zen.';
  if(err.code==='REDE') return 'Sem conexão com o Gemini. Confira a internet e tente de novo.';
  if(err.code==='JSON') return 'O Zen respondeu num formato inesperado. Tenta de novo?';
  if(err.code==='BLOQUEADO') return 'O Gemini bloqueou essa resposta. Tente reformular o pedido.';
  if(err.code==='ARQUIVO_GRANDE') return `"${err.fileName}" é grande demais pra IA ler de uma vez (limite ~18 MB). Tente um arquivo menor ou divida o PDF.`;
  if(err.code==='ARQUIVO_TIPO') return `A IA ainda não lê esse tipo de arquivo ("${err.fileName}"). Use PDF, imagem, Word (.docx), texto, áudio ou vídeo.`;
  if(err.code==='LIB') return err.message;
  if(err.code==='CANCELADO') return 'Pedido cancelado. 🦫';
  if(err.code==='TEMPO') return `O Gemini demorou demais pra responder (o modelo ${activeModel()} está lento agora). Tente de novo ou ligue o ⚡ Modo rápido no ⚙️.`;
  if(err.status===400 && /video|youtube|file_?uri|fileData/i.test(err.message)) return 'O Gemini não conseguiu abrir esse vídeo (ele precisa ser público no YouTube). Dá pra colar a transcrição ou enviar o arquivo do vídeo.';
  if(err.status===400 && /api[ _-]?key/i.test(err.message)) return 'A chave do Gemini parece inválida. Confira GEMINI_API_KEY.';
  if(err.status===401 || err.status===403) return 'A chave do Gemini foi recusada. Confira GEMINI_API_KEY e as permissões dela.';
  if(err.status===404) return `O modelo "${GEMINI_MODEL}" não foi encontrado. Troque o nome em GEMINI_MODEL no código.`;
  if(err.status===429) return /PerDay|per_day|PerDay/i.test(err.message) ? 'A cota grátis de hoje do Gemini acabou (o plano gratuito do Google tem poucas perguntas por dia). Ela volta amanhã, ou ative o faturamento no AI Studio.' : 'Limite de uso do Gemini atingido. Espere um minutinho e tente de novo.';
  if(err.status>=500) return 'O Gemini está instável agora. Tente de novo em instantes.';
  return 'O Zen não conseguiu responder agora. Tente de novo em instantes.';

// Varia com o horário e com a frequência de uso (primeira vez, volta rápida, sumiço de dias…)
function getGreeting(){
  const s = state.stats;
  const hour = new Date().getHours();
  const hoursAway = s.prevVisitAt ? (Date.now()-s.prevVisitAt)/3600000 : null;
  if((s.visitCount||0)<=1 && !s.lastActiveDate) return `Bem-vindo ao Zen Estudos, ${userName()}! Eu sou o Zen 🦫`;
  if(hoursAway!==null && hoursAway>=72) return `Que saudade, ${userName()}! Bora retomar com calma? 🦫`;
  if(hoursAway!==null && hoursAway<3) return `De volta à ação, ${userName()}! 💪`;
  if(hour<5) return `Ainda acordado, ${userName()}? Bora revisar leve e descansar 🌙`;
  if(hour<12) return `Bom dia, ${userName()}! Vamos gabaritar hoje? 🦫`;
  if(hour<18) return `Boa tarde, ${userName()}! Bora pra mais uma sessão? 📚`;
  return `Boa noite, ${userName()}, hora de revisar antes de dormir? 🌙`;
}
// Frases que se revezam embaixo da saudação
function getSubGreetings(){
  const list = [];
  const streak = state.stats.streak||0;
  const due = dueFlashcards().length;
  const goals = (state.calendar[todayKey()]||{goals:[]}).goals||[];
  const pending = goals.filter(g=>!g.done).length;
  const exam = upcomingEvents(30).find(e=>e.type==='prova');
  if(streak>=2) list.push(`Você está numa sequência de ${streak} dias, não para agora! 🔥`);
  else if(streak===1 && state.stats.lastActiveDate===todayKey()) list.push('Primeiro dia da sequência garantido. Amanhã tem mais!');
  else list.push('Que tal começar uma sequência de estudos hoje?');
  if(due) list.push(`Tem ${due} ${plural(due,'flashcard')} esperando revisão hoje.`);
  if(pending) list.push(`Faltam ${pending} ${plural(pending,'meta')} pra fechar o dia.`);
  else if(goals.length) list.push('Todas as metas de hoje concluídas. Orgulho! ✨');
  if(exam){ const d = daysBetween(todayKey(), exam.date); list.push(d===0 ? `Hoje tem ${exam.title}. Você consegue!` : `Faltam ${d} ${plural(d,'dia')} para ${exam.title}.`); }
  if(state.resumos.length+state.flashcards.length+state.questions.length===0) list.push('Vamos criar o seu primeiro material de estudo?');
  list.push('Cada sessão de hoje conta pra sua evolução.');
  return list;
}

// Lembretes visuais: provas chegando, flashcards pendentes, metas em aberto…
function buildReminders(){
  const items = [];
  const tKey = todayKey();
  upcomingEvents(14).forEach(ev=>{
    const d = daysBetween(tKey, ev.date);
    const t = EVENT_TYPES[ev.type] || EVENT_TYPES.outro;
    items.push({icon:t.icon, go:'calendario', urgent: ev.type==='prova' && d<=3,
      text: d===0 ? `Hoje: ${ev.title}` : `${ev.title} em ${d} ${plural(d,'dia')} (${formatShort(ev.date)})`});
  });
  const due = dueFlashcards().length;
  if(due) items.push({icon:'🗂️', go:'flashcards', text:`${due} ${plural(due,'flashcard')} para revisar hoje`, urgent: due>=30});
  const pending = ((state.calendar[tKey]||{}).goals||[]).filter(g=>!g.done).length;
  if(pending) items.push({icon:'✅', go:'calendario', text:`${pending} ${plural(pending,'meta pendente','metas pendentes')} hoje`});
  const wkPending = (state.weeklyGoals[weekStartKey(tKey)]||[]).filter(g=>!g.done).length;
  if(wkPending) items.push({icon:'📆', go:'calendario', text:`${wkPending} ${plural(wkPending,'meta')} da semana em aberto`});
  const lastQuiz = state.quizAttempts[state.quizAttempts.length-1];
  if(state.questions.length>=3 && (!lastQuiz || Date.now()-lastQuiz.date > 5*86400000)){
    items.push({icon:'🎯', go:'quizzes', text: lastQuiz ? 'Faz uns dias que você não faz um simulado' : 'Que tal fazer seu primeiro simulado?'});
  }
  const wrongN = wrongQuestions().length;
  if(wrongN) items.push({icon:'❌', go:'ferramentas:erros', text:`${wrongN} ${plural(wrongN,'questão errada','questões erradas')} no caderno de erros`});
  return items;
}

function last7DaysStats(){
  let minutes=0, goals=0;
  const tKey = todayKey();
  for(let i=0;i<7;i++){
    const k = addDaysKey(tKey, -i);
    minutes += state.stats.studyLog[k] || 0;
    goals += ((state.calendar[k]||{}).goals||[]).filter(g=>g.done).length;
  }
  const cutoff = Date.now()-7*86400000;
  const quizzes = state.quizAttempts.filter(a=> a.date>=cutoff).length;
  const flashcards = state.flashcards.reduce((sum,f)=> sum + (f.reviewLog||[]).filter(ts=>ts>=cutoff).length, 0);
  return {minutes:Math.round(minutes), flashcards, quizzes, goals};
}

function addCalendarGoal(dateKey, text){
  if(!state.calendar[dateKey]) state.calendar[dateKey] = {goals:[], note:''};
  state.calendar[dateKey].goals.push({id:uid(), text, done:false});
  persist('calendar');
}
function toggleCalendarGoal(dateKey, goalId){
  const entry = state.calendar[dateKey];
  if(!entry) return;
  const g = entry.goals.find(g=>g.id===goalId);
  if(!g) return;
  g.done = !g.done;
  onGoalDone(g, entry.goals);
  persist('calendar');
}
// XP só na primeira vez que a meta é concluída (marcar/desmarcar não "farma" pontos)
function onGoalDone(g, list){

  if(!g.xpGiven){ g.xpGiven = true; addXP(XP.meta); state.stats.goalsCompleted = (state.stats.goalsCompleted||0)+1; }
  registerActivityToday();
  if(list.length>1 && list.every(x=>x.done)) toast('Todas as metas concluídas! A capivara aplaude 🦫👏','success');
}
function deleteCalendarGoal(dateKey, goalId){
  const entry = state.calendar[dateKey];
  if(!entry) return;
  entry.goals = entry.goals.filter(g=>g.id!==goalId);
  persist('calendar');
}

function toggleWeekGoal(dateKey, goalId){

function deleteWeekGoal(dateKey, goalId){

// --- provas e eventos ---
function upcomingEvents(days){
  const t = todayKey();
  return state.events.filter(e=>{ const d = daysBetween(t, e.date); return d>=0 && d<=days; }).sort((a,b)=> a.date.localeCompare(b.date));
}

const YT_URL_RE = /https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?[^\s]*v=|shorts\/|live\/)|youtu\.be\/)[\w-]{11}[^\s]*/;
async function messageToAPI(m, withMedia, strict){
  if(m.role!=='user'){
    if(m.kind==='quiz') return {role:'assistant', content:`(Zen criou um quiz interativo sobre "${m.data.topic}" com ${m.data.questions.length} questões.)`};
    if(m.kind==='flashcards') return {role:'assistant', content:`(Zen criou ${m.data.cards.length} flashcards sobre "${m.data.topic}".)`};
    return {role:'assistant', content:m.content};
  }
  const parts = [];
  const atts = (m.attachments||[]).slice();
  const yt = String(m.content||'').match(YT_URL_RE);
  if(yt && !atts.some(a=>a.kind==='youtube')) atts.push({kind:'youtube', url:yt[0], title:'vídeo do link'});
  for(const a of atts){
    if(a.kind==='ref'){ parts.push({text:refToText(a)}); continue; }
    if(!withMedia){ parts.push({text:`(anexo enviado antes: ${a.name||a.title||a.url})`}); continue; }
    try{
      if(a.kind==='file') parts.push(...await fileToAIParts(a));
      else if(a.kind==='youtube') parts.push({fileData:{fileUri:a.url}}, {text:`(vídeo do YouTube anexado: ${a.title||a.url})`});
    }catch(err){ if(strict) throw err; parts.push({text:`(anexo "${a.name||a.title}" não pôde ser reenviado)`}); }
  }
  parts.push({text:m.content||'(veja os anexos)'});
  return {role:'user', parts};
}
async function chatHistoryForAPI(){
  const msgs = chatMessages().filter(m=>!m.error && !m.pending).slice(-24);
  const lastUser = msgs.map(m=>m.role).lastIndexOf('user');
  const out = [];
  for(let i=0;i<msgs.length;i++) out.push(await messageToAPI(msgs[i], i>=msgs.length-8, i===lastUser));
  return out;
}

let zenFastNow = false;
// Envolve qualquer pedido à IA no chat: mostra "pensando", trata erro e dá XP/atividade
async function withChatLoading(fn, retry){
  chatSending = true;
  const chatId = ensureCurrentChat().id;
  const sendBtn = document.getElementById('chat-send'); if(sendBtn) sendBtn.disabled = true;
  zenAbort = new AbortController();
  chatStartedAt = Date.now(); clearInterval(chatElapsedTimer); chatElapsedTimer = setInterval(updateChatElapsed, 1000);
  renderChatMessages(); showChatLoading();
  zenFastNow = false;
  try{
    try{ await fn(chatId); }
    catch(err){
      // "Responder já com o modelo rápido": cancela o pedido lento e refaz com o rápido
      if(err.code!=='CANCELADO' || !zenFastNow) throw err;
      zenFastNow = false; zenAbort = new AbortController(); zenForceModel = GEMINI_FAST_MODEL;
      try{ await fn(chatId); } finally { zenForceModel = null; }
    }
    state.stats.chatMessages = (state.stats.chatMessages||0)+1;
    addXP(XP.chat); logStudyMinutes(1); registerActivityToday();
  }catch(err){
    console.error(err);
    pushChatTo(chatId, {role:'assistant', error:true, content:zenErrorMessage(err), retry});
  }finally{
    chatSending = false; zenAbort = null; zenFastNow = false; chatStartedAt = 0; clearInterval(chatElapsedTimer);
    const b = document.getElementById('chat-send'); if(b) b.disabled = false;
    if(state.settings.currentChatId===chatId) renderChatMessages();
  }
}
// Resposta sempre vai pra conversa onde a pergunta foi feita (mesmo se o Lucca trocar de conversa no meio)
function pushChatTo(chatId, msg){

  if(!c) return;
  msg.id = msg.id || uid(); msg.ts = Date.now();
  c.messages.push(msg); c.updatedAt = Date.now(); persist('chats'); renderChatList();
}

  input.value=''; autoGrow(input);
  pushChat({role:'user', content:text, attachments: atts.length ? atts : undefined});
  await requestZenReply();
}
async function requestZenReply(){

    pushChatTo(chatId, {role:'assistant', content:res.text, actions:res.actions.length ? res.actions : undefined, model:res.model});

async function maybeAutoTitle(chatId){
  const c = state.chats.find(x=>x.id===chatId);
  if(!c || !c.autoTitle || c.titled) return;
  c.titled = true;
  try{
    const first = c.messages.find(m=>m.role==='user');
    const t = await askZen([{role:'user', content:`Dê um título curto (no máximo 5 palavras, sem aspas e sem ponto final) para uma conversa de estudos que começou com: "${String(first && first.content || '').slice(0,300)}"`}], {system:'Você cria títulos curtos em português do Brasil.', model:GEMINI_FAST_MODEL||undefined});   // título não gasta a cota do modelo principal
    if(c.autoTitle){ c.title = t.replace(/["*#\n]/g,'').trim().slice(0,60) || c.title; persist('chats'); renderChatList(); if(state.settings.currentChatId===chatId) renderChatTitle(); }
  }catch(e){ /* sem título automático, tudo bem */ }

// Quiz interativo e flashcards gerados direto no chat (dá pra salvar no Banco/Flashcards)
async function runChatTool(kind, typed, silent){
  if(chatSending) return;
  let topic = typed;
  if(!topic){ const lastUser = [...chatMessages()].reverse().find(m=>m.role==='user' && !m.tool && m.content); topic = lastUser ? lastUser.content.slice(0,300) : ''; }
  if(!topic && !pendingAttachments.length){ toast('Escreva o tema na caixa de mensagem (ou anexe um material) 🦫'); document.getElementById('chat-input').focus(); return; }
  topic = topic || 'o material anexado';
  const input = document.getElementById('chat-input');
  if(input && typed){ input.value=''; autoGrow(input); }
  const atts = pendingAttachments.slice(); pendingAttachments = []; renderPendingAttachments();
  if(!silent) pushChat({role:'user', tool:kind, content:`${kind==='quiz'?'🎯 Quero um quiz interativo':'🗂️ Quero flashcards'} sobre: ${topic}`, attachments: atts.length?atts:undefined});
  await withChatLoading(async chatId=>{
    const lastUserMsg = [...chatMessages()].reverse().find(m=>m.role==='user');
    const ctx = lastUserMsg && lastUserMsg.attachments ? (await messageToAPI(lastUserMsg, true, true)).parts.slice(0,-1) : [];
    if(kind==='quiz'){
      const r = await askZenJSON(`Crie 4 questões de múltipla escolha (4 alternativas, só uma correta), de dificuldade variada, sobre: "${topic}". Em "subject" coloque o nome curto da matéria escolar relacionada. "correctIndex" é o índice (0 a 3) da correta. Formato: {"subject":"...","questions":[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]}`, ctx);
      const questions = sanitizeQuestions(r.questions);
      if(!questions.length) throw Object.assign(new Error('quiz vazio'), {code:'JSON'});
      pushChatTo(chatId, {role:'assistant', kind:'quiz', content:`Quiz sobre ${topic}`, data:{topic, subject:String(r.subject||'').trim()||'Geral', questions, answers:{}, saved:false}});
    } else {
      const r = await askZenJSON(`Crie 6 flashcards (pergunta curta na frente, resposta objetiva no verso) sobre: "${topic}". Em "subject" coloque o nome curto da matéria escolar relacionada. Formato: {"subject":"...","cards":[{"front":"...","back":"..."}]}`, ctx);
      const cards = sanitizeCards(r.cards);
      if(!cards.length) throw Object.assign(new Error('flashcards vazios'), {code:'JSON'});
      pushChatTo(chatId, {role:'assistant', kind:'flashcards', content:`Flashcards sobre ${topic}`, data:{topic, subject:String(r.subject||'').trim()||'Geral', cards, saved:false}});
    }
  }, {type:'tool', kind, topic});
}

function renderChatQuiz(m){

  return `<strong>🎯 Quiz rápido: ${escapeHTML(d.topic)}</strong>

        <div class="cq-opts">${q.options.map((o,oi)=>{

          if(done){ cls += ' disabled'; if(oi===q.correctIndex) cls += ' correct'; else if(oi===ans) cls += ' incorrect'; }
          return `<button class="${cls}" data-act="cq" data-id="${m.id}" data-q="${qi}" data-o="${oi}">${'ABCDE'[oi]}) ${escapeHTML(o)}</button>`;
        }).join('')}</div>
        ${done ? `<div class="cq-explain">${ans===q.correctIndex?'✅ Certinho!':'⚠️ Quase!'} ${escapeHTML(q.explanation||'')}</div>` : ''}

function goToTarget(go){
  const [view, id] = String(go).split(':');
  if(view==='notas' && id){ noteEditingId = id; switchView('notas'); }
  else if(view==='mapas' && id){ switchView('mapas'); openMapEditor(id); }
  else if(view==='ferramentas' && id){ pendingTool = id; switchView('ferramentas'); }
  else if(view==='quiz' && id){ let o = null; try{ o = JSON.parse(decodeURIComponent(id)); }catch(e){} switchView('quizzes'); if(o && !quizSession) startQuiz(o); }
  else if(view==='catalogo'){ videoTab = catalogOn() ? 'catalogo' : 'meus'; switchView('videos'); }
  else if(NAV_ITEMS.some(n=>n.id===view)) switchView(view);
}
function openAttachment(a){
  if(a.kind==='file'){ if(state.files.some(f=>f.id===a.id)) openFilePreview(a.id); else toast('Esse anexo foi excluído.'); }
  else if(a.kind==='youtube') window.open(a.url, '_blank', 'noopener');
  else if(a.kind==='ref') goToTarget({resumo:'resumos', nota:'notas:'+a.id, mapa:'mapas:'+a.id}[a.type] || 'dashboard');
}
function onChatClick(e){
  const chip = e.target.closest('.att-chip');
  if(chip){
    const host = chip.closest('[data-mid]');
    const m = host && chatMessages().find(x=>x.id===host.dataset.mid);
    if(m && m.attachments) openAttachment(m.attachments[+chip.dataset.att]);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act==='example'){ document.getElementById('chat-input').value = btn.dataset.text; sendChatMessage(); return; }
  if(act==='go'){ goToTarget(btn.dataset.go); return; }
  const m = chatMessages().find(x=>x.id===btn.dataset.id);
  if(!m) return;
  const msgs = chatMessages();
  if(act==='copy') copyText(m.content);
  else if(act==='resumo' || act==='nota'){
    const prevUser = msgs[msgs.indexOf(m)-1];
    const heading = (m.content.match(/^#{1,4}\s+(.+)$/m)||[])[1];
    const title = (heading || (prevUser && prevUser.role==='user' && prevUser.content ? prevUser.content : 'Do chat com o Zen')).replace(/[*_#`]/g,'').slice(0,80);
    if(act==='resumo') openResumoFormModal(null, {subject:'', title, content:m.content});
    else { const n = createNote({subject:'Geral', title, icon:'🦫', contentHTML:markdownToNoteHTML(m.content)}); toast(`Anotação "${n.title}" criada! 🗒️`, 'success'); }
  }
  else if(act==='ouvir') speakText(btn, htmlToPlain(renderMarkdown(m.content, {visuals:false})));
  else if(act==='retry'){
    if(chatSending) return;
    const c = currentChat(); c.messages = c.messages.filter(x=>x.id!==m.id); persist('chats');
    if(m.retry && m.retry.type==='tool') runChatTool(m.retry.kind, m.retry.topic, true);
    else requestZenReply();
  }
  else if(act==='cq'){
    const qi = +btn.dataset.q, oi = +btn.dataset.o;
    if(m.data.answers[qi]!==undefined) return;
    m.data.answers[qi] = oi;
    if(oi===m.data.questions[qi].correctIndex) addXP(XP.questaoCerta);
    persist('chats'); registerActivityToday(); refreshChatMessage(m);
  }
  else if(act==='save-quiz' && !m.data.saved){
    const subject = ensureSubject(m.data.subject||'Geral');
    m.data.questions.forEach(q=> state.questions.push(newQuestion(subject, 'médio', q)));
    m.data.saved = true; persist('questions'); persist('chats'); refreshChatMessage(m);
    toast(`${m.data.questions.length} questões salvas no Banco (${subject})!`, 'success'); checkAchievements();
  }
  else if(act==='save-cards' && !m.data.saved){
    const subject = ensureSubject(m.data.subject||'Geral');
    m.data.cards.forEach(c=> state.flashcards.push(newFlashcard(subject, c.front, c.back)));
    addXP(m.data.cards.length*XP.flashcardCriado);
    m.data.saved = true; persist('flashcards'); persist('chats'); refreshChatMessage(m);
    toast(`${m.data.cards.length} flashcards salvos em ${subject}!`, 'success'); checkAchievements();
  }
}
// O Zen lê a resposta em voz alta (clicar de novo para)
function speakText(btn, text){
  if(!('speechSynthesis' in window)){ toast('Seu navegador não tem leitura em voz alta.','error'); return; }
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(text.slice(0, 4000));
  u.lang = 'pt-BR'; u.rate = 1.02;
  const voice = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('pt'));
  if(voice) u.voice = voice;
  btn.textContent = '⏹️ Parar'; u.onend = u.onerror = ()=>{ btn.textContent = '🔊 Ouvir'; };
  speechSynthesis.speak(u);
}
function exportCurrentChat(){
  const c = currentChat(); if(!c) return;
  const md = `# ${c.title}\n\n` + c.messages.filter(m=>!m.error).map(m=>{
    const who = m.role==='user' ? `**${userName()}:**` : '**Zen:**';
    const atts = m.attachments ? '\n' + m.attachments.map(a=>`> 📎 ${a.name||a.title||a.url}`).join('\n') : '';
    const body = m.kind==='quiz' ? m.data.questions.map((q,i)=>`${i+1}. ${q.question}\n${q.options.map((o,j)=>`   ${'ABCDE'[j]}) ${o}${j===q.correctIndex?' ✓':''}`).join('\n')}`).join('\n')
      : m.kind==='flashcards' ? m.data.cards.map(x=>`- **${x.front}** — ${x.back}`).join('\n') : m.content;
    return `${who}${atts}\n\n${body}`;
  }).join('\n\n---\n\n');
  downloadText(`${c.title.replace(/[\\/:*?"<>|]/g,'').slice(0,50)||'conversa'}.md`, md, 'text/markdown');
}
function downloadText(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:(type||'text/plain')+';charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyText(text){
  const fallback = ()=>{
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copiado!','success'); }catch(e){ toast('Não consegui copiar.','error'); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>toast('Copiado!','success'), fallback);
  else fallback();
}
function setupVoiceButton(){
  const micBtn = document.getElementById('chat-mic');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){ micBtn.disabled = true; micBtn.title='Reconhecimento de voz não disponível neste navegador'; return; }
  let recognition = null, listening = false;
  micBtn.addEventListener('click', ()=>{
    if(listening){ recognition && recognition.stop(); return; }
    recognition = new SpeechRec();
    recognition.lang = 'pt-BR';
    recognition.interimResults = false;
    recognition.onresult = e=>{
      const input = document.getElementById('chat-input');
      if(!input) return;
      const said = e.results[0][0].transcript;
      input.value = input.value.trim() ? input.value.trim()+' '+said : said;
      autoGrow(input); input.focus();
    };
    recognition.onstart = ()=>{ listening=true; micBtn.classList.add('listening'); };
    recognition.onend = ()=>{ listening=false; micBtn.classList.remove('listening'); };
    recognition.onerror = ev=>{ listening=false; micBtn.classList.remove('listening'); if(ev.error==='not-allowed') toast('Permita o uso do microfone pra falar com o Zen.','error'); };
    recognition.start();
  });
}

function dueFlashcards(subject){
  const now = Date.now();
  return state.flashcards.filter(f=> (!subject || f.subject===subject) && (!f.nextReview || f.nextReview<=now));
}
// Algoritmo SM-2 (o mesmo princípio do Anki): calcula o próximo intervalo sem alterar o cartão
function computeSchedule(card, quality){
  let repetitions = card.repetitions||0, ease = card.ease||2.5, interval = card.interval||0;
  if(quality < 3){ repetitions = 0; interval = 1; }
  else {
    repetitions += 1;
    if(repetitions===1) interval = 1;
    else if(repetitions===2) interval = 6;
    else interval = Math.round(interval*ease);
    if(quality===5) interval = Math.max(interval+1, Math.round(interval*1.3)); // bônus do "Fácil"
    ease = Math.max(1.3, ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  }
  return {repetitions, ease, interval};
}
function scheduleFlashcard(card, quality){
  Object.assign(card, computeSchedule(card, quality));
  card.nextReview = Date.now() + card.interval*86400000;
  card.reviewLog = card.reviewLog || [];
  card.reviewLog.push(Date.now());
  if(card.reviewLog.length>60) card.reviewLog = card.reviewLog.slice(-60);
  card.correctCount = (card.correctCount||0) + (quality>=3?1:0);
  card.totalReviews = (card.totalReviews||0) + 1;
}
function fmtInterval(days){
  if(days>=365) return `~${Math.round(days/365)} ${plural(Math.round(days/365),'ano')}`;
  if(days>=30) return `~${Math.round(days/30)} ${plural(Math.round(days/30),'mês','meses')}`;
  return `${days} ${plural(days,'dia')}`;
}
function nextReviewLabel(f){
  if(!f.nextReview || f.nextReview<=Date.now()) return 'revisar hoje';
  const d = Math.ceil((f.nextReview-Date.now())/86400000);
  return d<=1 ? 'próxima revisão amanhã' : `próxima revisão em ${fmtInterval(d)}`;
}

function startReviewSession(subject){
  reviewQueue = shuffleArray(dueFlashcards(subject));
  if(reviewQueue.length===0){ toast('Nenhum flashcard pendente agora. Tudo em dia! ✨'); return; }
  reviewIndex = 0; reviewShowingBack = false;
  reviewSession = {subject, total:reviewQueue.length, firstTry:{}};
  renderReviewSession();
}
function renderReviewSession(){
  const root = document.getElementById('view-root');
  if(reviewIndex >= reviewQueue.length){
    const results = Object.values(reviewSession.firstTry);
    const ok = results.filter(Boolean).length;
    root.innerHTML = `<div class="empty-state">
      ${capySVG(ok>=results.length/2?'happy':'icon','mascot-float',76)}
      <h3>Revisão concluída! 🎉</h3>
      <p>Você revisou ${results.length} ${plural(results.length,'cartão','cartões')}: <b>${ok}</b> de primeira e <b>${results.length-ok}</b> pra reforçar.</p>
      <p>${ok===results.length ? 'Memória de capivara elefante! 🦫' : 'Os que você errou já estão agendados pra voltar logo. É assim que fixa!'}</p>
      <button class="btn btn-primary" onclick="switchView('flashcards')">Voltar aos Flashcards</button>
    </div>`;
    reviewSession = null;
    return;
  }
  const card = reviewQueue[reviewIndex];
  const done = Object.keys(reviewSession.firstTry).length;
  const label = q=> q<3 ? 'revê já' : fmtInterval(computeSchedule(card,q).interval);
  root.innerHTML = `
    <div class="view-header"><h2>🗂️ Revisando${reviewSession.subject?': '+escapeHTML(reviewSession.subject):''}</h2><p>${done} de ${reviewSession.total} ${plural(reviewSession.total,'cartão','cartões')} · <span class="badge badge-primary">${escapeHTML(card.subject)}</span></p></div>
    <div class="progress-bar" style="max-width:480px; margin:0 auto 18px;"><div style="width:${Math.round(done/reviewSession.total*100)}%"></div></div>
    <div class="flip-card" id="flip-card" role="button" tabindex="0" aria-label="Virar cartão">
      <div class="flip-card-inner">
        <div class="flip-face flip-front">${cardFaceHTML(card.front, card)}<span class="flip-hint">toque (ou espaço) para virar</span></div>
        <div class="flip-face flip-back">${cardFaceHTML(card.back, card)}</div>
      </div>
    </div>
    <div id="review-rate-row" class="review-rate-row" style="visibility:hidden;">
      <button class="btn btn-danger" data-q="0">1 · Errei <small>(${label(0)})</small></button>
      <button class="btn btn-ghost" data-q="3">2 · Difícil <small>(${label(3)})</small></button>
      <button class="btn btn-primary" data-q="4">3 · Bom <small>(${label(4)})</small></button>
      <button class="btn btn-accent" data-q="5">4 · Fácil <small>(${label(5)})</small></button>
    </div>
    <p style="text-align:center; margin-top:16px;"><button class="btn btn-ghost btn-sm" onclick="switchView('flashcards')">Encerrar revisão</button></p>
  `;
  if(card.fmt==='md') hydrateVisuals(root);
  document.getElementById('flip-card').addEventListener('click', flipReviewCard);
  document.querySelectorAll('#review-rate-row [data-q]').forEach(b=> b.addEventListener('click', e=>{ e.stopPropagation(); rateReviewCard(parseInt(b.dataset.q)); }));
}
function flipReviewCard(){
  const el = document.getElementById('flip-card');
  if(!el) return;
  reviewShowingBack = !reviewShowingBack;
  el.classList.toggle('flipped', reviewShowingBack);
  document.getElementById('review-rate-row').style.visibility='visible';
}
function rateReviewCard(q){
  const card = reviewQueue[reviewIndex];
  if(!card) return;
  scheduleFlashcard(card, q);
  persist('flashcards');
  if(!(card.id in reviewSession.firstTry)) reviewSession.firstTry[card.id] = q>=3;
  if(q<3) reviewQueue.push(card);          // errou: volta no fim desta mesma sessão
  state.stats.flashcardsReviewed = (state.stats.flashcardsReviewed||0)+1;
  persist('stats');
  addXP(XP.flashcardRevisado);
  logStudyMinutes(0.5, card.subject);
  registerActivityToday();
  reviewIndex++; reviewShowingBack=false;
  renderReviewSession();
}

      <p class="muted-sm" id="qz-lock-note" style="margin-bottom:10px; display:none;">🔒 Durante a prova, as outras abas ficam bloqueadas. Se tentar sair, aparecem 2 avisos; na terceira vez a prova é pausada e fica salva pra você continuar depois.</p>

    <div class="section-title"><h3>Histórico</h3></div>
    <div class="grid grid-3" id="qz-history"></div>
  `;
  const goBanco = document.getElementById('qz-go-banco');
  if(goBanco) goBanco.addEventListener('click', ()=> switchView('banco'));
  if(saved){
    document.getElementById('qz-resume').addEventListener('click', resumeQuiz);
    document.getElementById('qz-discard').addEventListener('click', ()=>{ if(confirm('Descartar a prova pausada? As respostas dela serão perdidas.')){ saveData('quizSaved', null); renderQuizzes(root); } });
  }
  const countEl = document.getElementById('qz-count'), timeEl = document.getElementById('qz-time'), modeEl = document.getElementById('qz-mode');
  const syncTime = ()=>{ if(!quizTimeTouched) timeEl.value = Math.max(1, Math.round((parseInt(countEl.value)||10)*(modeEl.value==='prova'?3:1.5))); };
  const syncMode = ()=>{
    const timed = modeEl.value!=='pratica';

    document.getElementById('qz-full-row').style.display = timed ? 'flex' : 'none';

  };
  const updateAvailable = ()=>{
    const subject = document.getElementById('qz-subject').value, diff = document.getElementById('qz-diff').value;
    const n = state.questions.filter(q=> (!subject||q.subject===subject) && (!diff||q.difficulty===diff)).length;
    document.getElementById('qz-available').textContent = `${n} ${plural(n,'questão disponível','questões disponíveis')} com esses filtros.`;
  };

  countEl.addEventListener('input', syncTime);

  document.getElementById('qz-diff').addEventListener('change', updateAvailable);
  document.getElementById('qz-start-btn').addEventListener('click', ()=>{
    if(savedQuiz() && !confirm('Você tem uma prova pausada. Começar uma nova vai descartar a pausada. Continuar?')) return;
    const mode = modeEl.value;
    startQuiz({
      subject: document.getElementById('qz-subject').value,
      difficulty: document.getElementById('qz-diff').value,
      count: clamp(parseInt(countEl.value)||10, 1, 90),
      mode,
      timeLimit: mode!=='pratica' ? clamp(parseInt(timeEl.value)||15, 1, 300) : null,

      fullscreen: mode!=='pratica' && document.getElementById('qz-full').checked
    });
  });
  syncMode(); updateAvailable();
  renderQuizHistory();

}
function renderQuizHistory(){
  const holder = document.getElementById('qz-history');
  if(!holder) return;
  if(state.quizAttempts.length===0){ holder.innerHTML = `<p class="muted-sm" style="grid-column:1/-1;">Nenhum simulado feito ainda.</p>`; return; }
  const recent = state.quizAttempts.slice().reverse().slice(0,9);
  holder.innerHTML = recent.map(a=>{
    const pct = a.total ? Math.round(a.score/a.total*100) : 0;
    return `<div class="card card-hover history-card" data-id="${a.id}" role="button" tabindex="0">
      <div class="card-actions"><span class="badge ${pct>=70?'badge-success':'badge-danger'}">${a.score}/${a.total} · ${pct}%</span><span class="badge">${a.mode==='prova'?'📄 prova':a.mode==='simulado'?'⏳ simulado':'prática'}</span></div>
      <p style="margin:8px 0 2px; font-weight:600;">${escapeHTML(a.subject||'Todas as matérias')}</p>
      <p class="muted-sm" style="font-size:12px;">${new Date(a.date).toLocaleDateString('pt-BR')}${a.timeSpentSec?` · ${Math.max(1,Math.round(a.timeSpentSec/60))} min`:''}${a.warnings?` · ⚠️ ${a.warnings} ${plural(a.warnings,'aviso')}`:''}</p>
    </div>`;
  }).join('');
  holder.querySelectorAll('.history-card').forEach(c=>{
    const open = ()=> openAttemptModal(state.quizAttempts.find(a=>a.id===c.dataset.id));
    c.addEventListener('click', open);
