<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Estudos</title>
<script>/* aplica o tema salvo antes de desenhar a página (evita "piscar" no tema claro) */
try{var zp=null;try{zp=localStorage.getItem('zenEstudosPerfilAtual')}catch(e){}var zs=JSON.parse(localStorage.getItem((zp&&zp!=='lucca'?'zenEstudos_'+zp+'_':'zenEstudos_')+'settings')||'null');var zt=zs&&zs.theme?zs.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',zt);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface-2:#E7ECE3;
  --text:#1C2B26; --text-muted:#5B6B63;
  --primary:#2C6E5C; --primary-strong:#1F4D40; --primary-soft:#DCEAE4;
  --accent:#E8A33D; --accent-soft:#FBE7C6; --accent-ink:#4A340D;
  --info:#6B8FA3; --info-soft:#DEE9EE;
  --danger:#C1564A; --danger-soft:#F5DEDB;
  --success:#3F8F5F; --success-soft:#DCEEE1;
  --border:#DDE3D8;
  --shadow:0 10px 28px -12px rgba(44,110,92,.28);
  --shadow-sm:0 2px 10px -3px rgba(28,43,38,.16);
  --radius-sm:8px; --radius-md:14px; --radius-lg:22px;
  --font-display:'Sora',system-ui,sans-serif;
  --font-serif:'Source Serif 4',Georgia,serif;
  --accent-text:#4A340D; --on-primary:#FFFFFF;
  --hero-from:#2C6E5C; --hero-to:#1F4D40;
  --sidebar-w:252px;
}
[data-theme="dark"]{
  --bg:#121917; --surface:#1B2420; --surface-2:#222E28;
  --text:#EDEFEA; --text-muted:#9FB0A7;
  --primary:#4FA98A; --primary-strong:#6FC2A4; --primary-soft:#1E3830;
  --accent:#F0B255; --accent-soft:#3A2E1A; --accent-ink:#2E2007;
  --info:#8FB3C7; --info-soft:#1E2E35;
  --danger:#E08177; --danger-soft:#3A211F;
  --success:#6BC28E; --success-soft:#1E3327;
  --border:#2A3733;
  --shadow:0 10px 30px -10px rgba(0,0,0,.5);
  --shadow-sm:0 2px 10px -3px rgba(0,0,0,.35);
  --accent-text:#F0B255; --on-primary:#0E1A16;
  --hero-from:#24584A; --hero-to:#163A30;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-display); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 6px; line-height:1.2; letter-spacing:-.01em;}
p{margin:0 0 10px;}
a{color:var(--primary);}
button{font-family:var(--font-display);}
::selection{background:var(--accent-soft); color:var(--accent-text);}
*:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

/* ============ LAYOUT ============ */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:4px 10px 22px;}
.sidebar-brand .mascot-sprite{width:34px; height:34px;}
.sidebar-brand strong{font-size:17px; font-weight:700;}
.sidebar-brand span{display:block; font-size:11.5px; color:var(--text-muted); font-weight:500;}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer;
  color:var(--text-muted); font-weight:500; font-size:14px; background:transparent;
  border:none; border-left:3px solid transparent; transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--primary-soft); color:var(--primary-strong); font-weight:600; border-left-color:var(--primary);}
.nav-icon{font-size:17px; width:20px; text-align:center; flex-shrink:0;}
.sidebar-foot{padding-top:14px; border-top:1px solid var(--border); margin-top:10px; font-size:12px; color:var(--text-muted); display:flex; align-items:center; justify-content:space-between;}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 32px; border-bottom:1px solid var(--border); position:sticky; top:0;
  background:var(--bg); z-index:10;
}
.topbar h1{font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.streak-pill{
  display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-text);
  padding:7px 13px; border-radius:999px; font-weight:700; font-size:13.5px;
}
.theme-toggle{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:transform .15s;
}
.theme-toggle:hover{transform:scale(1.07); background:var(--surface-2);}
.mobile-nav-toggle{display:none; width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:17px;cursor:pointer;}

.view-root{padding:30px 32px 70px; max-width:1080px; width:100%; margin:0 auto;}
.view-header{margin-bottom:22px;}
.view-header p{color:var(--text-muted); font-size:14px; max-width:60ch;}

/* ============ COMPONENTS ============ */
.btn{
  font-weight:600; font-size:14px; padding:10px 18px; border-radius:var(--radius-sm);
  border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition:transform .12s ease,box-shadow .12s ease,background .15s ease,border-color .15s;
  background:var(--surface-2); color:var(--text);
}
.btn-primary{background:var(--primary); color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-strong); box-shadow:var(--shadow-sm); transform:translateY(-1px);}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-accent:hover{filter:brightness(1.06); transform:translateY(-1px);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-danger:hover{filter:brightness(.97);}
.btn-sm{padding:6px 13px; font-size:13px;}
.btn-block{width:100%; justify-content:center;}
.btn-icon{padding:8px; border-radius:50%; width:36px; height:36px; justify-content:center;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px;}
.card-hover{transition:box-shadow .15s,transform .15s;}
.card-hover:hover{box-shadow:var(--shadow-sm); transform:translateY(-2px);}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

label{display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text-muted);}
.input,textarea,select{
  font-family:var(--font-display); font-size:14px; padding:10px 13px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text); width:100%;
}
textarea{font-family:var(--font-serif); resize:vertical; line-height:1.5;}
.input:focus,textarea:focus,select:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
.field{margin-bottom:14px;}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.field-row>.field{flex:1; min-width:140px;}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--surface-2); color:var(--text-muted);}
.badge-primary{background:var(--primary-soft); color:var(--primary-strong);}
.badge-accent{background:var(--accent-soft); color:var(--accent-text);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}
.badge-success{background:var(--success-soft); color:var(--success);}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; cursor:pointer; transition:all .15s; color:var(--text);}
.chip:hover{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-strong);}
.chip.active{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-muted); border:1.5px dashed var(--border); border-radius:var(--radius-lg);}
.empty-state .mascot-sprite{width:64px; height:64px; margin-bottom:10px; opacity:.9;}
.empty-state h3{color:var(--text); margin-bottom:4px;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,15,12,.55); display:flex; align-items:center; justify-content:center; z-index:300; padding:20px; animation:fade-in .15s ease;}
.modal{background:var(--surface); border-radius:var(--radius-lg); padding:26px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow); animation:modal-in .2s ease;}
.modal-close{position:sticky; top:0; float:right; background:var(--surface-2); color:var(--text); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px;}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
@keyframes modal-in{from{opacity:0; transform:translateY(8px) scale(.98);}to{opacity:1; transform:translateY(0) scale(1);}}

#toast-container{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:400; max-width:320px;}
.toast{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow); font-size:13.5px; animation:toast-in .25s ease; display:flex; gap:10px; align-items:flex-start;}
.toast-success{border-left:4px solid var(--success);}
.toast-error{border-left:4px solid var(--danger);}
.toast-info{border-left:4px solid var(--info);}
@keyframes toast-in{from{opacity:0; transform:translateX(16px);}to{opacity:1; transform:translateX(0);}}

.mascot-sprite{display:inline-block;}
.mascot-float{animation:mascot-float 3.6s ease-in-out infinite;}
@keyframes mascot-float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(-2deg);}}
.spinner{width:18px; height:18px; border:2.5px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ DASHBOARD ============ */
.hero{
  background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);
  border-radius:var(--radius-lg); padding:34px 36px; color:#fff; position:relative; overflow:hidden;
  margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.hero::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 20%,rgba(232,163,61,.28),transparent 55%);}
.hero-text{position:relative; z-index:1;}
.hero-text h2{font-size:26px; font-weight:700; color:#fff; margin-bottom:6px;}
.hero-text p{color:rgba(255,255,255,.85); font-size:14.5px; margin-bottom:0;}
.hero-mascot{position:relative; z-index:1; width:96px; height:96px; flex-shrink:0;}
.hero-streak{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; margin-top:12px; position:relative; z-index:1;}

.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media (max-width:860px){.dash-grid{grid-template-columns:1fr;}}
.goal-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.goal-row:last-child{border-bottom:none;}
.goal-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--primary); cursor:pointer;}
.goal-row.done span{text-decoration:line-through; color:var(--text-muted);}
.goal-row span{flex:1; font-size:14px;}
.quick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
.quick-link{
  display:flex; flex-direction:column; gap:6px; padding:16px; border-radius:var(--radius-md);
  background:var(--surface-2); color:var(--text); border:1px solid var(--border); cursor:pointer; text-align:left;
  transition:all .15s;
}
.quick-link:hover{border-color:var(--primary); background:var(--primary-soft); transform:translateY(-2px);}
.quick-link .qi{font-size:21px;}
.quick-link b{font-size:13.5px;}
.week-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:12px; text-align:center;}
.week-stats .num{font-size:24px; font-weight:800; color:var(--primary-strong);}
[data-theme="dark"] .week-stats .num{color:var(--primary-strong);}
.week-stats .lbl{font-size:11.5px; color:var(--text-muted); font-weight:600;}

/* ---- Calendário ---- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11.5px; font-weight:700; color:var(--text-muted); padding-bottom:4px;}
.cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:var(--radius-sm); cursor:pointer; font-size:13.5px; gap:3px; border:1px solid transparent; position:relative;}
.cal-cell:not(.empty):hover{background:var(--surface-2);}
.cal-cell.is-today{font-weight:800; color:var(--primary-strong); border-color:var(--primary);}
.cal-cell.is-selected{background:var(--primary-soft);}
.cal-dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}
.cal-dot.done{background:var(--success);}

/* ---- Chat ---- */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 250px); min-height:420px;}
.chat-messages{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:6px 2px 16px;}
.msg{max-width:74%; padding:12px 16px; border-radius:var(--radius-md); font-family:var(--font-serif); font-size:14.5px; line-height:1.55; white-space:pre-wrap;}
.msg-user{align-self:flex-end; background:var(--primary); color:var(--on-primary); border-bottom-right-radius:4px;}
.msg-zen{align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:4px; display:flex; gap:10px;}
.msg-zen svg.mascot-sprite{width:26px; height:26px; flex-shrink:0; margin-top:2px;}
.msg-zen-text{flex:1; min-width:0;}
.chat-input-bar{display:flex; gap:8px; align-items:flex-end; padding-top:12px; border-top:1px solid var(--border);}
.chat-input-bar textarea{resize:none; font-family:var(--font-display); min-height:42px;}
.mic-btn.listening{background:var(--danger-soft); color:var(--danger);}
#chat-mic.listening{background:var(--danger-soft); border-color:var(--danger); animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* ---- Resumos ---- */
.resumo-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
.resumo-toolbar .input{max-width:280px;}
.resumo-card{cursor:pointer; display:flex; flex-direction:column; gap:8px;}
.resumo-card h4{font-size:15px;}
.resumo-card p{font-family:var(--font-serif); font-size:13.5px; color:var(--text-muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; margin-bottom:0;}
.resumo-content-view{font-family:var(--font-serif); font-size:15px; line-height:1.75; white-space:pre-wrap; margin-top:10px;}

/* ---- Flashcards ---- */
.flip-card{perspective:1200px; max-width:480px; margin:0 auto 26px; height:260px; cursor:pointer;}
.flip-card-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; text-align:center; padding:28px; box-shadow:var(--shadow-sm);}
.flip-face p{font-family:var(--font-serif); font-size:19px; line-height:1.5; margin:0;}
.flip-back{transform:rotateY(180deg); background:var(--primary-soft);}
.flip-hint{position:absolute; bottom:14px; font-size:11.5px; color:var(--text-muted);}
.review-rate-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

/* ---- Quiz / Simulado ---- */
.quiz-top{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text-muted); flex-wrap:wrap;}
.quiz-question-text{font-family:var(--font-serif); font-size:17px; line-height:1.5; margin-bottom:16px;}
#qz-options{display:flex; flex-direction:column; gap:10px;}
.quiz-option{text-align:left; padding:12px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-size:14px; transition:all .15s;}
.quiz-option:hover{border-color:var(--primary);}
.quiz-option.selected{border-color:var(--primary); background:var(--primary-soft);}
.quiz-option.disabled{cursor:default; pointer-events:none;}
.quiz-option.correct{border-color:var(--success); background:var(--success-soft);}
.quiz-option.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.quiz-explain{margin-top:14px; padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px;}
.quiz-explain.ok{background:var(--success-soft); color:var(--success);}
.quiz-explain.bad{background:var(--danger-soft); color:var(--danger);}
.quiz-explain p{color:var(--text); margin-top:4px; margin-bottom:0;}

/* ---- Vídeos ---- */
.video-embed{position:relative; width:100%; padding-top:56.25%; border-radius:var(--radius-sm); overflow:hidden; margin:10px 0; background:#000;}
.video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

/* ---- Mapas Mentais ---- */
.map-toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.map-toolbar .btn.active{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}
.map-canvas{position:relative; width:100%; height:480px; background:var(--surface); border:1.5px dashed var(--border); border-radius:var(--radius-lg); overflow:auto;}
.map-edges{position:absolute; left:0; top:0; pointer-events:none; overflow:visible;}
.map-node{position:absolute; min-width:90px; max-width:180px; padding:10px 14px; background:var(--primary-soft); color:var(--primary-strong); border:1.5px solid var(--primary); border-radius:var(--radius-md); font-size:13px; font-weight:600; cursor:grab; text-align:center; user-select:none;}
.map-node:active{cursor:grabbing;}
.map-node.selecting{outline:3px solid var(--accent);}

/* ---- Anotações ---- */
.notas-layout{display:grid; grid-template-columns:230px 1fr; gap:18px;}
@media (max-width:760px){.notas-layout{grid-template-columns:1fr;}}
.notas-sidebar{position:sticky; top:84px; align-self:start;}
.note-item{padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; display:flex; flex-direction:column; gap:1px; margin-bottom:3px;}
.note-item:hover{background:var(--surface-2);}
.note-item.active{background:var(--primary-soft);}
.note-item strong{font-size:13.5px;}
.note-item span{font-size:11px; color:var(--text-muted);}
.note-toolbar{display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:12px;}
.note-editable{min-height:320px; font-family:var(--font-serif); font-size:15px; line-height:1.7; outline:none;}
.note-editable:empty::before{content:'Comece a escrever…'; color:var(--text-muted);}

/* ---- Progresso ---- */
.chart-box{position:relative; height:230px;}
.chart-box-sm{position:relative; height:140px;}

/* ---- Conquistas ---- */
.achv-card{text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;}
.achv-icon{font-size:34px; margin-bottom:6px;}
.achv-card.locked{opacity:.45; filter:grayscale(.4);}
.achv-card p{font-size:12.5px; color:var(--text-muted); margin-bottom:0;}

/* ---- Modo Foco (Pomodoro) ---- */
.pomo-wrap{max-width:400px; margin:0 auto; text-align:center;}
.pomo-circle{position:relative; width:240px; height:240px; margin:0 auto 20px;}
.pomo-circle svg{width:100%; height:100%; transform:rotate(-90deg);}
.pomo-track{fill:none; stroke:var(--border); stroke-width:10;}
.pomo-progress{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
.pomo-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;}
.pomo-time{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;}
.pomo-phase{font-size:13px; color:var(--text-muted); font-weight:600;}
.pomo-controls{display:flex; gap:10px; justify-content:center; margin-bottom:14px;}
.pomo-settings{margin-top:20px; text-align:left; font-size:13px; color:var(--text-muted);}
.pomo-settings summary{cursor:pointer; font-weight:600;}

/* ============ EXTRAS (componentes compartilhados) ============ */
.muted-sm{color:var(--text-muted); font-size:13.5px; margin-bottom:0;}
.notice{display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-text); font-size:13.5px; margin-bottom:14px;}
.notice .mascot-sprite{width:34px; height:34px; flex-shrink:0;}
.notice code{font-weight:700;}
.progress-bar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
.progress-bar>div{height:100%; background:var(--primary); border-radius:999px; transition:width .4s ease;}
.card-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.section-title{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:26px 0 12px; flex-wrap:wrap;}
.section-title h3{margin:0;}
.check-row{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); font-weight:500; cursor:pointer; margin-bottom:14px;}
.check-row input{width:17px; height:17px; accent-color:var(--primary); margin:0;}

/* ---- Tela de carregamento ---- */
.splash{position:fixed; inset:0; z-index:1000; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:20px; transition:opacity .45s ease,visibility .45s ease;}
.splash.hide{opacity:0; visibility:hidden;}
.splash .mascot-sprite{width:112px; height:112px;}
.splash-title{font-size:24px; font-weight:800; color:var(--primary-strong); letter-spacing:-.02em;}
.splash-msg{font-size:14px; color:var(--text-muted);}
.splash-dots{display:flex; gap:6px; margin-top:4px;}
.splash-dots span{width:8px; height:8px; border-radius:50%; background:var(--accent); animation:dot-bounce 1s infinite ease-in-out;}
.splash-dots span:nth-child(2){animation-delay:.15s;}
.splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0); opacity:.45;}40%{transform:translateY(-7px); opacity:1;}}

/* ---- Saudação animada ---- */
.greet-anim{animation:greet-in .7s cubic-bezier(.2,.8,.2,1) both;}
.greet-sub{transition:opacity .35s ease,transform .35s ease; min-height:1.5em;}
.greet-sub.swap{opacity:0; transform:translateY(6px);}
@keyframes greet-in{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:translateY(0);}}
.hero-chips{display:flex; gap:8px; flex-wrap:wrap;}

/* ---- Navegação: contadores e timer no topo ---- */
.nav-item{position:relative;}
.nav-badge{margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; line-height:1;}
.nav-badge[hidden]{display:none;}
.pomo-pill{display:none; align-items:center; gap:6px; background:var(--primary-soft); color:var(--primary-strong); padding:7px 13px; border-radius:999px; font-weight:700; font-size:13.5px; border:none; cursor:pointer; font-variant-numeric:tabular-nums; font-family:var(--font-display);}
.pomo-pill.show{display:inline-flex;}

/* ---- Celebração de conquistas (capivara comemorando) ---- */
.celebrate-overlay{position:fixed; inset:0; z-index:500; background:rgba(10,15,12,.6); display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden; animation:fade-in .2s ease;}
.celebrate-card{position:relative; z-index:1; background:var(--surface); border-radius:var(--radius-lg); padding:28px 26px 22px; max-width:360px; width:100%; text-align:center; box-shadow:var(--shadow); animation:pop-in .5s cubic-bezier(.2,1.4,.4,1) both;}
.celebrate-card .mascot-sprite{width:100px; height:100px; animation:capy-dance .9s ease-in-out infinite;}
.celebrate-card .achv-icon{font-size:40px; margin:2px 0 6px;}
.celebrate-card p{color:var(--text-muted); font-size:14px;}
.celebrate-quote{font-family:var(--font-serif); font-style:italic;}
.confetti{position:absolute; top:-14px; width:9px; height:14px; border-radius:2px; animation-name:confetti-fall; animation-timing-function:linear; animation-fill-mode:forwards;}
@keyframes pop-in{from{opacity:0; transform:scale(.7);}to{opacity:1; transform:scale(1);}}
@keyframes capy-dance{0%,100%{transform:rotate(-6deg) translateY(0);}50%{transform:rotate(6deg) translateY(-8px);}}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(720deg);}}

/* ---- Nível e XP ---- */
.xp-bar{height:10px; border-radius:999px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:10px; max-width:360px; position:relative; z-index:1;}
.xp-bar>div{height:100%; background:var(--accent); border-radius:999px; transition:width .6s ease;}
.xp-rules{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px 18px; font-size:13.5px;}
.xp-rules div{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--border);}
.xp-rules b{color:var(--primary-strong); white-space:nowrap;}
.achv-date{font-size:11px; color:var(--success); font-weight:700; margin-top:4px;}

/* ---- Início ---- */
.reminder-list{display:flex; flex-direction:column; gap:8px;}
.reminder{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:var(--radius-sm); background:var(--surface-2); border:1px solid transparent; font-family:var(--font-display); font-size:13.5px; color:var(--text); text-align:left; cursor:pointer; transition:background .15s,border-color .15s;}
.reminder:hover{background:var(--primary-soft); border-color:var(--primary);}
.reminder.urgent{background:var(--danger-soft);}
.reminder .ri{font-size:18px; flex-shrink:0;}
.reminder .rt{flex:1;}
.tip-card{display:flex; gap:14px; align-items:center;}
.tip-card .mascot-sprite{width:62px; height:62px; flex-shrink:0;}
.tip-card p{font-family:var(--font-serif); font-size:14.5px; margin:0;}
.quick-link small{font-size:12px; color:var(--text-muted); font-weight:500;}

/* ---- Markdown (respostas do Zen e resumos) ---- */
.md-content{white-space:normal;}
.md-content p{margin:0 0 8px;}
.md-content>*:last-child{margin-bottom:0;}
.md-content h2,.md-content h3,.md-content h4{font-size:15.5px; margin:12px 0 6px;}
.md-content>h2:first-child,.md-content>h3:first-child,.md-content>h4:first-child{margin-top:0;}
.md-content ul,.md-content ol{margin:4px 0 10px; padding-left:22px;}
.md-content li{margin-bottom:3px;}
.md-content code{font-family:ui-monospace,Consolas,monospace; font-size:.88em; background:var(--surface); border:1px solid var(--border); padding:1px 5px; border-radius:5px;}
.md-content pre{background:var(--surface); border:1px solid var(--border); padding:10px 12px; border-radius:var(--radius-sm); overflow-x:auto; margin:6px 0 10px; white-space:pre;}
.md-content pre code{border:none; padding:0; background:none;}
.md-content hr{border:none; border-top:1px solid var(--border); margin:14px 0;}
.md-content blockquote{margin:6px 0 10px; padding:4px 12px; border-left:3px solid var(--accent); color:var(--text-muted);}

/* ---- Chat ---- */
.chat-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.msg-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center;}
.msg-action{font-family:var(--font-display); font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all .15s;}
.msg-action:hover:not(:disabled){color:var(--primary-strong); border-color:var(--primary);}
.msg-action:disabled{opacity:.75; cursor:default;}
.msg-zen{white-space:normal;}   /* respostas do Zen são HTML montado; só as mensagens do Lucca preservam quebras */
.msg-wide{width:min(640px,94%); max-width:94%;}
.msg-error{background:var(--danger-soft); border-color:var(--danger);}
.cq-item{margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
.cq-q{font-weight:600; margin-bottom:8px;}
.cq-opts{display:flex; flex-direction:column; gap:6px;}
.cq-opts .quiz-option{padding:8px 12px; font-size:13.5px; font-family:var(--font-display);}
.cq-explain{margin-top:8px; font-size:13.5px;}
.fc-preview{display:grid; gap:8px; margin-top:10px;}
.fc-preview div{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; font-size:13.5px;}
.fc-preview b{display:block; margin-bottom:2px;}
.chat-examples{justify-content:center; margin-top:14px;}

/* ---- Calendário ---- */
.cal-toolbar{display:flex; gap:8px; align-items:center;}
.cal-markers{display:flex; gap:3px; min-height:6px;}
.cal-dot.event{background:var(--danger);}
.cal-dot.event.other{background:var(--info);}
.cal-layout{display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-top:16px; align-items:start;}
@media (max-width:860px){.cal-layout{grid-template-columns:1fr;}}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.subhead{font-size:13px; font-weight:700; color:var(--text-muted); margin:18px 0 4px;}

/* ---- Simulados ---- */
.quiz-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.quiz-actions .btn{flex:1; justify-content:center; min-width:130px;}
.qz-nav-grid{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.qz-nav-btn{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; font-size:12.5px; cursor:pointer; font-family:var(--font-display);}
.qz-nav-btn.answered{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-strong);}
.qz-nav-btn.current{outline:2px solid var(--accent); outline-offset:1px;}
.result-score{font-size:30px; font-weight:800; color:var(--primary-strong); margin:4px 0;}
.result-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.result-table th,.result-table td{padding:8px 6px; border-bottom:1px solid var(--border); text-align:left;}
.result-table th{font-size:12px; color:var(--text-muted);}
.review-item{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;}
.review-item.ok{border-left-color:var(--success);}
.review-item.bad{border-left-color:var(--danger);}
.review-item .rq{font-family:var(--font-serif); font-size:15px; margin-bottom:8px;}
.review-item .ra{font-size:13.5px; margin:3px 0;}
.zen-explain{margin-top:10px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); display:flex; gap:10px; font-family:var(--font-serif); font-size:14.5px; color:var(--text);}
.zen-explain .mascot-sprite{width:28px; height:28px; flex-shrink:0;}
.zen-explain .md-content{flex:1; min-width:0;}
.history-card{cursor:pointer;}

/* ---- Banco de questões ---- */
.q-details{margin:4px 0 12px; font-size:13.5px;}
.q-details ol{margin:6px 0 8px; padding-left:22px;}
.q-details li{margin-bottom:3px;}
.q-details li.correct{color:var(--success); font-weight:700;}
.q-details .q-exp{background:var(--surface-2); padding:8px 10px; border-radius:var(--radius-sm); font-family:var(--font-serif);}
.list-count{font-size:13px; color:var(--text-muted); margin-bottom:12px;}

/* ---- Vídeos ---- */
.video-card.watched{opacity:.82;}
.video-meta{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:2px 0 8px; font-size:13px;}
.video-meta label{display:inline-flex; align-items:center; gap:6px; margin:0; cursor:pointer;}
.video-meta input{accent-color:var(--primary);}

/* ---- Mapas mentais ---- */
.map-stage{position:relative;}
.map-edge{stroke:var(--primary); stroke-width:2; fill:none; opacity:.55;}
.map-node{touch-action:none; z-index:1; box-shadow:var(--shadow-sm); overflow-wrap:anywhere;}
.map-node.selected{box-shadow:0 0 0 3px var(--accent);}
.map-node.editing{cursor:text; user-select:text; -webkit-user-select:text; outline:none; box-shadow:0 0 0 3px var(--primary);}
.map-node.c-accent{background:var(--accent-soft); color:var(--text); border-color:var(--accent);}
.map-node.c-info{background:var(--info-soft); color:var(--text); border-color:var(--info);}
.map-node.c-success{background:var(--success-soft); color:var(--text); border-color:var(--success);}
.map-node.c-danger{background:var(--danger-soft); color:var(--text); border-color:var(--danger);}
.map-sel-tools{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 10px; border-radius:var(--radius-sm); background:var(--surface-2); margin-bottom:10px; font-size:13px;}
.map-sel-tools[hidden]{display:none;}
.color-dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border); cursor:pointer; padding:0;}
.map-hint{font-size:12.5px; color:var(--text-muted); margin-top:8px;}

/* ---- Anotações ---- */
.note-status{font-size:11.5px; color:var(--text-muted); align-self:center;}
.note-editable h3{font-size:17px; margin:14px 0 6px;}
.note-editable ul,.note-editable ol{padding-left:24px;}

/* ---- Modo Foco ---- */
.pomo-subject{max-width:300px; margin:0 auto 16px;}
.pomo-capy{position:relative; display:inline-block;}
.zzz{position:absolute; top:-6px; right:-10px; width:24px; height:24px; pointer-events:none; font-weight:800; color:var(--info);}
.zzz span{position:absolute; left:0; bottom:0; opacity:0; font-size:13px; animation:zzz 2.4s infinite;}
.zzz span:nth-child(2){animation-delay:.8s;}
.zzz span:nth-child(3){animation-delay:1.6s; font-size:16px;}
@keyframes zzz{0%{opacity:0; transform:translate(0,0) scale(.6);}25%{opacity:1;}100%{opacity:0; transform:translate(16px,-26px) scale(1.2);}}
.capy-breathe{animation:capy-breathe 3.2s ease-in-out infinite; transform-origin:50% 90%;}
@keyframes capy-breathe{0%,100%{transform:scale(1,1);}50%{transform:scale(1.04,.97);}}
.pomo-progress.break{stroke:var(--info);}
.pomo-msg{font-family:var(--font-serif); font-size:15px; color:var(--text-muted); margin:0 auto 16px; max-width:380px;}
.pomo-controls{flex-wrap:wrap;}
body.zen-mode .sidebar, body.zen-mode .topbar, body.zen-mode .foco-header, body.zen-mode .pomo-settings, body.zen-mode .pomo-subject{display:none;}
body.zen-mode .main{padding-bottom:0;}
body.zen-mode .view-root{padding-top:10vh;}
body.zen-mode .pomo-circle{width:300px; height:300px;}
body.zen-mode .pomo-time{font-size:40px;}

/* ============ v3: arquivos, visuais, chat salvo, anotações estilo Notion, modo expandido ============ */
.modal-lg{max-width:760px;}
.modal-xl{max-width:min(1100px,96vw);}
/* ---- Modo expandido (botão ⤢ no topo; Esc sai) ---- */
body.wide-mode .sidebar{display:none;}
body.wide-mode .view-root{max-width:none; padding:22px 26px 50px;}
body.wide-mode .main{padding-bottom:0;}
body.wide-mode .map-canvas{height:calc(100vh - 230px);}
body.wide-mode .chat-wrap{height:calc(100vh - 200px);}
body.wide-mode .chat-layout .chat-list{max-height:calc(100vh - 200px);}
.notas-layout.note-focus{grid-template-columns:1fr;}
.notas-layout.note-focus .notas-sidebar{display:none;}

/* ---- Arquivos ---- */
.dropzone{border:2px dashed var(--border); border-radius:var(--radius-md); padding:22px; text-align:center; color:var(--text-muted); cursor:pointer; transition:all .15s; font-size:14px;}
.dropzone:hover,.dropzone.drag{border-color:var(--primary); background:var(--primary-soft); color:var(--primary-strong);}
.file-card{cursor:pointer; padding:12px; display:flex; flex-direction:column; gap:6px;}
.file-thumb{height:110px; border-radius:var(--radius-sm); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:42px; overflow:hidden;}
.file-thumb img{width:100%; height:100%; object-fit:cover;}
.file-name{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-preview{max-height:62vh; overflow:auto; border-radius:var(--radius-sm);}
.preview-img{max-width:100%; display:block; margin:0 auto; border-radius:var(--radius-sm);}
.preview-pdf{width:100%; height:60vh; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff;}
.preview-pdf.big{height:calc(88vh - 70px);}
.preview-media{width:100%; max-height:70vh; border-radius:var(--radius-sm); background:#000;}
.preview-text{white-space:pre-wrap; font-size:13px; background:var(--surface-2); padding:14px; border-radius:var(--radius-sm); max-height:60vh; overflow:auto;}
.preview-doc{background:var(--surface-2); padding:16px 20px; border-radius:var(--radius-sm);}
.file-chip{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font-family:var(--font-display); font-size:13.5px;}
.file-chip:hover{border-color:var(--primary);}

/* ---- Lightbox (expandir qualquer coisa) ---- */
.lightbox{position:fixed; inset:0; z-index:450; background:rgba(10,15,12,.72); display:flex; align-items:center; justify-content:center; padding:2vh 2vw; animation:fade-in .15s ease;}
.lightbox-inner{background:var(--surface); border-radius:var(--radius-lg); width:96vw; height:94vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow);}
.lightbox-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border);}
.lightbox-body{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;}
.lightbox-body > svg, .lightbox-body svg{max-width:100%; height:auto; margin:auto;}
.lightbox-body .preview-img{max-height:calc(94vh - 90px); object-fit:contain;}
.lightbox-body .katex-display{font-size:2em; margin:auto;}
.lightbox-frame,.vis-frame.big{width:100%; height:calc(94vh - 90px); border:0; border-radius:var(--radius-sm); background:#fff;}

/* ---- Visuais com código (chat, resumos e anotações) ---- */
.md-visual,.nw{border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); margin:10px 0; overflow:hidden; font-family:var(--font-display);}
.vis-bar,.nw-bar{display:flex; align-items:center; gap:4px; padding:6px 10px; background:var(--surface-2); font-size:12px; font-weight:700; color:var(--text-muted); user-select:none;}
.vis-bar span,.nw-bar span{margin-right:auto;}
.vis-btn,.nw-bar button{border:none; background:transparent; color:var(--text-muted); cursor:pointer; padding:3px 7px; border-radius:6px; font-size:12.5px; font-family:var(--font-display);}
.vis-btn:hover,.nw-bar button:hover{background:var(--surface); color:var(--text);}
.vis-body,.nw-body{padding:12px; overflow-x:auto; text-align:center; min-height:40px;}
.vis-body svg,.nw-body svg{max-width:100%; height:auto;}
.vis-code{margin:0 !important; border-radius:0 !important; text-align:left; max-height:300px; overflow:auto;}
.vis-frame{width:100%; height:260px; border:0; border-radius:var(--radius-sm); display:block; background:#fff;}
.vis-error{color:var(--danger); font-size:13px; text-align:left;}
.md-math{font-family:var(--font-serif);}
.md-content table, .rich table{border-collapse:collapse; width:100%; margin:8px 0 12px; font-size:.95em;}
.md-content th,.md-content td{border:1px solid var(--border); padding:6px 9px; text-align:left;}
.md-content th{background:var(--surface-2);}
.md-content .md-visual{white-space:normal;}

/* ---- Chat: conversas salvas e anexos ---- */
.chat-layout{display:grid; grid-template-columns:250px 1fr; gap:14px; align-items:start;}
.chat-layout.list-hidden{grid-template-columns:1fr;}
.chat-layout.list-hidden .chat-list{display:none;}
.chat-list{padding:12px; max-height:calc(100vh - 250px); min-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
.chat-item{padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer; display:flex; flex-direction:column; gap:2px;}
.chat-item:hover{background:var(--surface-2);}
.chat-item.active{background:var(--primary-soft);}
.chat-item strong{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chat-item span{font-size:11px; color:var(--text-muted);}
.chat-wrap{position:relative;}
.chat-title-row{display:flex; align-items:center; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:6px; font-size:14px;}
.chat-title-row b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chat-attach-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
.chat-attach-row:empty{display:none;}
.att-chip{display:inline-flex; align-items:center; gap:6px; max-width:260px; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:12px; font-family:var(--font-display); cursor:pointer; color:var(--text);}
.att-chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att-chip.has-thumb{border-radius:10px; padding:4px 8px 4px 4px;}
.att-chip img{width:38px; height:38px; object-fit:cover; border-radius:7px;}
.att-x{border:none; background:none; cursor:pointer; color:var(--text-muted); font-size:12px; padding:0 2px;}
.msg-atts{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; white-space:normal;}
.msg-user .att-chip{background:rgba(255,255,255,.18); border-color:transparent; color:inherit;}
.action-done{border-color:var(--success) !important; color:var(--success) !important; background:var(--success-soft) !important;}
.drop-hint{display:none; position:absolute; inset:0; border-radius:var(--radius-md); background:rgba(44,110,92,.14); border:2px dashed var(--primary); align-items:center; justify-content:center; font-weight:700; color:var(--primary-strong); z-index:5; pointer-events:none;}
.chat-wrap.dragging .drop-hint{display:flex;}

/* ---- Anotações estilo Notion ---- */
.note-card{padding:0; overflow:visible;}
.note-toolbar{position:sticky; top:72px; z-index:6; display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding:8px 12px; margin:0; background:var(--surface); border-bottom:1px solid var(--border); border-radius:var(--radius-md) var(--radius-md) 0 0;}
.tb-btn{padding:5px 9px; min-width:30px; justify-content:center;}
.tb-sep{width:1px; height:22px; background:var(--border); margin:0 4px;}
.note-toolbar .note-status{margin-left:auto; margin-right:4px;}
.note-page{max-width:780px; margin:0 auto; padding:26px 28px 40px;}
.note-page.wide{max-width:none;}
.note-head{margin-bottom:12px;}
.note-icon-btn{font-size:40px; background:none; border:none; cursor:pointer; padding:2px 6px; border-radius:var(--radius-sm); line-height:1.1;}
.note-icon-btn:hover{background:var(--surface-2);}
.note-title-input{display:block; width:100%; border:none; background:transparent; color:var(--text); font-family:var(--font-display); font-size:30px; font-weight:800; letter-spacing:-.02em; padding:4px 0; outline:none;}
.note-title-input::placeholder{color:var(--border);}
.note-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px;}
.note-subject{max-width:200px; padding:5px 10px; font-size:13px;}
.note-hint{font-size:12px; color:var(--text-muted); margin-top:18px; border-top:1px dashed var(--border); padding-top:10px;}
.rich{min-height:360px; font-family:var(--font-serif); font-size:16px; line-height:1.7; outline:none; caret-color:var(--primary);}
.rich p{margin:0 0 6px;}
.rich h1{font-size:27px; margin:20px 0 8px;} .rich h2{font-size:22px; margin:18px 0 6px;} .rich h3{font-size:18px; margin:14px 0 4px;}
.rich h1,.rich h2,.rich h3{font-family:var(--font-display);}
.rich ul,.rich ol{padding-left:26px; margin:4px 0 8px;}
.rich blockquote{border-left:3px solid var(--accent); margin:8px 0; padding:2px 14px; color:var(--text-muted);}
.rich hr{border:none; border-top:1px solid var(--border); margin:16px 0;}
.rich mark,.md-content mark{background:var(--accent-soft); color:inherit; padding:0 3px; border-radius:3px;}
.rich code{font-family:ui-monospace,Consolas,monospace; font-size:.86em; background:var(--surface-2); padding:1px 5px; border-radius:5px; color:var(--danger);}
.rich pre.code{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:13.5px; line-height:1.55;}
.rich pre.code code{background:none; padding:0; color:var(--text); font-size:inherit;}
.rich a{color:var(--primary); text-decoration:underline; cursor:pointer;}
.rich ul.todo{list-style:none; padding-left:4px;}
.rich ul.todo li{position:relative; padding-left:30px; margin:3px 0;}
.rich ul.todo li::before{content:''; position:absolute; left:2px; top:.32em; width:17px; height:17px; border:2px solid var(--primary); border-radius:5px; cursor:pointer; background:var(--surface);}
.rich ul.todo li[data-checked="true"]{color:var(--text-muted); text-decoration:line-through;}
.rich ul.todo li[data-checked="true"]::before{background:var(--primary); content:'✓'; color:var(--on-primary); font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; font-family:var(--font-display);}
.rich .tgl{margin:6px 0;}
.rich .tgl-h{position:relative; padding-left:24px; font-weight:600; margin:0;}
.rich .tgl-h::before{content:'▸'; position:absolute; left:4px; top:0; cursor:pointer; color:var(--text-muted); transition:transform .15s; display:inline-block;}
.rich .tgl[data-open="1"] > .tgl-h::before{transform:rotate(90deg);}
.rich .tgl-b{padding-left:24px;}
.rich .tgl[data-open="0"] > .tgl-b{display:none;}
.rich .callout{position:relative; background:var(--accent-soft); border-radius:var(--radius-sm); padding:10px 14px 10px 46px; margin:8px 0;}
.rich .callout::before{content:attr(data-icon); position:absolute; left:14px; top:9px; font-size:19px; cursor:pointer;}
.rich .callout > :last-child{margin-bottom:0;}
.nt-wrap{overflow-x:auto; margin:8px 0;}
.rich table.nt th,.rich table.nt td{border:1px solid var(--border); padding:6px 10px; min-width:90px; vertical-align:top; text-align:left;}
.rich table.nt th{background:var(--surface-2); font-family:var(--font-display); font-size:14px;}
.rich .nw{margin:12px 0;}
.rich .nw-bar{opacity:.0; transition:opacity .15s;}
.rich .nw:hover .nw-bar,.rich .nw:focus-within .nw-bar{opacity:1;}
.nw-img{max-width:100%; max-height:520px; border-radius:var(--radius-sm); cursor:zoom-in;}
.rich .md-math{padding:0 2px;}
/* menus flutuantes */
.pop-menu{position:fixed; z-index:420; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:6px; min-width:220px; max-height:340px; overflow-y:auto;}
.pop-menu button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none; color:var(--text); padding:7px 10px; border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-display); font-size:13.5px;}
.pop-menu button:hover,.pop-menu button.active{background:var(--primary-soft);}
.pop-menu button.danger{color:var(--danger);}
.pop-menu small{display:block; font-size:11.5px; color:var(--text-muted);}
.pop-menu hr{border:none; border-top:1px solid var(--border); margin:4px 0;}
.pm-i{width:26px; height:26px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; background:var(--surface-2); font-size:13px; font-weight:800;}
.slash-title{font-size:11px; font-weight:800; color:var(--text-muted); padding:4px 10px 6px; text-transform:uppercase; letter-spacing:.04em;}
.icon-menu{display:grid; grid-template-columns:repeat(6,1fr); min-width:0; width:260px;}
.icon-menu .icon-opt{font-size:22px; justify-content:center; padding:6px;}
.sel-toolbar{position:fixed; z-index:410; display:flex; gap:2px; flex-wrap:wrap; max-width:min(560px,94vw); background:var(--text); color:var(--bg); border-radius:10px; padding:4px; box-shadow:var(--shadow);}
.sel-toolbar[hidden]{display:none;}
.sel-toolbar button{border:none; background:none; color:inherit; padding:5px 9px; border-radius:7px; cursor:pointer; font-family:var(--font-display); font-size:13px;}
.sel-toolbar button:hover{background:rgba(127,127,127,.3);}
.sel-toolbar button.zen{color:var(--accent);}
.table-bar{background:var(--surface); color:var(--text); border:1px solid var(--border);}
.template-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.template-card{display:flex; flex-direction:column; gap:4px; text-align:left; padding:14px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font-family:var(--font-display); transition:all .15s;}
.template-card:hover{border-color:var(--primary); background:var(--primary-soft); transform:translateY(-2px);}
.template-card .ti{font-size:24px;}
.template-card small{color:var(--text-muted); font-size:11.5px;}
/* editor de visuais */
.vis-ai-row{display:flex; gap:8px; margin-bottom:10px;}
.vis-editor{display:grid; grid-template-columns:1fr 1fr; gap:12px; min-height:340px;}
.code-input{font-family:ui-monospace,Consolas,monospace !important; font-size:13px; line-height:1.5; min-height:340px; tab-size:2; white-space:pre;}
.vis-preview{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; overflow:auto; max-height:56vh; text-align:center; background:var(--surface);}

/* ---- Vídeos ---- */
.video-summary{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:10px;}
.video-summary summary{cursor:pointer; font-weight:700; font-size:13.5px;}
.video-summary .md-content{margin-top:8px; font-family:var(--font-serif); font-size:14px;}
.video-file{margin:10px 0;}

@media (max-width:760px){
  .chat-layout{grid-template-columns:1fr;}
  .chat-list{max-height:260px; min-height:0;}
  .vis-editor{grid-template-columns:1fr;}
  .note-page{padding:18px 14px 30px;}
  .note-title-input{font-size:24px;}
  .note-toolbar{top:60px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
}

/* ============ v4: perfis (Lucca/Antonio) e quadro branco ============ */
.profile-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-family:var(--font-display); font-weight:700; font-size:13px;}
.profile-pill:hover{border-color:var(--primary); background:var(--primary-soft);}
#profile-avatar{font-size:18px;}
.profile-picker{position:fixed; inset:0; z-index:600; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade-in .25s ease;}
.pp-inner{text-align:center; max-width:520px; width:100%;}
.pp-inner h2{font-size:26px; margin:10px 0 22px;}
.pp-grid{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
.pp-card{width:170px; padding:22px 14px 16px; border-radius:var(--radius-lg); border:2px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--font-display); transition:transform .15s, border-color .15s, box-shadow .15s;}
.pp-card:hover,.pp-card:focus-visible{transform:translateY(-4px); border-color:var(--pc); box-shadow:var(--shadow);}
.pp-card.current{border-color:var(--pc);}
.pp-avatar{width:84px; height:84px; border-radius:50%; background:var(--pc); display:flex; align-items:center; justify-content:center; font-size:44px; box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);}
.pp-card b{font-size:17px;}
.pp-card small{font-size:11.5px; color:var(--text-muted);}
.pp-remember{justify-content:center;}
.color-swatch{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px;}
.profile-edit h4{font-size:15px;}

/* ---- Quadro branco ---- */
.board-card{cursor:pointer;}
.board-thumb{height:140px; border-radius:var(--radius-sm); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:40px; overflow:hidden;}
.board-thumb img{width:100%; height:100%; object-fit:contain;}
.board-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.board-title{border:none; background:transparent; color:var(--text); font-family:var(--font-display); font-size:20px; font-weight:800; min-width:160px; flex:0 1 320px; padding:4px 6px; border-radius:var(--radius-sm);}
.board-title:hover,.board-title:focus{background:var(--surface-2); outline:none;}
.live-status{font-size:12.5px; color:var(--success); font-weight:600;}
.board-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px;}
.bt-group{display:inline-flex; gap:3px; align-items:center; padding-right:8px; border-right:1px solid var(--border);}
.bt-group:last-child{border-right:none;}
.bt-tool{min-width:34px; height:34px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--text); cursor:pointer; font-size:16px; font-family:var(--font-display); font-weight:700;}
.bt-tool:hover{background:var(--surface-2);}
.bt-tool.active{background:var(--primary-soft); border-color:var(--primary);}
.bt-zoom{font-size:12px; min-width:52px;}
.bt-color{width:24px; height:24px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border); cursor:pointer; padding:0;}
.bt-color.active{box-shadow:0 0 0 2px var(--primary);}
#qb-color{width:30px; height:28px; padding:0; border:none; background:none; cursor:pointer;}
#qb-size{width:110px; accent-color:var(--primary);}
.board-layout{display:grid; grid-template-columns:1fr; gap:12px;}
.board-layout:has(.live-panel:not([hidden])){grid-template-columns:1fr 260px;}
.board-wrap{position:relative; height:calc(100vh - 290px); min-height:380px; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow-sm);}
.board-wrap canvas{display:block; touch-action:none; cursor:crosshair;}
body.wide-mode .board-wrap{height:calc(100vh - 200px);}
.live-panel{display:flex; flex-direction:column; gap:10px; padding:14px; height:calc(100vh - 290px); min-height:380px;}
.live-panel[hidden]{display:none;}
body.wide-mode .live-panel{height:calc(100vh - 200px);}
.live-people{display:flex; flex-direction:column; gap:6px;}
.live-person{font-size:13px; font-weight:600; padding:6px 10px; border-radius:var(--radius-sm); background:var(--surface-2); border-left:4px solid var(--pc);}
.live-chat{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; font-size:13px; border-top:1px solid var(--border); padding-top:8px;}
.lc-msg{background:var(--surface-2); padding:6px 9px; border-radius:var(--radius-sm); overflow-wrap:anywhere;}
.lc-msg.mine{background:var(--primary-soft);}
.lc-msg b{display:block; font-size:11.5px;}
.live-chat-form{display:flex; gap:6px;}
.live-code{font-size:38px; font-weight:800; letter-spacing:.18em; text-align:center; padding:14px; margin:10px 0; border-radius:var(--radius-md); background:var(--primary-soft); color:var(--primary-strong); font-variant-numeric:tabular-nums;}
.live-code-input{font-size:24px; text-align:center; letter-spacing:.2em; text-transform:uppercase; font-weight:800;}
.live-steps{font-size:13.5px; padding-left:20px; margin:14px 0;}
.live-steps li{margin-bottom:6px;}
.live-fab,.lp-close{display:none;}
@media (max-width:760px){
  #profile-name{display:none;}
  .profile-pill{padding:5px 8px;}
  .board-layout:has(.live-panel:not([hidden])){grid-template-columns:1fr;}
  .live-panel{position:fixed; left:10px; right:10px; bottom:92px; height:min(60vh,440px); min-height:0; z-index:70; box-shadow:var(--shadow); display:none;}
  .live-panel.open:not([hidden]){display:flex;}
  .lp-close{display:inline-flex;}
  .live-fab{display:flex; align-items:center; justify-content:center; position:fixed; right:16px; bottom:100px; z-index:69; width:56px; height:56px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:24px; box-shadow:var(--shadow); cursor:pointer;}
  .live-fab[hidden]{display:none;}
  .live-fab span{position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--danger); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .live-fab span[hidden]{display:none;}
  .board-wrap{height:calc(100vh - 330px); min-height:300px;}
  .pp-card{width:140px;}
}

/* ---- Quadro: lista da dupla ---- */
.lobby-card{margin-bottom:18px; padding:14px 16px;}
.lobby-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 12px; margin-top:8px; border-radius:var(--radius-sm); background:var(--surface-2); border-left:4px solid var(--success);}
.lobby-who{font-size:14px;}
.lobby-board{font-size:13.5px; color:var(--text-muted); margin-left:auto;}
.lobby-row .btn{margin-left:4px;}

/* ============ v6: provas (bloqueio, pausa, modo prova, rascunho) ============ */
.resume-card{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px; border-left:4px solid var(--accent);}
body.exam-lock .nav-item:not(.active){opacity:.42;}
body.exam-lock .nav-item:not(.active)::after{content:'🔒'; font-size:11px; margin-left:auto;}
body.exam-lock #profile-btn{opacity:.5;}
.exam-warning{text-align:center;}
.ew-icon{font-size:46px;}
.qz-nav-btn.flagged{box-shadow:inset 0 -4px 0 var(--danger);}
/* folha de prova */
.exam-bar{position:sticky; top:72px; z-index:7; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-sm);}
.exam-layout{display:grid; grid-template-columns:1fr 230px; gap:18px; align-items:start;}
.exam-paper{background:#FFFDF8; color:#1C2B26; border:1px solid #E6E1D6; border-radius:6px; padding:34px 40px; box-shadow:var(--shadow-sm); font-family:var(--font-serif);}
[data-theme="dark"] .exam-paper{background:#F4F1E8;}
.exam-header{border-bottom:2px solid #1C2B26; padding-bottom:14px; margin-bottom:22px;}
.exam-header h2{font-family:var(--font-display); font-size:20px; letter-spacing:.04em; color:#1C2B26;}
.exam-meta{display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px; margin:6px 0 12px;}
.exam-instr{font-size:13px; background:#F1EEE4; border:1px dashed #C9C2B0; padding:10px 12px; border-radius:4px;}
.exam-q{padding:18px 0 22px; border-bottom:1px solid #E6E1D6; scroll-margin-top:140px;}
.exam-q.flagged{background:linear-gradient(90deg, rgba(193,86,74,.07), transparent 60%);}
.eq-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.eq-num{font-family:var(--font-display); font-weight:800; font-size:13px; letter-spacing:.06em;}
.exam-q .badge{background:#ECE7DA; color:#5B6B63;}
.eq-tools{margin-left:auto; display:flex; gap:6px;}
.eq-tools button{border:1px solid #DCD5C4; background:#FFFFFF; color:#1C2B26; border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:var(--font-display);}
.eq-tools button:hover{border-color:#2C6E5C;}
.eq-text{font-size:16.5px; line-height:1.6; margin-bottom:12px;}
.eq-opts{display:flex; flex-direction:column; gap:6px;}
.eq-opt{display:flex; align-items:flex-start; gap:10px; text-align:left; background:transparent; border:1px solid transparent; border-radius:6px; padding:7px 9px; cursor:pointer; font-family:var(--font-serif); font-size:15.5px; color:#1C2B26;}
.eq-opt:hover{background:#F1EEE4;}
.eq-bubble{flex-shrink:0; width:26px; height:26px; border-radius:50%; border:2px solid #1C2B26; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:12.5px;}
.eq-opt.chosen{background:#E3EEE9; border-color:#2C6E5C;}
.eq-opt.chosen .eq-bubble{background:#1C2B26; color:#FFFDF8;}
.exam-end{text-align:center; padding-top:24px;}
/* cartão-resposta */
.answer-sheet{position:sticky; top:140px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; max-height:calc(100vh - 160px); overflow-y:auto;}
.as-title{font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:.08em; text-align:center; margin-bottom:8px;}
.as-rows{display:flex; flex-direction:column; gap:3px;}
.as-row{display:flex; align-items:center; gap:4px; border:none; background:transparent; padding:3px 4px; border-radius:6px; cursor:pointer; color:var(--text); font-family:var(--font-display);}
.as-row:hover{background:var(--surface-2);}
.as-row.flagged{background:var(--danger-soft);}
.as-n{width:22px; font-size:11.5px; font-weight:800; color:var(--text-muted);}
.as-b{width:21px; height:21px; border-radius:50%; border:1.5px solid var(--border); font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; color:var(--text-muted);}
.as-b.on{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
.as-flag{font-size:11px;}
#ex-sheet{display:none;}
/* rascunho */
.scratch-panel{position:fixed; right:16px; top:80px; width:min(460px,46vw); height:calc(100vh - 100px); z-index:250; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); overflow:hidden;}
.scratch-panel[hidden]{display:none;}
.sp-head{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13.5px; cursor:move; touch-action:none; user-select:none;}
.scratch-panel.docked .sp-head{cursor:default;}
.sp-head>b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.sp-resize{position:absolute; right:0; bottom:0; width:22px; height:22px; cursor:nwse-resize; touch-action:none; background:linear-gradient(135deg, transparent 50%, var(--border) 50%, var(--border) 60%, transparent 60%, transparent 70%, var(--border) 70%, var(--border) 80%, transparent 80%);}
.scratch-panel.maxed{left:3vw; right:3vw; top:5vh; bottom:3vh; width:auto; height:auto; z-index:260;}
.scratch-panel.docked{top:0; right:0; bottom:0; left:auto; width:var(--scratch-w,42vw); height:auto; border-radius:0; border-width:0 0 0 1px;}
.scratch-panel.docked .sp-resize{left:0; top:0; bottom:0; right:auto; width:10px; height:auto; cursor:ew-resize; background:none;}
.scratch-panel.docked .sp-resize:hover{background:var(--primary-soft);}
body.scratch-docked .main{padding-right:var(--scratch-w,42vw);}
.sp-tools{margin-left:auto; display:flex; gap:4px; align-items:center;}
.sp-tools button{min-width:30px; height:30px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; color:var(--text); font-size:14px;}
.sp-tools button.active{background:var(--primary-soft); border-color:var(--primary);}
.sp-tools .sp-color{min-width:20px; width:20px; height:20px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border);}
.sp-tools .sp-color.active{box-shadow:0 0 0 2px var(--primary);}
.sp-body{flex:1; position:relative;}
.sp-body canvas{display:block; touch-action:none; cursor:crosshair;}
@media (max-width:900px){
  .exam-layout{grid-template-columns:1fr;}
  #ex-sheet{display:inline-flex;}
  .answer-sheet{display:none; position:fixed; left:12px; right:12px; bottom:80px; top:auto; max-height:55vh; z-index:240; box-shadow:var(--shadow);}
  .answer-sheet.open{display:block;}
  .exam-paper{padding:22px 18px;}
  .scratch-panel{left:8px; right:8px; width:auto; top:auto; bottom:72px; height:52vh;}
  .scratch-panel.docked{left:0; right:0; top:auto; bottom:72px; width:auto; height:var(--scratch-h,45vh); border-width:1px 0 0 0;}
  .scratch-panel.docked .sp-resize{left:0; right:0; top:0; bottom:auto; width:auto; height:12px; cursor:ns-resize;}
  .scratch-panel.maxed{left:6px; right:6px; top:66px; bottom:76px;}
  body.scratch-docked .main{padding-right:0; padding-bottom:var(--scratch-h,45vh);}
  .exam-bar{top:60px;}
}

/* ============ v7: duelo ao vivo ============ */
.duel-card{margin-bottom:16px; max-width:620px; border-left:4px solid var(--accent);}
.duel-card:empty{display:none;}
.duel-card-inner{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.duel-vs{display:flex; align-items:center; gap:8px; font-size:18px;}
.duel-av{width:42px; height:42px; border-radius:50%; background:var(--pc); display:inline-flex; align-items:center; justify-content:center; font-size:23px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.12); flex-shrink:0;}
.duel-vs.big .duel-av{width:64px; height:64px; font-size:34px;}
.duel-invite{text-align:center;}
.duel-invite .duel-vs{justify-content:center; margin-bottom:10px;}
.duel-overlay{position:fixed; inset:0; z-index:550; background:rgba(10,15,12,.7); display:flex; align-items:center; justify-content:center; padding:16px; animation:fade-in .2s ease;}
.duel-box{background:var(--surface); border-radius:var(--radius-lg); width:min(720px,100%); max-height:94vh; overflow-y:auto; box-shadow:var(--shadow); display:flex; flex-direction:column;}
.duel-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px; background:linear-gradient(135deg,var(--hero-from),var(--hero-to)); color:#fff; border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.duel-player{display:flex; align-items:center; gap:10px; position:relative;}
.duel-player b{display:block; font-size:14px;}
.duel-score{display:block; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.duel-mid{font-size:26px;}
.duel-bubble{position:absolute; top:-6px; font-size:30px; opacity:0; pointer-events:none;}
.duel-player .duel-bubble{left:30px;} .duel-player.op .duel-bubble{left:auto; right:30px;}
.duel-bubble.pop{animation:duel-pop 1.6s ease forwards;}
@keyframes duel-pop{0%{opacity:0; transform:translateY(10px) scale(.6);}15%{opacity:1; transform:translateY(-10px) scale(1.15);}80%{opacity:1; transform:translateY(-22px) scale(1);}100%{opacity:0; transform:translateY(-34px);}}
.duel-body{padding:18px 20px; min-height:260px;}
.duel-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:10px 16px; border-top:1px solid var(--border);}
.duel-reacts{display:flex; gap:4px;}
.duel-reacts button{border:1px solid var(--border); background:var(--surface-2); border-radius:999px; font-size:18px; width:38px; height:34px; cursor:pointer;}
.duel-reacts button:hover{transform:scale(1.12);}
.duel-wait,.duel-end{text-align:center; padding:10px 0;}
.duel-count{font-size:84px; font-weight:800; text-align:center; padding:50px 0; color:var(--primary-strong); animation:pop-in .4s ease;}
.duel-qhead{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted);}
.duel-secs{margin-left:auto; font-weight:800; font-size:18px; color:var(--text); font-variant-numeric:tabular-nums;}
.duel-secs.hurry{color:var(--danger);}
.duel-timebar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:8px 0 14px;}
.duel-timebar>div{height:100%; width:100%; background:var(--accent); transition:width .1s linear;}
.duel-question{font-family:var(--font-serif); font-size:18px; line-height:1.5; margin-bottom:14px;}
.duel-opts{display:flex; flex-direction:column; gap:8px;}
.duel-status{margin-top:12px;}
.duel-reveal{margin-top:14px; display:flex; flex-direction:column; gap:6px;}
.duel-pick{padding:8px 12px; border-radius:var(--radius-sm); font-size:14px; background:var(--surface-2); border-left:4px solid var(--border);}
.duel-pick.ok{border-left-color:var(--success);} .duel-pick.bad{border-left-color:var(--danger);}
.duel-pts{float:right; font-weight:800;}
.duel-final{display:flex; align-items:center; justify-content:center; gap:22px; margin:14px 0;}
.duel-final>div{display:flex; flex-direction:column; align-items:center;}
.duel-final b{font-size:40px; font-weight:800; font-variant-numeric:tabular-nums;}
.duel-final .vs{font-size:26px; color:var(--text-muted);}
@media (max-width:600px){ .duel-score{font-size:20px;} .duel-question{font-size:16px;} .duel-count{font-size:64px;} }

/* ============ v8: ferramentas do Zen ============ */
.tool-card{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:18px; border-radius:var(--radius-lg); border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; cursor:pointer; box-shadow:var(--shadow-sm, none); transition:transform .15s ease, border-color .15s ease;}
.tool-card:hover{transform:translateY(-2px); border-color:var(--primary);}
.tool-card b{font-size:16px;}
.tool-card small{color:var(--text-muted); font-size:13px; line-height:1.45;}
.tool-card .badge{margin-top:4px;}
.tool-icon{font-size:30px; line-height:1;}
.tool-head .btn{margin-bottom:8px;}
.tool-layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start;}
.tool-hint{text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--text-muted);}
.tool-list{margin:6px 0 4px; padding-left:20px;}
.tool-list li{margin-bottom:4px;}
.tool-layout h4{margin:10px 0 6px;}
.essay-input{font-family:var(--font-serif); font-size:15px; line-height:1.7;}
.proposta-box{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; margin:-4px 0 14px; font-size:13.5px;}
.proposta-box p{margin:6px 0 0;}
.essay-total{display:flex; flex-direction:column; align-items:center; justify-content:center; width:120px; height:120px; margin:0 auto 10px; border-radius:50%; border:8px solid var(--sc); }
.essay-total span{font-size:34px; font-weight:800; line-height:1; color:var(--sc);}
.essay-total small{font-size:12px; color:var(--text-muted);}
.essay-total.small{width:96px; height:96px; border-width:6px;}
.essay-total.small span{font-size:30px;}
.comp-row{margin-bottom:12px;}
.comp-head{display:flex; align-items:baseline; gap:8px; font-size:14px; margin-bottom:4px;}
.comp-head span{flex:1; min-width:0;}
.comp-score{font-variant-numeric:tabular-nums;}
.comp-text{font-size:13.5px; margin:6px 0 0; color:var(--text);}
.comp-tip{color:var(--text-muted);}
.essay-err{display:flex; flex-direction:column; gap:3px; padding:9px 12px; margin-bottom:8px; border-left:4px solid var(--danger); background:var(--surface-2); border-radius:var(--radius-sm); font-size:13.5px;}
.ee-trecho{font-family:var(--font-serif); font-style:italic;}
.ee-fix{color:var(--success); font-weight:600;}
.essay-better{font-family:var(--font-serif); background:var(--primary-soft); color:var(--text); padding:12px 14px; border-radius:var(--radius-sm); line-height:1.7;}
.essay-card{cursor:pointer;}
.challenge-box{margin:12px 0; padding:12px 14px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-text);}
.challenge-box p{margin:4px 0 8px; color:var(--text);}
.btn.listening{border-color:var(--danger); color:var(--danger); animation:pulse-rec 1.2s ease infinite;}
@keyframes pulse-rec{50%{box-shadow:0 0 0 6px var(--danger-soft);}}
.tutor-q{background:var(--surface-2); padding:10px 12px; border-radius:var(--radius-sm); margin:8px 0 12px;}
.tutor-steps{display:flex; flex-direction:column; gap:8px;}
.tutor-hint{padding:10px 12px; border-radius:var(--radius-sm); border:1px dashed var(--accent); animation:fade-in .25s ease;}
.tutor-hint>b{color:var(--accent-text); font-size:13px;}
.tutor-solution{margin-top:14px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--primary-soft);}
.tutor-solution ol{padding-left:20px; margin:6px 0 10px;}
.tutor-solution li{margin-bottom:6px;}
.plan-list{display:flex; flex-direction:column; gap:6px; max-height:560px; overflow-y:auto; padding-right:4px;}
.plan-day{display:flex; gap:12px; padding:8px 10px; border-radius:var(--radius-sm); background:var(--surface-2); font-size:13.5px;}
.plan-day.today{outline:2px solid var(--primary);}
.plan-day.exam{background:var(--accent-soft);}
.plan-day ul{margin:2px 0 0; padding-left:18px;}
.plan-date{min-width:62px; text-align:center; display:flex; flex-direction:column; font-size:12px; color:var(--text-muted);}
.plan-date b{font-size:16px; color:var(--text);}
.diag-stat{text-align:center;}
.diag-stat b{display:block; font-size:26px; font-weight:800; color:var(--primary-strong); font-variant-numeric:tabular-nums;}
.diag-stat small{color:var(--text-muted); font-size:12.5px;}
.er-answer{margin:4px 0;}
.er-answer summary{cursor:pointer; font-size:13px; color:var(--primary-strong); font-weight:600;}
@media (max-width:900px){ .tool-layout{grid-template-columns:1fr;} }

/* ============ v9: motivação, aprender melhor, boletim, catálogo e técnico ============ */
.mascot-sprite{overflow:visible;}
.ai-left-chip{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:5px 10px; font:inherit; font-size:13px; font-weight:700; cursor:pointer;}
.ai-left-chip.low{border-color:var(--danger); color:var(--danger);}
.settings-block{border-top:1px solid var(--border); margin-top:14px; padding-top:12px;}
.settings-block h4{margin:0 0 8px;}
.sync-code-input{font-size:22px; letter-spacing:3px; text-align:center; font-weight:800; text-transform:uppercase;}
.sync-status{margin-top:14px; text-align:center;}
.sync-code{font-size:34px; font-weight:800; letter-spacing:5px; color:var(--primary-strong); margin:6px 0; font-variant-numeric:tabular-nums;}
/* Início */
.dash-trio{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin:18px 0;}
.daily-card{display:flex; flex-direction:column; justify-content:space-between; gap:12px; border-left:4px solid var(--accent);}
.daily-card.done{border-left-color:var(--success);}
.daily-head{display:flex; gap:12px; align-items:center;}
.daily-icon{font-size:30px;}
.daily-stage{max-width:620px; margin:0 auto;}
.missions-card h3,.rank-card h3{font-size:16px;}
.mission{display:flex; align-items:center; gap:10px; padding:6px 0;}
.mission.ok .mi-body span{text-decoration:line-through; color:var(--text-muted);}
.mi-icon{font-size:20px; width:26px; text-align:center;}
.mi-body{flex:1; display:flex; flex-direction:column; gap:4px; font-size:13.5px;}
.mission small{font-variant-numeric:tabular-nums; color:var(--text-muted); font-weight:700;}
.rank-head{display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-bottom:6px;}
.rank-row{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding:4px 0; border-top:1px dashed var(--border); font-size:13.5px;}
.rank-row span{color:var(--text-muted); font-size:12px; text-align:center;}
.rank-row b{font-variant-numeric:tabular-nums;}
.rank-row b:last-child{text-align:right;}
.rank-row b.lead{color:var(--success);}
/* Capivara */
.capy-look{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
.capy-look-preview{flex-shrink:0; padding:10px 18px 0;}
.acc-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px;}
.acc-slot{width:70px; font-size:12.5px; color:var(--text-muted);}
.acc-opt{min-width:38px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); font-size:18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:2px; color:var(--text);}
.acc-opt.on{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft);}
.acc-opt.locked{opacity:.5; cursor:not-allowed; font-size:12px;}
.acc-opt small{font-size:10px;}
/* Sobrevivência */
.surv-card{margin-bottom:16px; max-width:620px; border-left:4px solid var(--danger);}
.surv-icon{font-size:30px;}
.surv-top{display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap;}
.surv-lives{font-size:22px; letter-spacing:2px;}
.surv-score{font-size:30px; font-weight:800; color:var(--primary-strong); font-variant-numeric:tabular-nums;}
/* Duelo: torneio e histórico */
.series-box{display:flex; flex-direction:column; gap:2px; align-items:center; padding:10px; margin-bottom:10px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-text);}
.series-box.over{background:var(--primary-soft); color:var(--primary-strong);}
.series-champ{font-weight:800; font-size:16px; margin-top:4px;}
.dh-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
.dh-row{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--radius-sm); background:var(--surface-2); font-size:13.5px;}
.dh-res{font-size:20px;}
.dh-main{flex:1; display:flex; flex-direction:column;}
.dh-main small{color:var(--text-muted);}
/* Foco junto */
.pomo-friend{margin:6px auto 10px; max-width:460px;}
.pomo-friend-inner{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:999px; background:var(--surface-2); font-size:13.5px;}
.pomo-friend-inner .duel-av{width:30px; height:30px; font-size:17px;}
.pomo-friend-inner span:nth-child(2){flex:1;}
/* Ferramentas */
.tool-group-title{margin:22px 0 10px; font-size:16px;}
.q-visual{margin:6px 0 14px; overflow-x:auto;}
.q-visual table{font-size:13.5px;}
.aula-card{max-width:760px;}
.aula-dots{display:flex; gap:6px; margin-bottom:8px;}
.aula-dots span{flex:1; height:6px; border-radius:999px; background:var(--surface-2);}
.aula-dots span.done{background:var(--success);}
.aula-dots span.cur{background:var(--accent);}
.aula-exp{font-family:var(--font-serif); font-size:15.5px; line-height:1.7; margin-bottom:14px;}
.aula-q{border-top:1px solid var(--border); padding-top:12px;}
.pa-sec{margin-top:10px;}
.pa-sec summary{cursor:pointer; font-weight:700;}
.lt-list{display:flex; flex-direction:column; gap:6px;}
