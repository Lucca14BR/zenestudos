}
function openAttemptModal(a){
  if(!a) return;
  const rows = (a.details||[]).map((d,i)=>{
    const q = state.questions.find(x=>x.id===d.questionId);
    return q ? reviewItemHTML(q, d, i, false) : `<div class="review-item ${d.correct?'ok':'bad'}"><div class="ra">${i+1}. (questão excluída do banco)</div></div>`;
  });
  openModal(`
    <button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
    <h3>${escapeHTML(a.subject||'Todas as matérias')} · ${a.score}/${a.total}</h3>
    <p class="muted-sm" style="margin-bottom:14px;">${new Date(a.date).toLocaleString('pt-BR')}</p>
    ${rows.length ? rows.join('') : '<p class="muted-sm">Os detalhes só ficam guardados nos simulados feitos a partir desta versão do app.</p>'}
  `, {size:'lg'});
}
function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
// Quanto maior, mais a questão "precisa" ser treinada (errou recentemente ou nunca fez)
function questionWeakScore(q){
  const h = q.history||[];
  if(!h.length) return 0.6;
  const recent = h.slice(-5);
  return recent.filter(x=>!x.correct).length/recent.length + (h[h.length-1].correct ? 0 : 0.3);
}
function startQuiz(opts){
  const o = Object.assign({subject:'', difficulty:'', count:10, mode:'pratica', timeLimit:null, weakFocus:false, questionIds:null, fullscreen:false}, opts);
  let pool = o.questionIds
    ? state.questions.filter(q=> o.questionIds.includes(q.id))
    : state.questions.filter(q=> (!o.subject||q.subject===o.subject) && (!o.difficulty||q.difficulty===o.difficulty));
  if(pool.length===0){ toast('Não há questões com esses filtros. Adicione no Banco de Questões ou gere com o Zen.','error'); return false; }
  pool = shuffleArray(pool.slice());
  if(o.weakFocus) pool.sort((a,b)=> questionWeakScore(b)-questionWeakScore(a));
  pool = shuffleArray(pool.slice(0, Math.min(o.count, pool.length)));
  saveData('quizSaved', null);
  quizSession = { questions:pool, index:0, answers:new Array(pool.length).fill(null), pending:null, mode:o.mode, subject:o.subject,
    timeLimit:o.timeLimit, startedAt:Date.now(), elapsedBefore:0, endsAt:o.timeLimit ? Date.now()+o.timeLimit*60000 : null, timerId:null, finished:false,
    flags:{}, scratch:{}, warnings:0, fullscreen:o.fullscreen };
  beginQuizSession();
  return true;
}
// Liga cronômetro, bloqueio de abas e desenha a questão (usado ao começar e ao continuar uma pausada)
function beginQuizSession(){
  const s = quizSession;
  if(s.endsAt) s.timerId = setInterval(tickQuizTimer, 500);
  if(s.mode!=='pratica'){
    document.body.classList.add('exam-lock');
    if(s.fullscreen && document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().then(()=>{ s.inFullscreen = true; }).catch(()=>{});
    }
  }
  renderQuizScreen();
  window.scrollTo(0,0);
}
function renderQuizScreen(){ if(!quizSession) return; if(quizSession.mode==='prova') renderExamPaper(); else renderQuizQuestion(); }
// O cronômetro usa o horário de término (não "conta segundos"), então não atrasa com a aba em segundo plano
function quizTimeLeft(){ return quizSession && quizSession.endsAt ? Math.max(0, Math.round((quizSession.endsAt-Date.now())/1000)) : null; }
function tickQuizTimer(){
  if(!quizSession || quizSession.finished) return;
  const left = quizTimeLeft();
  document.querySelectorAll('.qz-timer').forEach(el=>{ el.textContent = '⏳ '+formatTimer(left); el.classList.toggle('badge-danger', left<=60); });
  if(left<=0){ clearInterval(quizSession.timerId); toast('Tempo esgotado! ⏰','info'); finishQuiz(true); }
}
function formatTimer(sec){ sec=Math.max(0,sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }
function endQuizUI(){
  document.body.classList.remove('exam-lock');
  closeScratch();
  if(quizSession && quizSession.inFullscreen && document.fullscreenElement && document.exitFullscreen){ quizSession.leavingFullscreen = true; document.exitFullscreen().catch(()=>{}); }
}
function abandonQuiz(){ if(quizSession && quizSession.timerId) clearInterval(quizSession.timerId); endQuizUI(); quizSession = null; }
/* --- pausa: salva tudo (respostas, onde estava, tempo restante, rascunhos) --- */
function saveQuizProgress(reason){
  const s = quizSession;
  if(!s || s.finished) return;
  saveData('quizSaved', {questionIds:s.questions.map(q=>q.id), answers:s.answers, index:s.index, mode:s.mode, subject:s.subject, timeLimit:s.timeLimit,
    timeLeft: s.endsAt ? quizTimeLeft() : null, elapsed:(s.elapsedBefore||0) + (Date.now()-s.startedAt), flags:s.flags, scratch:s.scratch,
    fullscreen:s.fullscreen, savedAt:Date.now(), reason:reason||''});
}
function pauseQuiz(reason, goTo){
  saveQuizProgress(reason);
  abandonQuiz();
  toast('Prova pausada e salva ⏸ Continue quando quiser em Simulados.', 'info');
  switchView(goTo || 'quizzes');
}
function resumeQuiz(){
  const sv = savedQuiz(); if(!sv) return;
  const byId = new Map(state.questions.map(q=>[q.id, q]));
  const keep = sv.questionIds.map((id,i)=> byId.has(id) ? i : -1).filter(i=> i>=0);
  if(!keep.length){ toast('As questões dessa prova não existem mais no banco.','error'); saveData('quizSaved', null); renderQuizzes(document.getElementById('view-root')); return; }
  quizSession = { questions:keep.map(i=> byId.get(sv.questionIds[i])), answers:keep.map(i=> sv.answers[i]), index:Math.min(sv.index||0, keep.length-1), pending:null,
    mode:sv.mode, subject:sv.subject, timeLimit:sv.timeLimit, startedAt:Date.now(), elapsedBefore:sv.elapsed||0,
    endsAt: sv.timeLeft!=null ? Date.now() + sv.timeLeft*1000 : null, timerId:null, finished:false,
    flags:sv.flags||{}, scratch:sv.scratch||{}, warnings:0, fullscreen:sv.fullscreen };
  saveData('quizSaved', null);
  toast('Continuando de onde você parou ▶', 'success');
  beginQuizSession();
}
/* --- bloqueio de abas: avisos e saída --- */
function examViolation(kind, goTo){
  const s = quizSession;
  if(!s || s.finished) return;
  if(s.mode==='pratica'){ pauseQuiz('você saiu da prática', goTo); return; }   // na prática não tem aviso: só pausa e salva
  s.warnings++;
  if(s.warnings > QUIZ_MAX_WARNINGS){ pauseQuiz('saiu da prova depois de 2 avisos', goTo); return; }
  saveQuizProgress('');   // por garantia
  const what = kind==='tab' ? 'Você saiu da página da prova (outra aba ou outro programa).' : kind==='fullscreen' ? 'Você saiu da tela cheia.' : 'As outras abas do app estão bloqueadas durante a prova.';
  openModal(`
    <div class="exam-warning">
      <div class="ew-icon">⚠️</div>
      <h3>Aviso ${s.warnings} de ${QUIZ_MAX_WARNINGS}</h3>
      <p>${what} Foco total, ${escapeHTML(userName())}! 🦫</p>
      <p class="muted-sm">${s.warnings>=QUIZ_MAX_WARNINGS ? 'Na próxima vez que sair, a prova é pausada e salva (dá pra continuar depois de onde parou).' : `Depois de ${QUIZ_MAX_WARNINGS} avisos, a próxima saída pausa a prova e salva onde você estava.`}</p>
      <div class="card-actions" style="justify-content:center; margin-top:14px;">
        <button class="btn btn-primary" onclick="closeModal()">Voltar pra prova</button>
        <button class="btn btn-ghost btn-sm" id="ew-pause">⏸ Pausar e sair agora</button>
      </div>
    </div>`);
  document.getElementById('ew-pause').addEventListener('click', ()=>{ closeModal(); pauseQuiz('pausado por você', goTo); });
  document.querySelectorAll('.exam-warn-count').forEach(el=> el.textContent = `⚠️ ${s.warnings}/${QUIZ_MAX_WARNINGS}`);
}
document.addEventListener('visibilitychange', ()=>{
  if(!quizSession || quizSession.finished) return;
  if(document.visibilityState==='hidden'){ saveQuizProgress(''); quizSession.wentHidden = true; }
  else if(quizSession.wentHidden){ quizSession.wentHidden = false; examViolation('tab'); }
});
document.addEventListener('fullscreenchange', ()=>{
  const s = quizSession;
  if(!s || s.finished || !s.inFullscreen) return;
  if(!document.fullscreenElement){ s.inFullscreen = false; if(s.leavingFullscreen) return; examViolation('fullscreen'); }
});
function quitQuiz(){
  const s = quizSession; if(!s) return;
  openModal(`
    <button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
    <h3>Sair ${s.mode==='pratica'?'da prática':'da prova'}?</h3>
    <p class="muted-sm" style="margin-bottom:14px;">Você pode pausar e continuar depois exatamente de onde parou${s.endsAt?', com o tempo que faltava':''}.</p>
    <div class="card-actions"><button class="btn btn-primary" id="qq-pause">⏸ Pausar e salvar</button><button class="btn btn-danger btn-sm" id="qq-drop">Desistir (não salva)</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">Continuar fazendo</button></div>`);
  document.getElementById('qq-pause').addEventListener('click', ()=>{ closeModal(); pauseQuiz('pausado por você'); });
  document.getElementById('qq-drop').addEventListener('click', ()=>{ closeModal(); abandonQuiz(); saveData('quizSaved', null); switchView('quizzes'); });
}
// Questão a questão: a próxima sem resposta (pra "Pular")
function nextUnanswered(from){
  const s = quizSession, n = s.questions.length;
  for(let k=1;k<=n;k++){ const i = (from+k)%n; if(s.answers[i]===null) return i; }
  return -1;
}

/* --- Prática e Simulado: uma questão por vez --- */
function renderQuizQuestion(){
  const s = quizSession;
  if(!s) return;
  const root = document.getElementById('view-root');
  const q = s.questions[s.index];
  const total = s.questions.length;
  const ans = s.answers[s.index];
  const isSim = s.mode==='simulado';
  const locked = !isSim && ans!==null;
  const answered = s.answers.filter(a=>a!==null).length;
  const sel = ans ? ans.selected : s.pending;
  root.innerHTML = `
    <div class="quiz-top">
      <span class="badge badge-primary">${escapeHTML(q.subject)}</span>
      <span class="badge">${escapeHTML(q.difficulty||'médio')}</span>
      <span>${isSim?'Simulado':'Prática'} · questão ${s.index+1} de ${total}</span>
      ${s.endsAt ? `<span class="badge badge-accent qz-timer">⏳ ${formatTimer(quizTimeLeft())}</span>` : ''}
      ${isSim ? `<span class="badge exam-warn-count">⚠️ ${s.warnings}/${QUIZ_MAX_WARNINGS}</span>` : ''}
      <span class="card-actions" style="margin-left:auto;">
        <button class="btn btn-ghost btn-sm" id="qz-scratch">✏️ Rascunho${(s.scratch[s.index]||[]).length?' •':''}</button>
        <button class="btn btn-ghost btn-sm" id="qz-quit">⏸ Sair</button>
      </span>
    </div>
    <div class="progress-bar" style="margin-top:10px;"><div style="width:${Math.round(answered/total*100)}%"></div></div>
    <div class="card" style="margin-top:14px;">
      <p class="quiz-question-text">${escapeHTML(q.question)}</p>${qVisualHTML(q)}
      <div id="qz-options">${q.options.map((opt,i)=>{
        let cls = 'quiz-option';
        if(sel===i) cls += ' selected';
        if(locked){ cls += ' disabled'; if(i===q.correctIndex) cls += ' correct'; else if(i===ans.selected) cls += ' incorrect'; }
        return `<button class="${cls}" data-i="${i}"><b>${'ABCDE'[i]})</b> ${escapeHTML(opt)}</button>`;
      }).join('')}</div>
      <div id="qz-feedback">${locked ? practiceFeedbackHTML(q, ans) : ''}</div>
      <div class="quiz-actions">${quizActionsHTML(s, locked, sel)}</div>
    </div>
    ${isSim ? `<div class="card" style="margin-top:14px;"><h4>Questões</h4>
      <div class="qz-nav-grid">${s.answers.map((a,i)=>`<button class="qz-nav-btn ${a?'answered':''} ${i===s.index?'current':''} ${s.flags[i]?'flagged':''}" data-goto="${i}" aria-label="Ir para a questão ${i+1}">${i+1}</button>`).join('')}</div>
      <p class="muted-sm" style="margin-top:10px;">${answered} de ${total} respondidas${Object.values(s.flags).filter(Boolean).length?` · 🚩 ${Object.values(s.flags).filter(Boolean).length} pra revisar`:''}. Dá pra pular, voltar e trocar respostas até entregar. Atalhos: 1–5 marcam, Enter avança.</p></div>`
    : `<p class="muted-sm" style="margin-top:10px;">${answered} de ${total} respondidas. Pulou alguma? Ela volta no final.</p>`}
  `;
  if(q.visual) hydrateVisuals(root);
  root.querySelectorAll('#qz-options .quiz-option').forEach(btn=> btn.addEventListener('click', ()=> selectQuizOption(parseInt(btn.dataset.i))));
  document.getElementById('qz-quit').addEventListener('click', quitQuiz);
  document.getElementById('qz-scratch').addEventListener('click', ()=> openScratch(s.index, `Questão ${s.index+1}`));
  const main = document.getElementById('qz-main-btn');
  main.addEventListener('click', ()=>{
    if(main.dataset.role==='confirm') confirmQuizAnswer();
    else if(main.dataset.role==='next') goToQuestion(isSim ? s.index+1 : nextUnanswered(s.index));
    else submitQuiz();
  });
  const bind = (id, fn)=>{ const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
  bind('qz-prev', ()=> goToQuestion(Math.max(0, s.index-1)));
  bind('qz-skip', ()=>{ const n = nextUnanswered(s.index); if(n<0 || n===s.index) toast('Essa é a única que falta! 🦫'); else goToQuestion(n); });
  bind('qz-flag', ()=>{ s.flags[s.index] = !s.flags[s.index]; saveQuizProgress(''); renderQuizQuestion(); });
  bind('qz-finish', submitQuiz);
  root.querySelectorAll('[data-goto]').forEach(b=> b.addEventListener('click', ()=> goToQuestion(parseInt(b.dataset.goto))));
  const zenBtn = document.getElementById('qz-zen-btn');
  if(zenBtn) zenBtn.addEventListener('click', ()=> explainWithZen(q, ans.selected, document.getElementById('qz-zen-holder'), zenBtn));
  if(scratchKey!=null && document.getElementById('scratch-panel') && !document.getElementById('scratch-panel').hidden) openScratch(s.index, `Questão ${s.index+1}`);
}
function goToQuestion(i){ const s = quizSession; if(!s || i<0 || i>=s.questions.length) return; s.index = i; s.pending = null; saveQuizProgress(''); renderQuizQuestion(); }
function practiceFeedbackHTML(q, ans){
  const ok = ans.correct;
  return `<div class="quiz-explain ${ok?'ok':'bad'}"><strong>${ok ? 'Certinho! ✅' : `Essa não foi ⚠️ A correta é a ${'ABCDE'[q.correctIndex]}.`}</strong>${q.explanation?`<p>${escapeHTML(q.explanation)}</p>`:''}</div>
    <div id="qz-zen-holder"></div>
    <button class="btn btn-ghost btn-sm" id="qz-zen-btn" style="margin-top:10px;">🦫 ${ok?'Aprofundar com o Zen':'Explicar meu erro com o Zen'}</button>`;
}
function quizActionsHTML(s, locked, sel){
  const last = s.index===s.questions.length-1;
  if(s.mode==='simulado'){
    return `<button class="btn btn-ghost" id="qz-prev" ${s.index===0?'disabled':''}>← Anterior</button>
      <button class="btn btn-ghost" id="qz-skip" title="Ir pra próxima sem resposta">⏭ Pular</button>
      <button class="btn btn-ghost" id="qz-flag">${s.flags[s.index]?'🚩 Marcada':'🏳️ Marcar'}</button>
      ${last ? `<button class="btn btn-primary" id="qz-main-btn" data-role="finish">Entregar simulado</button>`
             : `<button class="btn btn-primary" id="qz-main-btn" data-role="next">Próxima →</button><button class="btn btn-accent" id="qz-finish">Entregar</button>`}`;
  }
  if(!locked) return `<button class="btn btn-ghost" id="qz-skip" title="Deixa pra depois: ela volta no final">⏭ Pular</button><button class="btn btn-primary" id="qz-main-btn" data-role="confirm" ${sel===null||sel===undefined?'disabled':''}>Confirmar resposta</button>`;
  const more = nextUnanswered(s.index) >= 0;
  return `<button class="btn btn-primary" id="qz-main-btn" data-role="${more?'next':'finish'}">${more?'Próxima questão →':'Ver resultado'}</button>`;
}
function selectQuizOption(i){
  const s = quizSession;
  if(!s || s.finished) return;
  const q = s.questions[s.index];
  if(s.mode!=='pratica'){
    s.answers[s.index] = {selected:i, correct:i===q.correctIndex};
    saveQuizProgress('');
    renderQuizQuestion();
  } else {
    if(s.answers[s.index]) return;
    s.pending = i;
    document.querySelectorAll('#qz-options .quiz-option').forEach(b=> b.classList.toggle('selected', parseInt(b.dataset.i)===i));
    const main = document.getElementById('qz-main-btn');
    if(main) main.disabled = false;
  }
}
function confirmQuizAnswer(){
  const s = quizSession;
  if(!s || s.finished || s.pending===null || s.answers[s.index]) return;
  const q = s.questions[s.index];
  const correct = s.pending===q.correctIndex;
  s.answers[s.index] = {selected:s.pending, correct};
  q.history = q.history||[]; q.history.push({date:Date.now(), correct});
  persist('questions');
  if(correct) addXP(XP.questaoCerta);
  saveQuizProgress('');
  renderQuizQuestion();
}
function submitQuiz(){
  const s = quizSession;
  if(!s || s.finished) return;
  const blank = s.answers.filter(a=>a===null).length;
  const flagged = Object.keys(s.flags).filter(k=> s.flags[k]).length;
  const warn = [blank ? `${blank} ${plural(blank,'questão','questões')} em branco` : '', flagged ? `${flagged} ${plural(flagged,'marcada','marcadas')} pra revisar` : ''].filter(Boolean).join(' e ');
  if(warn && !confirm(`Você tem ${warn}. Entregar mesmo assim?`)) return;
  finishQuiz(false);
}

/* --- Rascunho: um quadro branco pequeno pra cada questão (e um geral) --- */
let scratchKey = null, scratchTool = 'pen', scratchColor = '#1C2B26', scratchDraw = null, scratchCanvas = null;
function openScratch(key, label){
  const s = quizSession; if(!s) return;
  scratchKey = String(key);
  let el = document.getElementById('scratch-panel');
  if(!el){
    el = document.createElement('div'); el.id = 'scratch-panel'; el.className = 'scratch-panel';
    el.innerHTML = `<div class="sp-head"><b id="sp-title"></b>
      <span class="sp-tools">
        <button type="button" data-st="pen" title="Lápis">✏️</button><button type="button" data-st="eraser" title="Borracha">🧽</button>
        ${['#1C2B26','#2F5F8A','#C1564A'].map(c=>`<button type="button" class="sp-color" data-sc="${c}" style="background:${c}"></button>`).join('')}
        <button type="button" id="sp-clear" title="Apagar tudo">🗑️</button><button type="button" id="sp-dock" title="Lado a lado com a questão">◧</button><button type="button" id="sp-max" title="Aumentar">⤢</button><button type="button" id="sp-close" title="Fechar">✕</button>
      </span></div>
      <div class="sp-body"><canvas id="sp-canvas"></canvas></div>
      <span class="sp-resize" title="Arraste pra mudar o tamanho"></span>`;
    document.body.appendChild(el);
    el.querySelectorAll('[data-st]').forEach(b=> b.addEventListener('click', ()=>{ scratchTool = b.dataset.st; updateScratchTools(); }));
    el.querySelectorAll('[data-sc]').forEach(b=> b.addEventListener('click', ()=>{ scratchColor = b.dataset.sc; scratchTool = 'pen'; updateScratchTools(); }));
    document.getElementById('sp-clear').addEventListener('click', ()=>{ if(!quizSession) return; if((quizSession.scratch[scratchKey]||[]).length && confirm('Apagar esse rascunho?')){ quizSession.scratch[scratchKey] = []; renderScratch(); scratchChanged(); } });
    document.getElementById('sp-close').addEventListener('click', closeScratch);
    scratchCanvas = document.getElementById('sp-canvas');
    scratchCanvas.addEventListener('pointerdown', onScratchDown);
    scratchCanvas.addEventListener('pointermove', onScratchMove);
    scratchCanvas.addEventListener('pointerup', onScratchUp);
    scratchCanvas.addEventListener('pointercancel', onScratchUp);
    new ResizeObserver(()=> sizeScratch()).observe(el.querySelector('.sp-body'));
    initScratchWindow(el);
  }
  el.hidden = false;
  applyScratchGeom();
  document.getElementById('sp-title').textContent = `✏️ ${label}`;
  s.scratch[scratchKey] = s.scratch[scratchKey] || [];
  updateScratchTools(); sizeScratch();
}
function closeScratch(){ const el = document.getElementById('scratch-panel'); if(el) el.hidden = true; scratchKey = null; document.body.classList.remove('scratch-docked'); }
function updateScratchTools(){
  document.querySelectorAll('#scratch-panel [data-st]').forEach(b=> b.classList.toggle('active', b.dataset.st===scratchTool));
  document.querySelectorAll('#scratch-panel [data-sc]').forEach(b=> b.classList.toggle('active', scratchTool==='pen' && b.dataset.sc===scratchColor));
}
function sizeScratch(){
  if(!scratchCanvas) return;
  const body = scratchCanvas.parentElement, dpr = window.devicePixelRatio||1;
  scratchCanvas.width = Math.max(1, Math.round(body.clientWidth*dpr)); scratchCanvas.height = Math.max(1, Math.round(body.clientHeight*dpr));
  scratchCanvas.style.width = body.clientWidth+'px'; scratchCanvas.style.height = body.clientHeight+'px';
  renderScratch();
}
function drawScratchStrokes(ctx, strokes, w, h, scale){
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.strokeStyle = 'rgba(47,95,138,.10)'; ctx.lineWidth = 1; ctx.beginPath();
  for(let y=28*scale; y<h; y+=28*scale){ ctx.moveTo(0, y); ctx.lineTo(w, y); } ctx.stroke(); ctx.restore();   // linhas de caderno
  ctx.save(); ctx.scale(scale, scale); strokes.forEach(st=> drawStroke(ctx, st)); ctx.restore();
}
function renderScratch(){
  if(!scratchCanvas || !quizSession || scratchKey==null) return;
  const ctx = scratchCanvas.getContext('2d'), dpr = window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);
  drawScratchStrokes(ctx, (quizSession.scratch[scratchKey]||[]).concat(scratchDraw ? [scratchDraw] : []), scratchCanvas.width, scratchCanvas.height, dpr);
}
function scratchPoint(e){ const r = scratchCanvas.getBoundingClientRect(); return {x:Math.round(e.clientX-r.left), y:Math.round(e.clientY-r.top)}; }
function onScratchDown(e){
  if(!quizSession) return;
  try{ scratchCanvas.setPointerCapture(e.pointerId); }catch(err){}
  const p = scratchPoint(e);
  if(scratchTool==='eraser'){ scratchErase(p); scratchDraw = {erasing:true}; return; }
  scratchDraw = {id:uid(), t:'pen', c:scratchColor, w:2.5, p:[p.x, p.y]};
}
function onScratchMove(e){
  if(!scratchDraw) return;
  const p = scratchPoint(e);
  if(scratchDraw.erasing){ scratchErase(p); return; }
  const pts = scratchDraw.p;
  if(Math.hypot(p.x-pts[pts.length-2], p.y-pts[pts.length-1]) < 1.5) return;
  pts.push(p.x, p.y); renderScratch();
}
function onScratchUp(){
  if(!scratchDraw || !quizSession) return;
  if(!scratchDraw.erasing) quizSession.scratch[scratchKey].push(scratchDraw);
  scratchDraw = null; renderScratch(); scratchChanged();
}
function scratchErase(p){
  const list = quizSession.scratch[scratchKey];
  const keep = list.filter(st=> !hitStroke(st, p.x, p.y, 8));
  if(keep.length!==list.length){ quizSession.scratch[scratchKey] = keep; renderScratch(); }
}
const scratchChanged = debounce(()=>{
  saveQuizProgress('');
  const k = scratchKey, has = quizSession && (quizSession.scratch[k]||[]).length;
  document.querySelectorAll(`[data-scratch="${k}"]`).forEach(b=> b.textContent = '✏️ Rascunho' + (has?' •':''));
  const qb = document.getElementById('qz-scratch'); if(qb && quizSession && String(quizSession.index)===k) qb.textContent = '✏️ Rascunho' + (has?' •':'');
}, 500);
function openScratchViewer(strokes, title){
  openLightbox(title, body=>{
    const c = document.createElement('canvas');
    const bb = strokes.length ? strokes.map(strokeBounds).reduce((a,b)=>({x0:Math.min(a.x0,b.x0), y0:Math.min(a.y0,b.y0), x1:Math.max(a.x1,b.x1), y1:Math.max(a.y1,b.y1)})) : {x0:0,y0:0,x1:400,y1:300};
    const w = Math.max(400, bb.x1+30), h = Math.max(300, bb.y1+30);
    c.width = w; c.height = h; c.style.maxWidth = '100%'; c.style.borderRadius = '10px'; c.style.margin = 'auto';
    drawScratchStrokes(c.getContext('2d'), strokes, w, h, 1);
    body.appendChild(c);
  });
}

/* --- Fim: resultado, gabarito comentado e rascunhos --- */
function finishQuiz(timeUp){
  const s = quizSession;
  if(!s || s.finished) return;
  s.finished = true;
  if(s.timerId) clearInterval(s.timerId);
  endQuizUI();
  saveData('quizSaved', null);
  const details = s.questions.map((q,i)=>{ const a = s.answers[i]; return {questionId:q.id, subject:q.subject, selected:a?a.selected:null, correct:!!(a && a.correct), flagged:!!s.flags[i]}; });
  if(s.mode!=='pratica'){
    // no simulado/prova o histórico de cada questão só é gravado na entrega
    s.questions.forEach((q,i)=>{ const a = s.answers[i]; if(a){ q.history = q.history||[]; q.history.push({date:Date.now(), correct:a.correct}); } });
    persist('questions');
    addXP(details.filter(d=>d.correct).length*XP.questaoCerta);
  }
  const score = details.filter(d=>d.correct).length;
  const total = details.length;
  const bySubject = {};
  details.forEach(d=>{ const b = bySubject[d.subject] = bySubject[d.subject]||{c:0,t:0}; b.t++; if(d.correct) b.c++; });
  const weakSubjects = Object.entries(bySubject).map(([subject,v])=>({subject, c:v.c, t:v.t, pct:Math.round(v.c/v.t*100)})).sort((a,b)=>a.pct-b.pct);
  const timeSpentSec = Math.round(((s.elapsedBefore||0) + Date.now()-s.startedAt)/1000);
  const scratch = {}; Object.entries(s.scratch||{}).forEach(([k,v])=>{ if(v && v.length) scratch[k] = v; });
  const attempt = { id:uid(), date:Date.now(), subject:s.subject||'Todas as matérias', mode:s.mode, score, total, timeSpentSec, weakSubjects, details, warnings:s.warnings||0, scratch };
  state.quizAttempts.push(attempt);
  if(state.quizAttempts.length>200) state.quizAttempts = state.quizAttempts.slice(-200);
  state.quizAttempts.slice(0, -5).forEach(a=>{ if(a.scratch) delete a.scratch; });   // rascunhos só dos últimos 5 (economiza espaço)
  persist('quizAttempts');
  state.stats.quizzesTaken = (state.stats.quizzesTaken||0)+1;
  persist('stats');
  addXP(XP.simulado);
  const mins = Math.max(1, Math.round(timeSpentSec/60));
  logStudyMinutes(mins);
  weakSubjects.forEach(w=> addSubjectMinutes(w.subject, mins*w.t/total));
  registerActivityToday();
  quizSession = null;
  if(currentView==='quizzes') renderQuizResult(attempt, s.questions, timeUp);
  checkAchievements();
}
function renderQuizResult(attempt, questions, timeUp){

  const wrong = questions.filter((q,i)=> !attempt.details[i].correct);
  const weakest = attempt.weakSubjects.find(w=>w.pct<70);
  const msg = pct===100 ? 'GABARITOU! A capivara tá sem palavras 🏆' : pct>=70 ? 'Mandou bem! 🎉' : pct>=50 ? 'Tá no caminho, bora reforçar os erros 💪' : 'Cada erro aqui é um acerto na prova. Bora revisar! 💪';
  const modeName = attempt.mode==='prova' ? 'Prova' : attempt.mode==='simulado' ? 'Simulado' : 'Prática';
  root.innerHTML = `
    <div class="card" style="text-align:center;">
      ${capySVG(pct>=70?'happy':'icon', 'mascot-float', 76)}
      <h3>${msg}</h3>
      <div class="result-score">${attempt.score}/${attempt.total} (${pct}%)</div>
      <p class="muted-sm">${modeName} · ${Math.floor(attempt.timeSpentSec/60)}min ${String(attempt.timeSpentSec%60).padStart(2,'0')}s${timeUp?' · ⏰ tempo esgotado':''}${attempt.warnings?` · ⚠️ ${attempt.warnings} ${plural(attempt.warnings,'aviso')} de foco`:''}</p>
    </div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card"><h4>Desempenho por matéria</h4>
        <table class="result-table"><thead><tr><th>Matéria</th><th>Acertos</th><th>%</th></tr></thead><tbody>
          ${attempt.weakSubjects.map(w=>`<tr><td>${escapeHTML(w.subject)}</td><td>${w.c}/${w.t}</td><td><span class="badge ${w.pct>=70?'badge-success':'badge-danger'}">${w.pct}%</span></td></tr>`).join('')}
        </tbody></table>
        ${weakest ? `<p class="muted-sm" style="margin-top:10px;">Ponto de atenção: <b>${escapeHTML(weakest.subject)}</b>.</p>` : ''}
      </div>
      <div class="card"><h4>Próximos passos</h4>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${wrong.length ? `<button class="btn btn-primary" id="qr-redo">🔁 Refazer as que errei (${wrong.length})</button>
            <button class="btn btn-accent" id="qr-cards">🗂️ Transformar erros em flashcards</button>` : ''}
          ${weakest ? `<button class="btn btn-ghost" id="qr-weak">🎯 Treinar ${escapeHTML(weakest.subject)}</button>` : ''}
          <button class="btn btn-ghost" onclick="switchView('quizzes')">Novo simulado</button>
          <button class="btn btn-ghost" onclick="switchView('progresso')">Ver progresso</button>
        </div>
      </div>
    </div>
    ${attempt.scratch && attempt.scratch.geral ? `<p style="margin-top:14px;"><button class="btn btn-ghost btn-sm" data-scratch-view="geral">✏️ Ver rascunho geral</button></p>` : ''}
    <div class="section-title"><h3>Gabarito comentado</h3></div>
    <div id="qr-review">${questions.map((q,i)=> reviewItemHTML(q, attempt.details[i], i, true, attempt.scratch && attempt.scratch[i])).join('')}</div>
  `;
  if(questions.some(q=>q.visual)) hydrateVisuals(root);
  const redo = document.getElementById('qr-redo');
  if(redo) redo.addEventListener('click', ()=> startQuiz({questionIds:wrong.map(q=>q.id), count:wrong.length, mode:'pratica'}));
  const cards = document.getElementById('qr-cards');
  if(cards) cards.addEventListener('click', ()=>{ errorsToFlashcards(wrong); cards.disabled = true; });
  const weakBtn = document.getElementById('qr-weak');
  if(weakBtn) weakBtn.addEventListener('click', ()=> startQuiz({subject:weakest.subject, count:10, mode:'pratica', weakFocus:true}));
  root.querySelectorAll('[data-explain]').forEach(b=> b.addEventListener('click', ()=>{
    const i = parseInt(b.dataset.explain);
    explainWithZen(questions[i], attempt.details[i].selected, document.getElementById('qr-zen-'+i), b);
  }));
  root.querySelectorAll('[data-scratch-view]').forEach(b=> b.addEventListener('click', ()=>{
    const k = b.dataset.scratchView;
    openScratchViewer(attempt.scratch[k]||[], k==='geral' ? 'Rascunho geral' : `Rascunho da questão ${+k+1}`);
  }));
  window.scrollTo(0,0);

function reviewItemHTML(q, d, i, withZen, scratch){
  const sel = d.selected;
  return `<div class="review-item ${d.correct?'ok':'bad'}">
    <div class="rq"><b>${i+1}.</b> ${d.flagged?'🚩 ':''}${escapeHTML(q.question)}</div>${qVisualHTML(q)}
    <div class="ra">${sel===null || sel===undefined || !q.options[sel] ? '⚪ Em branco' : `${d.correct?'✅':'❌'} Sua resposta: <b>${'ABCDE'[sel]})</b> ${escapeHTML(q.options[sel])}`}</div>
    ${d.correct ? '' : `<div class="ra">✔️ Correta: <b>${'ABCDE'[q.correctIndex]})</b> ${escapeHTML(q.options[q.correctIndex])}</div>`}
    ${q.explanation ? `<div class="ra muted-sm">💡 ${escapeHTML(q.explanation)}</div>` : ''}
    ${withZen ? `<div id="qr-zen-${i}"></div><div class="card-actions" style="margin-top:8px;">${d.correct ? '' : `<button class="btn btn-ghost btn-sm" data-explain="${i}">🦫 Explicar com o Zen</button>`}${scratch && scratch.length ? `<button class="btn btn-ghost btn-sm" data-scratch-view="${i}">✏️ Ver meu rascunho</button>` : ''}</div>` : ''}
  </div>`;
}
// Explicação detalhada da certa e da errada, sob demanda
async function explainWithZen(q, selectedIdx, holder, btn){
  if(!holder) return;
  setBusy(btn, 'Pensando…');
  const wrongPick = selectedIdx!==null && selectedIdx!==undefined && selectedIdx!==q.correctIndex && q.options[selectedIdx];
  const prompt = `Questão (${q.subject}): ${q.question}${q.visual ? '\nMaterial da questão (gráfico/tabela/figura em markdown):\n'+q.visual : ''}
Alternativas:
${q.options.map((o,i)=>`${'ABCDE'[i]}) ${o}`).join('\n')}
Resposta correta: ${'ABCDE'[q.correctIndex]}) ${q.options[q.correctIndex]}
${wrongPick ? `O ${userName()} marcou: ${'ABCDE'[selectedIdx]}) ${q.options[selectedIdx]}` : ''}

function renderBancoList(){

async function videoAI(v, action, btn){
  if(!v) return;
  const subject = ensureSubject(v.subject||'Geral');
  if(action==='chat'){ const a = videoAttachment(v); startChatWith(a ? [a] : [], `Assisti "${v.title}". Me explica os pontos principais e o que pode cair na prova.`); return; }
  if(action==='to-resumo'){ state.resumos.push({id:uid(), subject, title:`Vídeo: ${v.title}`, content:v.summary, createdAt:Date.now()}); persist('resumos'); addXP(XP.resumo); checkAchievements(); toast('Resumo salvo na aba Resumos! 📝','success'); return; }
  if(action==='to-nota'){ const n = createNote({subject, title:v.title, icon:'🎬', contentHTML: (extractYouTubeId(v.url) ? widgetHTML('youtube', {url:v.url}) : v.fileId ? widgetHTML('file', {file:v.fileId, name:v.title}) : '') + markdownToNoteHTML(v.summary)}); toast(`Anotação "${n.title}" criada! 🗒️`,'success'); return; }
  setBusy(btn, 'Zen assistindo…');
  try{
    const parts = await videoToAIParts(v);
    if(action==='summary'){
      const text = await askZen([{role:'user', parts:[...parts, {text:`Assista a esta vídeo-aula ("${v.title}", matéria ${subject}) e faça um resumo de estudo em português: comece com 1 frase dizendo do que se trata, depois os conceitos principais em tópicos com **negrito** nos termos-chave, fórmulas ou datas importantes (se houver) e termine com "O que pode cair na prova". Se ajudar, inclua um diagrama em bloco \`\`\`mermaid.`}]}], {cache:true});
      v.summary = text; persist('videos');
      addXP(XP.resumo); registerActivityToday(); logStudyMinutes(2, subject);
      renderVideoList();
      toast('Resumo do vídeo pronto! 🎬','success');
      return;
    }
    if(action==='cards'){
      const r = await askZenJSON(`Com base nesta vídeo-aula ("${v.title}"), crie de 6 a 12 flashcards (pergunta curta, resposta objetiva). Formato: {"cards":[{"front":"...","back":"..."}]}`, parts);
      const cards = sanitizeCards(r.cards).map(c=> newFlashcard(subject, c.front, c.back));
      if(!cards.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
      state.flashcards.push(...cards); persist('flashcards'); addXP(cards.length*XP.flashcardCriado);
      toast(`${cards.length} flashcards criados a partir do vídeo! 🗂️`,'success');
    }
    if(action==='questoes'){
      const r = await askZenJSON(`Com base nesta vídeo-aula ("${v.title}"), crie 5 questões de múltipla escolha no estilo de prova (4 alternativas, só uma correta) com explicação. "correctIndex" é o índice (0 a 3). Formato: {"questions":[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]}`, parts);
      const qs = sanitizeQuestions(r.questions).map(q=> newQuestion(subject, 'médio', q));
      if(!qs.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
      state.questions.push(...qs); persist('questions');
      toast(`${qs.length} questões adicionadas ao Banco! 🎯`,'success');
    }
    checkAchievements();
  }catch(err){
    if(err.code==='VIDEO_LINK') toast('Para o Zen assistir, use um link do YouTube ou envie o arquivo do vídeo.','error');
    else explainZenError(err);
  }
  resetBusy(btn);
}

function currentMap(){ return state.mindmaps.find(m=>m.id===mapEditingId); }
function renderMapNodes(){
  const map = currentMap();

  map.nodes.forEach(n=>{

  });

// O "palco" cresce conforme os nós se espalham (o canvas ganha rolagem)
function updateMapStage(){
  const map = currentMap(), canvas = document.getElementById('map-canvas'), stage = document.getElementById('map-stage'), svg = document.getElementById('map-edges');
  if(!map || !stage || !svg) return;
  let w = canvas.clientWidth, h = canvas.clientHeight;
  map.nodes.forEach(n=>{ w = Math.max(w, n.x+260); h = Math.max(h, n.y+120); });
  stage.style.width = w+'px'; stage.style.height = h+'px';
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  drawMapEdges();
}
function drawMapEdges(){
  const map = currentMap(), svg = document.getElementById('map-edges'), stage = document.getElementById('map-stage');
  if(!map || !svg || !stage) return;
  const center = n=>{ const el = stage.querySelector(`.map-node[data-id="${n.id}"]`); return {x:n.x+(el?el.offsetWidth:110)/2, y:n.y+(el?el.offsetHeight:40)/2}; };
  svg.innerHTML = map.edges.map(ed=>{
    const a = map.nodes.find(n=>n.id===ed.from), b = map.nodes.find(n=>n.id===ed.to);
    if(!a||!b) return '';
    const p = center(a), q = center(b), mx = (p.x+q.x)/2;
    return `<path class="map-edge" d="M${p.x},${p.y} C${mx},${p.y} ${mx},${q.y} ${q.x},${q.y}"/>`;
  }).join('');
}
function selectMapNode(id){

// Arrastar com mouse ou dedo (Pointer Events cobrem os dois)
function onMapPointerDown(e, node, el){
  if(el.classList.contains('editing') || (e.button!==undefined && e.button!==0)) return;
  e.preventDefault();
  if(mapConnectMode){ handleMapConnect(node); return; }
  selectMapNode(node.id);
  const rect = document.getElementById('map-stage').getBoundingClientRect();
  mapDrag = {node, el, offX:e.clientX-rect.left-node.x, offY:e.clientY-rect.top-node.y, moved:false};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove', onMapPointerMove);
  el.addEventListener('pointerup', onMapPointerUp);
  el.addEventListener('pointercancel', onMapPointerUp);
}
function onMapPointerMove(e){
  if(!mapDrag) return;
  const rect = document.getElementById('map-stage').getBoundingClientRect();
  const x = Math.max(0, Math.round(e.clientX-rect.left-mapDrag.offX)), y = Math.max(0, Math.round(e.clientY-rect.top-mapDrag.offY));
  if(x===mapDrag.node.x && y===mapDrag.node.y) return;
  mapDrag.moved = true;
  mapDrag.node.x = x; mapDrag.node.y = y;
  mapDrag.el.style.left = x+'px'; mapDrag.el.style.top = y+'px';
  drawMapEdges();
}
function onMapPointerUp(){
  if(!mapDrag) return;
  const {el, moved} = mapDrag;
  el.removeEventListener('pointermove', onMapPointerMove);
  el.removeEventListener('pointerup', onMapPointerUp);
  el.removeEventListener('pointercancel', onMapPointerUp);
  mapDrag = null;
  if(moved){ persist('mindmaps'); updateMapStage(); }
}
function handleMapConnect(node){
  const map = currentMap();
  if(!mapConnectFrom || mapConnectFrom===node.id){ mapConnectFrom = mapConnectFrom===node.id ? null : node.id; renderMapNodes(); return; }
  const idx = map.edges.findIndex(ed=> (ed.from===mapConnectFrom&&ed.to===node.id)||(ed.from===node.id&&ed.to===mapConnectFrom));
  if(idx>=0){ map.edges.splice(idx,1); toast('Ligação removida.'); }
  else map.edges.push({from:mapConnectFrom, to:node.id});
  mapConnectFrom = null;
  persist('mindmaps');
  renderMapNodes();
}
// Edição do texto direto no nó (Enter salva, Esc cancela)
function startMapNodeEdit(id){
  const map = currentMap();
  const node = map && map.nodes.find(n=>n.id===id);
  const el = document.querySelector(`#map-stage .map-node[data-id="${id}"]`);
  if(!node || !el) return;
  el.contentEditable = 'true'; el.classList.add('editing'); el.focus();
  const sel = window.getSelection(); sel.selectAllChildren(el);
  const finish = save=>{
    el.removeEventListener('blur', onBlur); el.removeEventListener('keydown', onKey);
    const text = el.textContent.replace(/\s+/g,' ').trim();
    if(save && text){ node.text = text.slice(0,120); persist('mindmaps'); }
    renderMapNodes();
  };
  const onBlur = ()=> finish(true);
  const onKey = e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); }
  };
  el.addEventListener('blur', onBlur); el.addEventListener('keydown', onKey);
}
function addMapChild(parentId, text, color){
  const map = currentMap();
  const p = map.nodes.find(n=>n.id===parentId);
  if(!p) return null;
  const siblings = map.edges.filter(ed=>ed.from===parentId).length;
  const child = {id:uid(), x:p.x+210, y:Math.max(0, p.y-30+siblings*58), text, color:color||p.color||'primary'};
  map.nodes.push(child); map.edges.push({from:parentId, to:child.id});
  return child;
}
// IA: mapa completo a partir do tema, distribuído em círculo ao redor do nó central
async function generateMindMapAI(subject, title){
  const r = await askZenJSON(`Monte um mapa mental de estudo sobre "${title}" (matéria "${subject}"). Use de 4 a 6 ramos principais, cada um com 2 a 4 subtópicos curtíssimos (no máximo 5 palavras cada). Formato: {"central":"...","branches":[{"title":"...","children":["...","..."]}]}`);
  const branches = (Array.isArray(r.branches)?r.branches:[]).map(b=>({
    title:String((b&&b.title)||'').trim(),
    children:(Array.isArray(b&&b.children)?b.children:[]).map(c=>String(c||'').trim()).filter(Boolean).slice(0,5)
  })).filter(b=>b.title).slice(0,8);
  if(!branches.length) throw Object.assign(new Error('mapa vazio'), {code:'JSON'});
  return layoutMindMap(String(r.central||title).trim()||title, branches);
}
// Distribui os ramos em círculo ao redor do tema central (usado pela IA e pelo chat)
function layoutMindMap(central, branches){
  const nodes = [], edges = [], cx = 560, cy = 380;
  const root = {id:uid(), x:cx, y:cy, text:central, color:'primary'};
  nodes.push(root);
  branches.forEach((b,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/branches.length;
    const color = ['accent','info','success','danger'][i%4];
    const bn = {id:uid(), x:cx+Math.cos(ang)*250, y:cy+Math.sin(ang)*190, text:b.title, color};
    nodes.push(bn); edges.push({from:root.id, to:bn.id});
    const k = b.children.length, spread = Math.min(0.42, (2*Math.PI/branches.length)*0.8/Math.max(1,k));
    b.children.forEach((c,j)=>{
      const a2 = ang + (j-(k-1)/2)*spread;
      const cn = {id:uid(), x:cx+Math.cos(a2)*460, y:cy+Math.sin(a2)*330, text:c, color};
      nodes.push(cn); edges.push({from:bn.id, to:cn.id});
    });
  });
  // centraliza cada nó no ponto calculado e desloca tudo para não ter coordenada negativa
  nodes.forEach(n=>{ n.x -= 55; n.y -= 20; });
  const minX = Math.min(...nodes.map(n=>n.x)), minY = Math.min(...nodes.map(n=>n.y));
  nodes.forEach(n=>{ n.x = Math.round(n.x-minX+20); n.y = Math.round(n.y-minY+20); });
  return {nodes, edges};
}
async function expandMapNodeAI(nodeId, btn){
  const map = currentMap();
  const node = map && map.nodes.find(n=>n.id===nodeId);
  if(!node) return;
  setBusy(btn, 'Pensando…');
  try{
    const r = await askZenJSON(`No mapa mental "${map.title}" (matéria "${map.subject}"), o tópico "${node.text}" precisa de subtópicos. Sugira de 3 a 5 subtópicos curtíssimos (no máximo 5 palavras cada) que ajudem a estudar esse ponto. Formato: {"children":["...","..."]}`);
    const kids = (Array.isArray(r.children)?r.children:[]).map(c=>String(c||'').trim()).filter(Boolean).slice(0,6);
    if(!kids.length) throw Object.assign(new Error('sem ideias'), {code:'JSON'});
    kids.forEach(t=> addMapChild(nodeId, t));
    persist('mindmaps'); renderMapNodes();
    toast(`${kids.length} ideias novas no mapa!`,'success');
  }catch(err){ explainZenError(err); }
  finally{ resetBusy(btn); }
}

/* ---------- Conversões: markdown ↔ anotação ---------- */
function widgetHTML(type, attrs){
  const a = Object.entries(attrs||{}).map(([k,v])=>` data-${k}="${escapeHTML(v)}"`).join('');
  return `<div class="nw" contenteditable="false" data-type="${type}"${a}></div>`;
}
// Markdown (do Zen) → HTML da anotação: blocos visuais viram widgets e "- [ ]" vira lista de tarefas
function markdownToNoteHTML(md){
  const tpl = document.createElement('template');
  tpl.innerHTML = renderMarkdown(md);
  tpl.content.querySelectorAll('.md-visual').forEach(v=>{ const t = document.createElement('template'); t.innerHTML = widgetHTML(v.dataset.type, {src:v.dataset.src}); v.replaceWith(t.content); });
  tpl.content.querySelectorAll('li').forEach(li=>{
    const first = li.firstChild;
    if(first && first.nodeType===3){
      const m = first.textContent.match(/^\s*\[( |x|X)\]\s*/);
      if(m){ first.textContent = first.textContent.slice(m[0].length); li.dataset.checked = m[1]===' ' ? 'false' : 'true'; li.parentElement.classList.add('todo'); }
    }
  });
  tpl.content.querySelectorAll('table').forEach(t=>{ t.classList.add('nt'); const w = document.createElement('div'); w.className='nt-wrap'; t.replaceWith(w); w.appendChild(t); });
  return tpl.innerHTML;
}
// HTML da anotação → markdown (exportar e mandar pra IA)
function htmlToMarkdown(html){
  const root = document.createElement('div');
  root.innerHTML = sanitizeHTML(html||'');
  const inl = node=> Array.from(node.childNodes).map(n=>{
    if(n.nodeType===3) return n.textContent.replace(/​/g,'');
    if(n.nodeType!==1) return '';
    const t = n.tagName, c = inl(n);
    if(n.classList.contains('md-math')) return `$${n.dataset.src}$`;
    if(t==='B'||t==='STRONG') return c.trim() ? `**${c}**` : c;
    if(t==='I'||t==='EM') return c.trim() ? `*${c}*` : c;
    if(t==='CODE') return '`'+c+'`';
    if(t==='S'||t==='STRIKE'||t==='DEL') return `~~${c}~~`;
    if(t==='MARK') return `==${c}==`;
    if(t==='A') return `[${c}](${n.getAttribute('href')||''})`;
    if(t==='BR') return '\n';
    return c;
  }).join('');
  const block = (n, depth)=>{
    if(n.nodeType===3) return n.textContent.trim();
    if(n.nodeType!==1) return '';
    const t = n.tagName, pad = '  '.repeat(depth);
    if(n.classList.contains('nw')){
      const d = n.dataset;
      if(d.type==='math') return `$$\n${d.src}\n$$`;
      if(['mermaid','html','chart'].includes(d.type)) return '```'+d.type+'\n'+d.src+'\n```';
      if(d.type==='youtube') return d.url;
      return `[📎 ${d.name||'arquivo'}]`;
    }
    if(/^H[1-6]$/.test(t)) return '#'.repeat(+t[1]) + ' ' + inl(n).trim();
    if(t==='UL'||t==='OL'){
      const todo = n.classList.contains('todo');
      return Array.from(n.children).map((li,i)=>{
        const sub = Array.from(li.children).filter(c=>c.tagName==='UL'||c.tagName==='OL').map(c=>block(c, depth+1)).join('\n');
        const clone = li.cloneNode(true); clone.querySelectorAll('ul,ol').forEach(x=>x.remove());
        const mark = todo ? (li.dataset.checked==='true' ? '- [x] ' : '- [ ] ') : (t==='OL' ? `${i+1}. ` : '- ');
        return pad + mark + inl(clone).trim() + (sub ? '\n'+sub : '');
      }).join('\n');
    }
    if(t==='BLOCKQUOTE') return '> ' + inl(n).trim().replace(/\n/g,'\n> ');
    if(t==='PRE') return '```'+(n.dataset.lang||'')+'\n'+n.textContent.replace(/\n$/,'')+'\n```';
    if(t==='HR') return '---';
    if(n.classList.contains('callout')) return `> ${n.dataset.icon||'💡'} ` + Array.from(n.childNodes).map(c=>block(c,0)).filter(Boolean).join('\n> ');
    if(n.classList.contains('tgl')){ const h = n.querySelector('.tgl-h'), b = n.querySelector('.tgl-b'); return `**▸ ${h?inl(h).trim():''}**\n` + (b ? Array.from(b.childNodes).map(c=>block(c,0)).filter(Boolean).join('\n\n') : ''); }
    if(n.classList.contains('nt-wrap') || t==='TABLE'){
      const rows = Array.from(n.querySelectorAll('tr')).map(tr=> Array.from(tr.children).map(td=> inl(td).trim().replace(/\|/g,'\\|').replace(/\n/g,' ')));
      if(!rows.length) return '';
      return [`| ${rows[0].join(' | ')} |`, `|${rows[0].map(()=>' --- ').join('|')}|`, ...rows.slice(1).map(r=>`| ${r.join(' | ')} |`)].join('\n');
    }
    if(t==='DIV' && n.querySelector('p,h1,h2,h3,ul,ol,pre,blockquote,div')) return Array.from(n.childNodes).map(c=>block(c,depth)).filter(Boolean).join('\n\n');
    return inl(n).trim();
  };
  return Array.from(root.childNodes).map(n=>block(n,0)).filter(Boolean).join('\n\n');
}

function focusEditor(atStart){
  const ed = document.getElementById('note-editable');
  if(!ed) return;
  if(document.activeElement===ed && !atStart) return;
  ed.focus();
  if(atStart || !noteRange){ const r = document.createRange(); r.selectNodeContents(ed); r.collapse(!!atStart); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  else restoreNoteRange();
}
function noteChanged(){
  const st = document.getElementById('note-status'); if(st) st.textContent = 'salvando…';
  noteDirty = true; clearTimeout(noteSaveTimer); noteSaveTimer = setTimeout(flushNoteSave, 600);
  updateWordCount();
}
function flushNoteSave(){
  clearTimeout(noteSaveTimer);
  if(!noteDirty) return;
  noteDirty = false;
  const note = currentNote(), ed = document.getElementById('note-editable');
  if(!note || !ed) return;
  note.contentHTML = serializeNoteHTML(ed); note.updatedAt = Date.now(); persist('notes');
  const st = document.getElementById('note-status'); if(st) st.textContent = 'salvo ✓';
}
// Guarda só o "esqueleto" dos widgets (o conteúdo é redesenhado ao abrir)
function serializeNoteHTML(ed){
  const c = ed.cloneNode(true);
  c.querySelectorAll('.nw').forEach(w=>{ w.innerHTML = ''; w.classList.remove('nw-sel'); });
  c.querySelectorAll('.md-math').forEach(m=>{ m.textContent = m.dataset.src||''; m.removeAttribute('data-ready'); m.removeAttribute('contenteditable'); });
  return sanitizeHTML(c.innerHTML);
}
function updateWordCount(){
  const ed = document.getElementById('note-editable'), el = document.getElementById('note-words');
  if(!ed || !el) return;
  const words = (ed.innerText||'').trim().split(/\s+/).filter(Boolean).length;
  el.textContent = `${words} ${plural(words,'palavra')} · ~${Math.max(1, Math.round(words/200))} min de leitura`;
}
// Menu suspenso genérico (usado na barra, no ícone e no "⋯")
function openMenu(anchor, items, cls){
  closeMenu();
  const m = document.createElement('div');
  m.className = 'pop-menu ' + (cls||''); m.id = 'pop-menu';
  m.innerHTML = items.map((it,i)=> it==='-' ? '<hr>' : `<button type="button" data-i="${i}" class="${it.danger?'danger':''}">${it.icon?`<span class="pm-i">${it.icon}</span>`:''}<span>${escapeHTML(it.label)}${it.desc?`<small>${escapeHTML(it.desc)}</small>`:''}</span></button>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(r.bottom+6, innerHeight - m.offsetHeight - 8) + 'px';
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.addEventListener('mousedown', e=> e.preventDefault());
  m.querySelectorAll('[data-i]').forEach(b=> b.addEventListener('click', ()=>{ closeMenu(); items[+b.dataset.i].run(); }));
  setTimeout(()=> document.addEventListener('mousedown', menuOutside), 0);
  return m;
}
function menuOutside(e){ const m = document.getElementById('pop-menu'); if(m && !m.contains(e.target)) closeMenu(); }
function closeMenu(){ const m = document.getElementById('pop-menu'); if(m) m.remove(); document.removeEventListener('mousedown', menuOutside); }
function openIconPicker(anchor, onPick){
  const m = openMenu(anchor, [], 'icon-menu');
  m.innerHTML = NOTE_ICONS.map(i=>`<button type="button" class="icon-opt">${i}</button>`).join('');
  m.querySelectorAll('.icon-opt').forEach(b=> b.addEventListener('click', ()=>{ closeMenu(); onPick(b.textContent); }));
}
function onNoteToolbar(key, btn){

  else if(key==='todo'){ focusEditor(); runBlock('todo'); }
  else if(key==='callout'){ focusEditor(); runBlock('callout'); }
  else if(key==='table'){ focusEditor(); saveNoteRange(); runBlock('table'); }
  else if(key==='attach'){ saveNoteRange(); insertFilesPicker(''); }
  else if(key==='focus'){
    state.settings.noteFocus = !state.settings.noteFocus; persist('settings');
    document.getElementById('notas-layout').classList.toggle('note-focus', state.settings.noteFocus);
    if(state.settings.noteFocus && !state.settings.wideMode) setWideMode(true);
    if(!state.settings.noteFocus && state.settings.wideMode) setWideMode(false);
    btn.textContent = state.settings.noteFocus ? '⤡' : '⤢';
  }
  else if(key==='zen'){ saveNoteRange(); openMenu(btn, [
    {icon:'🦫', label:'Pedir ao Zen pra escrever aqui', desc:'explicação, tabela, diagrama, exercícios…', run:zenWriteHere},
    {icon:'✍️', label:'Continuar escrevendo', run:zenContinue},

    {icon:'📝', label:'Gerar resumo desta anotação', desc:'vai para a aba Resumos', run:()=> noteAI('resumo')},
    {icon:'🗂️', label:'Criar flashcards', run:()=> noteAI('flashcards')},
    {icon:'🎯', label:'Criar questões para simulado', run:()=> noteAI('questoes')},
    {icon:'💬', label:'Conversar sobre ela no chat', run:()=> noteToChat(note)}
  ]); }
  else if(key==='more'){ openMenu(btn, [
    {icon: note.wide?'↔️':'↔️', label: note.wide ? 'Página com largura normal' : 'Página larga', run:()=>{ note.wide = !note.wide; persist('notes'); document.getElementById('note-page').classList.toggle('wide', note.wide); }},
    {icon:'📄', label:'Duplicar', run:()=>{ flushNoteSave(); const n = createNote({subject:note.subject, title:note.title+' (cópia)', icon:note.icon, contentHTML:note.contentHTML}); noteEditingId = n.id; renderNotasList(); renderNoteEditor(); }},
    {icon:'⬇️', label:'Exportar como Markdown (.md)', run:()=>{ flushNoteSave(); downloadText(`${note.title.replace(/[\\/:*?"<>|]/g,'').slice(0,50)||'anotacao'}.md`, `# ${note.title}\n\n${htmlToMarkdown(note.contentHTML)}`, 'text/markdown'); }},
    {icon:'🖨️', label:'Imprimir / salvar em PDF', run:printNote},
    '-',
    {icon:'🗑️', label:'Excluir anotação', danger:true, run:()=>{
      if(!confirm(`Excluir a anotação "${note.title||'Sem título'}"?`)) return;
      noteDirty = false; state.notes = state.notes.filter(n=>n.id!==note.id); persist('notes'); noteEditingId = null; renderNotasList(); renderNoteEditor();
    }}
  ]); }
}
function noteMarkdown(note){ flushNoteSave(); return `# ${note.title}\n\n${htmlToMarkdown(note.contentHTML)}`; }
function noteFileAttachments(note){

async function noteAI(kind){
  const note = currentNote(); if(!note) return;
  const md = noteMarkdown(note);
  if(md.replace(/^#.*$/m,'').trim().length < 20){ toast('Escreva um pouco mais na anotação primeiro 🦫'); return; }
  toast('O Zen está lendo sua anotação…');

function htmlToEl(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function editorEl(){ return document.getElementById('note-editable'); }
function saveNoteRange(){ const ed = editorEl(), s = getSelection(); if(ed && s.rangeCount && ed.contains(s.getRangeAt(0).startContainer)) noteRange = s.getRangeAt(0).cloneRange(); }
function restoreNoteRange(){
  const ed = editorEl(); if(!ed) return;
  ed.focus({preventScroll:true});
  const s = getSelection(); s.removeAllRanges();
  if(noteRange && ed.contains(noteRange.startContainer)) s.addRange(noteRange);
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.addRange(r); }
}
function closestBlock(node, ed){ if(!node || node===ed) return null; while(node && node.parentNode!==ed) node = node.parentNode; return node||null; }
function currentBlock(){ const ed = editorEl(), s = getSelection(); if(!ed || !s.rangeCount || !ed.contains(s.getRangeAt(0).startContainer)) return null; return closestBlock(s.getRangeAt(0).startContainer, ed); }
function placeCaretAtEnd(node){ const r = document.createRange(); r.selectNodeContents(node); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function ensureParagraphAfter(el){ if(!el.nextSibling || (el.nextElementSibling && /\bnw\b|nt-wrap/.test(el.nextElementSibling.className))){ const p = htmlToEl('<p><br></p>'); el.after(p); return p; } return el.nextElementSibling; }
// Transforma a linha atual num bloco novo (tarefa, destaque, alternável…) mantendo o texto
function convertBlock(build, focusSel){
  const ed = editorEl();
  const block = currentBlock();
  const simple = block && (block.nodeType===3 || (/^(P|DIV|H1|H2|H3|BLOCKQUOTE)$/.test(block.tagName) && !/\b(nw|callout|tgl|nt-wrap)\b/.test(block.className)));
  const inner = !simple ? '' : block.nodeType===3 ? escapeHTML(block.textContent) : block.innerHTML.replace(/^<br>$/,'');
  const el = htmlToEl(build(inner));
  if(simple) block.replaceWith(el); else if(block) block.after(el); else ed.appendChild(el);
  ensureParagraphAfter(el);
  placeCaretAtEnd(focusSel ? (el.querySelector(focusSel)||el) : el);
  noteChanged();
  return el;
}
function insertBlockAtCaret(el, focusSel){
  const ed = editorEl(); if(!ed) return el;
  restoreNoteRange();
  const block = currentBlock();
  if(block && block.nodeType===1 && !block.textContent.trim() && !block.querySelector('img,table,.nw') && !/\bnw\b/.test(block.className)) block.replaceWith(el);
  else if(block) block.after(el); else ed.appendChild(el);
  const after = ensureParagraphAfter(el);
  placeCaretAtEnd(focusSel ? (el.querySelector(focusSel)||after) : after);
  saveNoteRange(); noteChanged();
  return el;
}
function runBlock(key){
  const tags = {p:'P', h1:'H1', h2:'H2', h3:'H3', quote:'BLOCKQUOTE'};
  if(tags[key]) document.execCommand('formatBlock', false, tags[key]);
  else if(key==='ul') document.execCommand('insertUnorderedList');
  else if(key==='ol') document.execCommand('insertOrderedList');
  else if(key==='todo') convertBlock(i=>`<ul class="todo"><li data-checked="false">${i||'<br>'}</li></ul>`, 'li');
  else if(key==='toggle') convertBlock(i=>`<div class="tgl" data-open="1"><p class="tgl-h">${i||'<br>'}</p><div class="tgl-b"><p><br></p></div></div>`, '.tgl-h');
  else if(key==='callout') convertBlock(i=>`<div class="callout" data-icon="💡"><p>${i||'<br>'}</p></div>`, 'p');
  else if(key==='code') convertBlock(i=>`<pre class="code"><code>${i ? escapeHTML(htmlToPlain(i)) : '<br>'}</code></pre>`, 'code');
  else if(key==='hr') insertBlockAtCaret(htmlToEl('<hr>'));
  else if(key==='table') insertBlockAtCaret(htmlToEl('<div class="nt-wrap"><table class="nt"><tbody><tr><th>Coluna 1</th><th>Coluna 2</th><th>Coluna 3</th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table></div>'), 'td');
  noteChanged();
}

function setupRichEditor(ed){
  ed.addEventListener('input', ()=>{ slashDetect(ed); noteChanged(); });
  ed.addEventListener('keydown', e=> onEditorKeydown(e, ed));
  ['keyup','mouseup','blur'].forEach(ev=> ed.addEventListener(ev, saveNoteRange));
  ed.addEventListener('mousedown', e=> onEditorMousedown(e, ed));
  ed.addEventListener('click', e=>{
    const a = e.target.closest('a');
    if(a && (e.ctrlKey || e.metaKey) && safeUrl(a.href)){ e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }
    const img = e.target.closest('.nw-img');
    if(img) widgetAction(img.closest('.nw'), 'expand');
  });
  ed.addEventListener('paste', e=>{
    const files = Array.from((e.clipboardData && e.clipboardData.files)||[]);
    if(files.length){ e.preventDefault(); saveNoteRange(); insertFilesIntoNote(files); return; }
    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    if(text==null) return;
    e.preventDefault();
    const inCode = getSelection().anchorNode && (getSelection().anchorNode.nodeType===1 ? getSelection().anchorNode : getSelection().anchorNode.parentElement).closest('pre');
    // texto com cara de markdown (de outro app ou do ChatGPT) vira formatação de verdade
    if(!inCode && /\n/.test(text) && /(^|\n)\s*(#{1,4}\s|[-*]\s|\d+\.\s|```|\|.+\||>\s|\$\$)/.test(text)){ saveNoteRange(); insertMarkdownAtCaret(text, true); }
    else document.execCommand('insertText', false, text);
  });
  ed.addEventListener('dragover', e=>{ if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  ed.addEventListener('drop', e=>{
    const files = Array.from((e.dataTransfer && e.dataTransfer.files)||[]);
    if(!files.length) return;
    e.preventDefault();
    const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if(r){ const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    saveNoteRange(); insertFilesIntoNote(files);
  });
}
function onEditorMousedown(e, ed){
  const nwBtn = e.target.closest('[data-nw]');
  if(nwBtn){ e.preventDefault(); widgetAction(nwBtn.closest('.nw'), nwBtn.dataset.nw); return; }
  const li = e.target.closest('ul.todo > li');
  if(li && e.target===li && e.clientX - li.getBoundingClientRect().left < 26){ e.preventDefault(); li.dataset.checked = li.dataset.checked==='true' ? 'false' : 'true'; if(li.dataset.checked==='true') addXP(1); noteChanged(); return; }
  const th = e.target.closest('.tgl-h');
  if(th && e.target===th && e.clientX - th.getBoundingClientRect().left < 24){ e.preventDefault(); const t = th.closest('.tgl'); t.dataset.open = t.dataset.open==='0' ? '1' : '0'; noteChanged(); return; }
  const co = e.target.closest('.callout');
  if(co && e.target===co && e.clientX - co.getBoundingClientRect().left < 40){ e.preventDefault(); co.dataset.icon = CALLOUT_ICONS[(CALLOUT_ICONS.indexOf(co.dataset.icon)+1) % CALLOUT_ICONS.length]; noteChanged(); }
}
function onEditorKeydown(e, ed){
  if(slashState && slashState.range){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); slashState.active = (slashState.active + (e.key==='ArrowDown'?1:-1) + slashState.items.length) % slashState.items.length; renderSlashMenu(); return; }
    if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); chooseSlash(slashState.active); return; }
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeSlashMenu(); return; }
  }
  const sel = getSelection();
  const node = sel.anchorNode ? (sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement) : null;
  const pre = node && node.closest('pre'), cell = node && node.closest('td,th'), li = node && node.closest('li'), tglH = node && node.closest('.tgl-h');
  if(e.key==='Enter' && pre && ed.contains(pre)){
    e.preventDefault();
    if(e.ctrlKey || e.shiftKey){ placeCaretAtEnd(ensureParagraphAfter(closestBlock(pre, ed)||pre)); return; }
    document.execCommand('insertLineBreak'); return;
  }
  if(e.key==='Enter' && !e.shiftKey && tglH){
    e.preventDefault();
    const t = tglH.closest('.tgl'); t.dataset.open = '1';
    let b = t.querySelector('.tgl-b'); if(!b){ b = htmlToEl('<div class="tgl-b"><p><br></p></div>'); t.appendChild(b); }
    if(!b.firstElementChild) b.innerHTML = '<p><br></p>';
    placeCaretAtEnd(b.firstElementChild); return;
  }
  if(e.key==='Enter' && li && li.parentElement.classList.contains('todo')){
    setTimeout(()=>{ const s = getSelection(); const n = s.anchorNode && (s.anchorNode.nodeType===1 ? s.anchorNode : s.anchorNode.parentElement); const nl = n && n.closest('ul.todo > li'); if(nl && nl!==li) nl.dataset.checked = 'false'; }, 0);
  }
  if(e.key==='Tab'){
    if(pre){ e.preventDefault(); document.execCommand('insertText', false, '  '); return; }
    if(cell){
      e.preventDefault();
      const cells = [...cell.closest('table').querySelectorAll('td,th')];
      let i = cells.indexOf(cell) + (e.shiftKey ? -1 : 1);
      if(i>=cells.length){ tableBarCell = cell; tableOp('row'); i = cells.length; }
      const next = [...cell.closest('table').querySelectorAll('td,th')][Math.max(0,i)];
      if(next) placeCaretAtEnd(next);
      return;
    }
    if(li){ e.preventDefault(); document.execCommand(e.shiftKey ? 'outdent' : 'indent'); noteChanged(); return; }
  }
  // Atalhos de markdown: "# ", "- ", "[] ", "> ", "``` ", "--- "…
  if(e.key===' ' && !pre){
    const block = currentBlock();
    if(block && (block.nodeType===3 || /^(P|DIV)$/.test(block.tagName)) && !(block.nodeType===1 && /\b(callout|tgl|nt-wrap|nw)\b/.test(block.className))){
      const r = document.createRange(); r.setStart(block, 0); r.setEnd(sel.anchorNode, sel.anchorOffset);
      const key = MD_SHORTCUTS[r.toString()];
      if(key){
        e.preventDefault();
        const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('delete');
        runBlock(key);
      }
    }
  }
}
// Menu do "/"
function normTxt(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function filterSlash(q){ q = normTxt(q); return q ? SLASH_ITEMS.filter(it=> normTxt(it.k+' '+it.label).includes(q)) : SLASH_ITEMS; }
function slashDetect(ed){
  const sel = getSelection();
  if(!sel.rangeCount || !sel.isCollapsed){ if(slashState && slashState.range) closeSlashMenu(); return; }
  const r = sel.getRangeAt(0), node = r.startContainer;
  if(node.nodeType!==3 || !ed.contains(node) || node.parentElement.closest('pre,.nw,td,th')){ if(slashState && slashState.range) closeSlashMenu(); return; }
  const m = node.textContent.slice(0, r.startOffset).match(/(?:^|\s)\/([^\s\/]{0,20})$/);
  if(!m){ if(slashState && slashState.range) closeSlashMenu(); return; }
  const range = document.createRange(); range.setStart(node, r.startOffset - m[1].length - 1); range.setEnd(node, r.startOffset);
  openSlashMenu(null, m[1], range);
}
function openSlashMenu(anchor, query, range){
  const items = filterSlash(query);
  if(!items.length){ closeSlashMenu(); return; }
  let el = document.getElementById('slash-menu');
  if(!el){ el = document.createElement('div'); el.id = 'slash-menu'; el.className = 'pop-menu slash-menu'; document.body.appendChild(el); el.addEventListener('mousedown', e=> e.preventDefault()); }
  slashState = {range, items, active:0, el};
  renderSlashMenu();
  let rect = range ? range.getBoundingClientRect() : anchor.getBoundingClientRect();
  if(range && !rect.height) rect = range.startContainer.parentElement.getBoundingClientRect();
  let top = rect.bottom + 6;
  if(top + el.offsetHeight > innerHeight - 8) top = Math.max(8, rect.top - el.offsetHeight - 6);
  el.style.top = top+'px';
  el.style.left = Math.max(8, Math.min(rect.left, innerWidth - el.offsetWidth - 8))+'px';
  if(!range) setTimeout(()=> document.addEventListener('mousedown', slashOutside), 0);
}
function renderSlashMenu(){
  const st = slashState; if(!st) return;
  st.el.innerHTML = `<div class="slash-title">Inserir bloco</div>` + st.items.map((it,i)=>`<button type="button" data-i="${i}" class="${i===st.active?'active':''}"><span class="pm-i">${escapeHTML(it.icon)}</span><span>${escapeHTML(it.label)}${it.desc?`<small>${escapeHTML(it.desc)}</small>`:''}</span></button>`).join('');
  st.el.querySelectorAll('[data-i]').forEach(b=> b.addEventListener('click', ()=> chooseSlash(+b.dataset.i)));
  const act = st.el.querySelector('.active'); if(act) act.scrollIntoView({block:'nearest'});
}
function slashOutside(e){ const el = document.getElementById('slash-menu'); if(el && !el.contains(e.target)) closeSlashMenu(); }
function closeSlashMenu(){ const el = document.getElementById('slash-menu'); if(el) el.remove(); slashState = null; document.removeEventListener('mousedown', slashOutside); }
function chooseSlash(i){
  const st = slashState; if(!st) return;
  const item = st.items[i];
  closeSlashMenu();
  if(st.range){ const s = getSelection(); s.removeAllRanges(); s.addRange(st.range); document.execCommand('delete'); }
  else restoreNoteRange();
  saveNoteRange();
  item.run();
}

function wrapSelection(tag){

function tableOp(op){
  const cell = tableBarCell; if(!cell || !cell.isConnected) return;
  const table = cell.closest('table'), tr = cell.parentElement, idx = cell.cellIndex;
  if(op==='row'){ const nr = document.createElement('tr'); [...tr.children].forEach(()=>{ const td = document.createElement('td'); td.innerHTML='<br>'; nr.appendChild(td); }); tr.after(nr); }

  else if(op==='delrow'){ if(table.rows.length>1) tr.remove(); }
  else if(op==='delcol'){ if(tr.cells.length>1) [...table.rows].forEach(row=>{ if(row.cells[idx]) row.cells[idx].remove(); }); }

  noteChanged();

// Acerto por matéria: questões (simulados/prática) + flashcards
function subjectAccuracy(){
  const map = {};
  const get = s=> map[s] = map[s] || {subject:s, qc:0, qt:0, fc:0, ft:0};
  state.questions.forEach(q=> (q.history||[]).forEach(h=>{ const m = get(q.subject); m.qt++; if(h.correct) m.qc++; }));
  state.flashcards.forEach(f=>{ if(f.totalReviews){ const m = get(f.subject); m.ft += f.totalReviews; m.fc += f.correctCount||0; } });
  return Object.values(map).map(m=>({...m,
    qPct: m.qt ? Math.round(m.qc/m.qt*100) : null,
    fPct: m.ft ? Math.round(m.fc/m.ft*100) : null}));
}

// Os arquivos em si ficam no IndexedDB (cabe muito mais que o localStorage); a lista (nome, tipo, matéria) fica em state.files
const FileStore = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(CURRENT_PROFILE.filesDB, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore('files', {keyPath:'id'});
      req.onsuccess = ()=>{ this._db = req.result; resolve(this._db); };
      req.onerror = ()=> reject(req.error);
    });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const t = db.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = ()=> resolve(req ? req.result : undefined);
      t.onerror = ()=> reject(t.error); t.onabort = ()=> reject(t.error);
    });
  },
  put(rec){ return this.run('readwrite', s=> s.put(rec)); },
  get(id){ return this.run('readonly', s=> s.get(id)); },
  del(id){ return this.run('readwrite', s=> s.delete(id)); },
  all(){ return this.run('readonly', s=> s.getAll()); }
};
const fileUrlCache = new Map();
async function fileURL(id){
  if(fileUrlCache.has(id)) return fileUrlCache.get(id);
  const rec = await FileStore.get(id).catch(()=>null);
  if(!rec) return null;
  const url = URL.createObjectURL(rec.blob);
  fileUrlCache.set(id, url);
  return url;
}
const MIME_BY_EXT = {pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', heic:'image/heic', svg:'image/svg+xml',
  txt:'text/plain', md:'text/markdown', csv:'text/csv', html:'text/html', htm:'text/html', json:'application/json',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', doc:'application/msword',
  pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime', mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', ogg:'audio/ogg'};
function guessMime(name){ const ext = String(name||'').split('.').pop().toLowerCase(); return MIME_BY_EXT[ext] || 'application/octet-stream'; }
function fileKind(meta){
  const t = (meta.type||'').toLowerCase(), n = (meta.name||'').toLowerCase();
  if(t==='image/svg+xml' || n.endsWith('.svg')) return 'text';
  if(t.startsWith('image/')) return 'image';
  if(t==='application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if(t.startsWith('video/')) return 'video';
  if(t.startsWith('audio/')) return 'audio';
  if(/wordprocessingml|msword/.test(t) || /\.docx?$/.test(n)) return 'doc';
  if(t.startsWith('text/') || t==='application/json' || /\.(txt|md|csv|json|html?)$/.test(n)) return 'text';
  return 'other';
}
const FILE_ICONS = {image:'🖼️', pdf:'📕', video:'🎬', audio:'🎧', doc:'📝', text:'📄', other:'📦'};
function fileIcon(meta){ return FILE_ICONS[fileKind(meta)]; }
function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1).replace('.',',')+' MB'; }
// Abre o seletor de arquivos do sistema e devolve a lista escolhida
function pickFiles(accept, multiple){
  return new Promise(resolve=>{
    const input = document.createElement('input');
    input.type = 'file'; if(accept) input.accept = accept; input.multiple = multiple!==false;
    input.addEventListener('change', ()=> resolve(Array.from(input.files||[])));
    input.addEventListener('cancel', ()=> resolve([]));
    input.click();
  });
}
async function saveFile(file, opts){
  opts = opts||{};
  const meta = {id:uid(), name:file.name||opts.name||'arquivo', type:file.type||guessMime(file.name), size:file.size, subject:opts.subject||'', source:opts.source||'arquivos', createdAt:Date.now()};
  await FileStore.put(Object.assign({}, meta, {blob:file}));
  state.files.push(meta); persist('files');
  if(navigator.storage && navigator.storage.persist && !state.settings.storagePersistAsked){ state.settings.storagePersistAsked = true; persist('settings'); navigator.storage.persist().catch(()=>{}); }
  return meta;
}
async function saveFilesWithToast(files, opts){
  const saved = [];
  for(const f of files){
    try{ saved.push(await saveFile(f, opts)); }
    catch(e){ console.error(e); toast(`Não consegui guardar "${f.name}" (espaço do navegador cheio?).`, 'error'); }
  }
  return saved;
}
async function deleteFile(id){
  await FileStore.del(id).catch(()=>{});
  state.files = state.files.filter(f=>f.id!==id); persist('files');
  if(fileUrlCache.has(id)){ URL.revokeObjectURL(fileUrlCache.get(id)); fileUrlCache.delete(id); }
}
async function downloadFile(meta){
  const url = await fileURL(meta.id);
  if(!url){ toast('Arquivo não encontrado neste navegador.','error'); return; }
  const a = document.createElement('a'); a.href = url; a.download = meta.name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Arquivo → partes para o Gemini (ele lê PDF, imagem, áudio, vídeo curto e texto) ---------- */
const AI_INLINE_LIMIT = 18*1024*1024;
const GEMINI_IMAGE_TYPES = ['image/png','image/jpeg','image/webp','image/heic','image/heif'];
function blobToBase64(blob){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=> res(String(r.result).split(',')[1]||''); r.onerror = ()=> rej(r.error); r.readAsDataURL(blob); });
}
// GIF/BMP etc. viram PNG antes de ir pra IA
async function toSupportedImage(blob){
  if(GEMINI_IMAGE_TYPES.includes(blob.type)) return blob;
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    return await new Promise(res=> c.toBlob(res, 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
async function docxToText(blob){ const mm = await loadMammoth(); return (await mm.extractRawText({arrayBuffer: await blob.arrayBuffer()})).value; }
async function fileToAIParts(meta){
  const rec = await FileStore.get(meta.id).catch(()=>null);
  if(!rec) return [{text:`(O arquivo "${meta.name}" não está mais salvo neste navegador.)`}];
  const kind = fileKind(meta);
  if(kind==='doc'){
    if(/\.doc$/i.test(meta.name)) throw Object.assign(new Error('doc antigo'), {code:'ARQUIVO_TIPO', fileName:meta.name});
    return [{text:`Conteúdo do documento "${meta.name}":\n${(await docxToText(rec.blob)).slice(0,300000)}`}];
  }
  if(kind==='text') return [{text:`Conteúdo do arquivo "${meta.name}":\n${(await rec.blob.text()).slice(0,300000)}`}];
  if(['image','pdf','audio','video'].includes(kind)){
    let blob = kind==='image' ? await toSupportedImage(rec.blob) : rec.blob;
    if(blob.size > AI_INLINE_LIMIT) throw Object.assign(new Error('arquivo grande'), {code:'ARQUIVO_GRANDE', fileName:meta.name});
    const mimeType = kind==='pdf' ? 'application/pdf' : (blob.type || meta.type || guessMime(meta.name));
    return [{inlineData:{mimeType, data: await blobToBase64(blob)}}, {text:`(arquivo anexado: ${meta.name})`}];
  }
  throw Object.assign(new Error('tipo não suportado'), {code:'ARQUIVO_TIPO', fileName:meta.name});
}
// Ações de IA em cima de um arquivo: vira resumo, flashcards ou questões
async function fileAIAction(meta, action, btn){
  setBusy(btn, 'Zen lendo…');
  try{
    const parts = await fileToAIParts(meta);
    const subject = ensureSubject(meta.subject || 'Geral');
    if(action==='resumo'){
      const r = await askZenJSON(`Leia o material anexado ("${meta.name}") e crie um resumo de estudo objetivo, focado no que cai em prova, para a matéria "${subject}". Use tópicos com "-" e **negrito** nos termos-chave. Formato: {"title":"...","content":"..."}`, parts);
      const content = String(r.content||'').trim();
      if(!content) throw Object.assign(new Error('vazio'), {code:'JSON'});
      state.resumos.push({id:uid(), subject, title:String(r.title||'').trim()||meta.name, content, createdAt:Date.now(), fileId:meta.id});
      persist('resumos'); addXP(XP.resumo); registerActivityToday();
      toast('Resumo criado a partir do arquivo! Veja na aba Resumos.','success');
    } else if(action==='flashcards'){
      const r = await askZenJSON(`Com base no material anexado ("${meta.name}"), crie de 6 a 12 flashcards (pergunta curta na frente, resposta objetiva no verso) com os pontos mais importantes. Formato: {"cards":[{"front":"...","back":"..."}]}`, parts);
      const cards = sanitizeCards(r.cards).map(c=> newFlashcard(subject, c.front, c.back));
      if(!cards.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
      state.flashcards.push(...cards); persist('flashcards'); addXP(cards.length*XP.flashcardCriado);
      toast(`${cards.length} flashcards criados a partir do arquivo!`,'success');
    } else if(action==='questoes'){
      const r = await askZenJSON(`Com base no material anexado ("${meta.name}"), crie 6 questões de múltipla escolha no estilo de prova (4 alternativas, só uma correta), com explicação. "correctIndex" é o índice (0 a 3) da correta. Formato: {"questions":[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]}`, parts);
      const qs = sanitizeQuestions(r.questions).map(q=> newQuestion(subject, 'médio', q));
      if(!qs.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
      state.questions.push(...qs); persist('questions');
      toast(`${qs.length} questões adicionadas ao Banco!`,'success');
    }
    checkAchievements();
    resetBusy(btn);
  }catch(err){ explainZenError(err); resetBusy(btn); }
}

// Área que aceita arrastar arquivos e colar imagens
function setupDropzone(el, onFiles){

async function renderFileGrid(){

// Mostra o conteúdo do arquivo (imagem, PDF, vídeo, áudio, texto, Word) dentro de um elemento
async function renderFileInto(meta, holder, big){
  const kind = fileKind(meta);

  else if(kind==='audio') holder.innerHTML = `<audio src="${url}" controls style="width:100%;"></audio>`;
  else if(kind==='text'){ const rec = await FileStore.get(meta.id); holder.innerHTML = `<pre class="preview-text">${escapeHTML((await rec.blob.text()).slice(0,200000))}</pre>`; }

  }
  else holder.innerHTML = `<p class="muted-sm">Sem prévia para esse tipo de arquivo. Use "Baixar" para abrir no computador.</p>`;
}

// Backup: os arquivos vão junto (em base64) e voltam para o IndexedDB ao restaurar
async function backupFilesPayload(){
  const out = [];
  for(const f of state.files){
    const rec = await FileStore.get(f.id).catch(()=>null);
    if(rec) out.push(Object.assign({}, f, {dataURL:`data:${f.type||'application/octet-stream'};base64,${await blobToBase64(rec.blob)}`}));
  }
  return out;
}
async function restoreBackupFiles(files){
  if(!Array.isArray(files) || !files.length) return;
  let ok = 0;
  for(const f of files){
    try{
      const blob = await (await fetch(f.dataURL)).blob();
      const meta = Object.assign({}, f); delete meta.dataURL;
      await FileStore.put(Object.assign(meta, {blob})); ok++;
    }catch(e){ console.error(e); }
  }
  toast(`${ok} ${plural(ok,'arquivo restaurado','arquivos restaurados')} 📎`, 'success');
}

const libPromises = {};
function loadScript(url){
  if(!libPromises[url]) libPromises[url] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url; s.onload = resolve;
    s.onerror = ()=>{ delete libPromises[url]; s.remove(); reject(Object.assign(new Error('Não consegui baixar uma biblioteca (sem internet?)'), {code:'LIB'})); };
    document.head.appendChild(s);
  });
  return libPromises[url];
}

function buildSandboxDoc(src, id){

function parseChartSource(src){
  const t = String(src||'').trim();
  if(t.startsWith('{')){
    const j = JSON.parse(t);
    return {type:j.type||j.tipo||'bar', title:j.title||j.titulo||'', labels:j.labels||j.rotulos||[], values:j.values||j.data||j.valores||[]};
  }
  const out = {type:'bar', title:'', labels:[], values:[]};
  t.split('\n').forEach(line=>{
    const m = line.match(/^\s*([^:]+?)\s*:\s*(.+?)\s*$/);
    if(!m) return;
    const k = m[1].toLowerCase();
    if(k==='tipo' || k==='type') out.type = m[2].toLowerCase();
    else if(k==='título' || k==='titulo' || k==='title') out.title = m[2];
    else { const v = parseFloat(m[2].replace(',','.')); if(!isNaN(v)){ out.labels.push(m[1]); out.values.push(v); } }
  });
  return out;
}

function renderChartVisual(src, holder, big){
  if(typeof Chart==='undefined') throw new Error('a biblioteca de gráficos precisa de internet');
