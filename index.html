const MISSION_XP = 30, MISSION_BONUS = 50;
function toolUses(){ const s = state.stats; return (s.feynman||0)+(s.tutorSolved||0)+(s.aulas||0)+(s.toolUses||0)+state.essays.length; }
function missionMetrics(){
  const t = todayKey(), s = state.stats;
  const today = [];
  state.questions.forEach(q=> (q.history||[]).forEach(h=>{ if(todayKey(new Date(h.date))===t) today.push(h); }));
  today.sort((a,b)=> a.date-b.date);
  let run = 0, best = 0; today.forEach(h=>{ run = h.correct ? run+1 : 0; best = Math.max(best, run); });
  const madeToday = x=> x.createdAt && todayKey(new Date(x.createdAt))===t;
  return {fc:s.flashcardsReviewed||0, qAns:today.length, qSeq:best, mins:Math.round(s.studyLog[t]||0), pomos:s.pomodoroLog[t]||0, quizzes:s.quizzesTaken||0,
    made:state.resumos.filter(madeToday).length + state.notes.filter(madeToday).length + state.mindmaps.filter(madeToday).length,
    tools:toolUses(), review:s.dailyReviewDate===t ? 1 : 0, survival:s.survivalRuns||0};
}
const MISSION_DELTA = ['fc','quizzes','tools','survival'];   // contadores que crescem sempre: conta só o que mudou hoje
function todayMissions(){
  const t = todayKey(), s = state.stats;
  if(!s.missions || s.missions.date!==t){
    let seed = parseInt(quickHash(t+CURRENT_PROFILE.id), 36) || 1;
    const rnd = ()=>{ seed = (seed*9301 + 49297) % 233280; return seed/233280; };
    const pool = MISSION_POOL.filter(m=> !m.need || m.need());
    const ids = [];
    while(ids.length<3 && ids.length<pool.length){ const m = pool[Math.floor(rnd()*pool.length)]; if(!ids.includes(m.id)) ids.push(m.id); }
    s.missions = {date:t, ids, base:missionMetrics(), done:[], bonus:false};
    persist('stats');
  }
  return s.missions;
}
function missionProgress(mi, met){
  const m = MISSION_POOL.find(x=>x.id===mi); if(!m) return null;
  const base = todayMissions().base || {};
  const v = MISSION_DELTA.includes(m.m) ? (met[m.m]||0) - (base[m.m]||0) : (met[m.m]||0);
  return {m, v:Math.max(0, Math.min(m.n, v))};
}
function checkMissions(){
  const ms = todayMissions(), met = missionMetrics();
  let changed = false;
  ms.ids.forEach(id=>{
    const p = missionProgress(id, met);
    if(p && p.v>=p.m.n && !ms.done.includes(id)){ ms.done.push(id); changed = true; addXP(MISSION_XP); toast(`${p.m.icon} Missão cumprida: ${p.m.text}! +${MISSION_XP} XP`, 'success'); }
  });
  if(ms.ids.length && ms.done.length===ms.ids.length && !ms.bonus){ ms.bonus = true; changed = true; addXP(MISSION_BONUS); state.stats.missionDays = (state.stats.missionDays||0)+1; setTimeout(()=> toast(`🏅 Todas as missões de hoje! Bônus de +${MISSION_BONUS} XP`, 'success'), 900); checkAchievements(); }
  if(changed){ persist('stats'); const box = document.getElementById('missions-card'); if(box) box.outerHTML = missionsCardHTML(); }
}
function missionsCardHTML(){
  const ms = todayMissions(), met = missionMetrics();
  return `<div class="card missions-card" id="missions-card"><h3 style="margin-bottom:8px;">🎯 Missões de hoje</h3>
    ${ms.ids.map(id=>{ const p = missionProgress(id, met); if(!p) return ''; const ok = ms.done.includes(id);
      return `<div class="mission ${ok?'ok':''}"><span class="mi-icon">${ok?'✅':p.m.icon}</span><div class="mi-body"><span>${escapeHTML(p.m.text)}</span><div class="progress-bar"><div style="width:${p.v/p.m.n*100}%"></div></div></div><small>${p.v}/${p.m.n}</small></div>`; }).join('')}
    <p class="muted-sm" style="font-size:12px; margin-top:6px;">+${MISSION_XP} XP cada · completando as 3, +${MISSION_BONUS} XP de bônus${state.stats.freezes ? ` · 🧊 ${state.stats.freezes} ${plural(state.stats.freezes,'congelamento')} guardado${state.stats.freezes>1?'s':''}` : ` · 🧊 próximo congelamento em ${FREEZE_XP-(state.stats.freezeXP||0)} XP`}</p></div>`;
}

/* --- 🏆 Ranking semanal da dupla --- */
function rankStatsFrom(stats, questions, startKey){
  const days = Array.from({length:7}, (_,i)=> addDaysKey(startKey, i)), set = new Set(days);
  const xpLog = (stats && stats.xpLog) || {}, studyLog = (stats && stats.studyLog) || {};
  let ok = 0; (questions||[]).forEach(q=> (q.history||[]).forEach(h=>{ if(h.correct && set.has(todayKey(new Date(h.date)))) ok++; }));
  return {xp:Math.round(days.reduce((a,k)=> a+(xpLog[k]||0), 0)), min:Math.round(days.reduce((a,k)=> a+(studyLog[k]||0), 0)), ok, days:days.filter(k=> (studyLog[k]||0)>0 || (xpLog[k]||0)>0).length};
}
function rankPayloadFrom(stats, questions, ts){
  const w = weekStartKey(todayKey()), pw = addDaysKey(w, -7);
  return {w, cur:rankStatsFrom(stats, questions, w), pw, prev:rankStatsFrom(stats, questions, pw), ts};
}
function myRankPayload(){ return rankPayloadFrom(state.stats, state.questions, Date.now()); }
function storeFriendRank(pid, rank){
  if(!rank || !rank.cur) return;
  const all = state.settings.friendRank || {};
  const old = all[pid];
  if(old && JSON.stringify(old.cur)===JSON.stringify(rank.cur) && old.w===rank.w && Date.now()-(old.saved||0) < 600000) return;
  all[pid] = Object.assign({}, rank, {saved:Date.now()});
  state.settings.friendRank = all; persist('settings');
  if(currentView==='dashboard'){ const box = document.getElementById('rank-card'); if(box){ box.outerHTML = rankCardHTML(); } }
}
// Do amigo: se ele usa este mesmo aparelho, lê direto; se não, usa o último placar que chegou pela rede
function friendRank(){
  const f = friendProfile(); if(!f) return null;
  let local = null;
  try{
    const st = JSON.parse(localStorage.getItem(f.prefix+'stats')||'null');
    if(st && st.lastVisitAt) local = rankPayloadFrom(st, JSON.parse(localStorage.getItem(f.prefix+'questions')||'[]'), st.lastVisitAt);
  }catch(e){}
  const net = (state.settings.friendRank||{})[f.id] || null;
  const best = !net ? local : !local ? net : (net.ts||0) > (local.ts||0) ? net : local;
  return best ? Object.assign({f}, best) : null;
}
function friendWeek(fr, weekKey){ return !fr ? null : fr.w===weekKey ? fr.cur : fr.pw===weekKey ? fr.prev : null; }
// Fecha a semana passada: quem fez mais XP leva o troféu 🏆
function settleLastWeek(){
  const fr = friendRank(); if(!fr) return;
  const pw = addDaysKey(weekStartKey(todayKey()), -7);
  const hist = state.stats.rankHistory = state.stats.rankHistory || [];
  if(hist.some(h=> h.week===pw)) return;
  const op = friendWeek(fr, pw); if(!op) return;
  const me = rankStatsFrom(state.stats, state.questions, pw);
  if(!me.xp && !op.xp) return;
  const winner = me.xp>op.xp ? 'me' : me.xp<op.xp ? 'op' : 'draw';
  hist.push({week:pw, me:me.xp, op:op.xp, winner, opp:fr.f.name}); persist('stats');
  if(winner==='me'){ addXP(50); setTimeout(()=> toast(`🏆 Você foi o campeão da semana passada contra o ${fr.f.name} (${me.xp} × ${op.xp} XP)! +50 XP`, 'success'), 1800); checkAchievements(); }
  else if(winner==='op') setTimeout(()=> toast(`O ${fr.f.name} levou a semana passada (${op.xp} × ${me.xp} XP). Essa semana é sua! 💪`), 1800);
}
function rankCardHTML(){
  const fr = friendRank();
  if(!fr){ const f = friendProfile(); return f ? `<div class="card rank-card" id="rank-card"><h3 style="margin-bottom:8px;">🏆 Ranking da semana</h3><p class="muted-sm">Quando o ${escapeHTML(f.avatar)} ${escapeHTML(f.name)} abrir o app (com internet), o placar da semana dele aparece aqui. Quem fizer mais XP até sábado leva o troféu!</p></div>` : ''; }
  const w = weekStartKey(todayKey());
  const me = rankStatsFrom(state.stats, state.questions, w), op = friendWeek(fr, w) || {xp:0, min:0, ok:0, days:0};
  const hist = state.stats.rankHistory || [];
  const myT = hist.filter(h=>h.winner==='me').length, opT = hist.filter(h=>h.winner==='op').length;
  const row = (label, a, b, unit)=> `<div class="rank-row"><b class="${a>b?'lead':''}">${a}${unit||''}</b><span>${label}</span><b class="${b>a?'lead':''}">${b}${unit||''}</b></div>`;
  const ago = fr.ts ? Math.round((Date.now()-fr.ts)/60000) : null;
  return `<div class="card rank-card" id="rank-card"><h3 style="margin-bottom:10px;">🏆 Ranking da semana</h3>
    <div class="rank-head"><span>${me.xp>op.xp?'👑 ':''}${CURRENT_PROFILE.avatar} ${escapeHTML(userName())}</span><span class="muted-sm">×</span><span>${escapeHTML(fr.f.avatar)} ${escapeHTML(fr.f.name)}${op.xp>me.xp?' 👑':''}</span></div>
    ${row('XP', me.xp, op.xp)}${row('minutos', me.min, op.min)}${row('acertos', me.ok, op.ok)}${row('dias', me.days, op.days)}
    <p class="muted-sm" style="font-size:12px; margin-top:8px;">Troféus semanais: ${myT} × ${opT} · quem fizer mais XP até sábado leva 🏆${ago!=null && ago>2 ? ` · placar do ${escapeHTML(fr.f.name)} de ${ago<60?ago+' min':ago<1440?Math.round(ago/60)+' h':Math.round(ago/1440)+' dias'} atrás` : ''}</p></div>`;
}

function startSurvival(subject){

  if(pool.length < 4){ toast('Precisa de pelo menos 4 questões nessa matéria.','error'); return; }

function survivalOrder(pool){ return shuffleArray(pool.slice()).sort((a,b)=> (DIFF_RANK[a.difficulty]??1) - (DIFF_RANK[b.difficulty]??1)); }
function renderSobrevivencia(root){

      ${a!=null ? `<div class="quiz-explain ${a===q.correctIndex?'ok':'bad'}"><strong>${a===q.correctIndex?'Isso! +1 ✅':`Perdeu uma vida 💔 A correta é a ${'ABCDE'[q.correctIndex]}.`}</strong>${q.explanation && a!==q.correctIndex?`<p>${escapeHTML(q.explanation)}</p>`:''}</div>
        <div class="quiz-actions"><button class="btn btn-primary" id="surv-next">${s.lives>0?'Próxima →':'Ver resultado'}</button></div>` : ''}
    </div>`;
  hydrateVisuals(root);
  root.querySelectorAll('[data-o]').forEach(b=> b.addEventListener('click', ()=>{
    if(s.answered!=null) return;
    const choice = +b.dataset.o, ok = choice===q.correctIndex;
    s.answered = choice;
    q.history = q.history||[]; q.history.push({date:Date.now(), correct:ok}); persist('questions');
    if(ok){ s.score++; addXP(XP.questaoCerta); } else s.lives--;
    registerActivityToday();
    renderSobrevivencia(root);
    if(ok) setTimeout(()=>{ if(surv===s && s.answered===choice){ s.answered = null; s.idx++; renderSobrevivencia(root); } }, 1100);
  }));
  const nx = document.getElementById('surv-next'); if(nx) nx.addEventListener('click', ()=>{ s.answered = null; s.idx++; renderSobrevivencia(root); });
  document.getElementById('surv-quit').addEventListener('click', ()=>{ s.lives = 0; s.answered = null; renderSobrevivencia(root); });
  const onKey = e=>{ if(currentView!=='sobrevivencia' || surv!==s){ document.removeEventListener('keydown', onKey); return; } const n = parseInt(e.key,10); if(n>=1 && n<=5 && s.answered==null){ const b = root.querySelector(`[data-o="${n-1}"]`); if(b) b.click(); } };
  document.removeEventListener('keydown', survKeyHandler); survKeyHandler = onKey; document.addEventListener('keydown', onKey);

/* ============================================================
   TORNEIO DE DUELOS, HISTÓRICO E ESTUDO JUNTO (POMODORO)
   ============================================================ */
// Torneio "melhor de 3/5": quem desafia (anfitrião) manda uma partida de cada vez; o placar da série vai junto no convite
let duelSeries = null;
function duelBest(){ const el = document.getElementById('ds-best'); return el ? (parseInt(el.value)||1) : 1; }
function startDuelSeries(cfg, qs){
  if(cfg.best<=1){ duelSeries = null; sendDuelInvite({n:Math.min(cfg.n, qs.length), secs:cfg.secs, label:cfg.label}, qs.slice(0, cfg.n)); return; }
  const f = duelFriend();
  duelSeries = {sid:uid(), best:cfg.best, n:cfg.n, secs:cfg.secs, label:cfg.label, host:true, oppPid:f && f.pid, game:0, w:{me:0, op:0},
    subject: cfg.src==='banco' && cfg.label!=='Todas as matérias' ? cfg.label : '', zenPool: cfg.src==='zen' ? qs : null, used:new Set()};
  nextSeriesGame();
}
function seriesGameQuestions(){
  const S = duelSeries;
  if(S.zenPool){ const start = (S.game-1)*S.n; let qs = S.zenPool.slice(start, start+S.n); if(qs.length<3) qs = shuffleArray(S.zenPool.slice()).slice(0, S.n); return qs; }
  const all = state.questions.filter(q=> !S.subject || q.subject===S.subject);
  const fresh = all.filter(q=> !S.used.has(q.question));
  const pick = shuffleArray((fresh.length>=Math.min(S.n, 3) ? fresh : all).slice()).slice(0, S.n);
  pick.forEach(q=> S.used.add(q.question));
  return pick.map(q=>({question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation||'', subject:q.subject}));
}
function nextSeriesGame(){
  const S = duelSeries; if(!S) return;
  S.game++;
  const qs = seriesGameQuestions();
  sendDuelInvite({n:qs.length, secs:S.secs, label:S.label, series:{sid:S.sid, best:S.best, game:S.game, w:{[CURRENT_PROFILE.id]:S.w.me, [S.oppPid]:S.w.op}}}, qs);
}
// Chamado quando uma partida termina valendo: guarda no histórico e atualiza o torneio
function afterDuelRecorded(result){
  const st = state.stats.duels;
  st.history = st.history || [];
  const ser = duel.settings && duel.settings.series;
  const h = {date:Date.now(), opp:duel.opp.name, oppAvatar:duel.opp.avatar, me:duel.scores.me, op:duel.scores.op, result, label:duel.settings.label||'', game: ser ? `${ser.game}/${ser.best}` : null};
  st.history.push(h);
  if(st.history.length > 60) st.history = st.history.slice(-60);
  if(ser){
    if(!duelSeries || duelSeries.sid!==ser.sid) duelSeries = {sid:ser.sid, best:ser.best, host:false, oppPid:duel.opp.pid};
    duelSeries.game = ser.game;
    duelSeries.w = {me:(ser.w||{})[CURRENT_PROFILE.id]||0, op:(ser.w||{})[duel.opp.pid]||0};
    if(result==='win') duelSeries.w.me++; else if(result==='loss') duelSeries.w.op++;
    const need = Math.ceil(duelSeries.best/2);
    if(duelSeries.w.me>=need || duelSeries.w.op>=need || duelSeries.game>=duelSeries.best+2){   // empates esticam no máximo 2 partidas
      duelSeries.over = true;
      duelSeries.champ = duelSeries.w.me>duelSeries.w.op ? 'me' : duelSeries.w.op>duelSeries.w.me ? 'op' : 'draw';
      st.series = st.series || {played:0, won:0};
      st.series.played++;
      if(duelSeries.champ==='me'){ st.series.won++; addXP(80); }
      h.seriesEnd = duelSeries.champ;
    }
  }
  persist('stats');
}
function renderSeriesBox(result, aborted){
  if(!duel) return;
  const ser = duel.settings && duel.settings.series;
  const end = document.querySelector('.duel-end'); if(!end) return;
  if(!ser){ return; }
  const rm = document.getElementById('du-rematch'); if(rm) rm.remove();
  const actions = end.querySelector('.card-actions');
  if(aborted || !duelSeries || duelSeries.sid!==ser.sid){
    end.insertAdjacentHTML('afterbegin', `<div class="series-box">🏆 Torneio interrompido (melhor de ${ser.best}).</div>`);
    duelSeries = null; return;
  }
  const S = duelSeries, opp = duel.opp;
  const champ = S.over ? (S.champ==='me' ? `👑 ${escapeHTML(userName())} é o campeão do torneio! +80 XP` : S.champ==='op' ? `👑 ${escapeHTML(opp.name)} é o campeão do torneio!` : '🤝 O torneio terminou empatado!') : '';
  end.insertAdjacentHTML('afterbegin', `<div class="series-box ${S.over?'over':''}"><b>🏆 Torneio · melhor de ${S.best}</b><span>Partida ${S.game} · Placar: ${CURRENT_PROFILE.avatar} ${S.w.me} × ${S.w.op} ${opp.avatar}</span>${champ?`<span class="series-champ">${champ}</span>`:''}</div>`);
  if(S.over){
    actions.insertAdjacentHTML('afterbegin', '<button class="btn btn-accent" id="du-newseries">🏆 Novo torneio</button>');
    document.getElementById('du-newseries').addEventListener('click', ()=>{ endDuel(); duelSeries = null; openDuelSetup(); });
    if(S.champ==='me') checkAchievements();
    return;
  }
  if(S.host){
    actions.insertAdjacentHTML('afterbegin', `<button class="btn btn-accent" id="du-next">▶ Partida ${S.game+1}</button>`);
    document.getElementById('du-next').addEventListener('click', ()=>{ const f = duelFriend(); if(!f || !f.online){ toast(`O ${opp.name} saiu. O torneio fica por aqui.`); return; } nextSeriesGame(); });
  } else actions.insertAdjacentHTML('afterbegin', `<p class="muted-sm" style="width:100%; text-align:center;">Esperando o ${escapeHTML(opp.name)} começar a partida ${S.game+1}…</p>`);

let pomoFriend = null, pomoTogether = null, pomoSig = '', pomoSentAt = 0, pomoWasOnline = false;
function pomoStatusPayload(){
  const left = pomodoroState.running ? Math.max(0, Math.ceil((pomodoroState.endsAt-Date.now())/1000)) : pomodoroState.secondsLeft;
  return {running:pomodoroState.running, phase:pomodoroState.phase, left, subject:pomodoroState.subject||''};
}
setInterval(()=>{
  const f = duelFriend();
  const online = !!(f && f.online && liveNet);
  if(online && !pomoWasOnline) pomoSig = '';        // amigo acabou de entrar: manda o estado de novo
  pomoWasOnline = online;
  if(online){
    const p = pomoStatusPayload();
    const sig = JSON.stringify([p.running, p.phase, p.subject]);
    if(sig!==pomoSig || (p.running && Date.now()-pomoSentAt > 30000)){ pomoSig = sig; pomoSentAt = Date.now(); duelSend('pomo-status', {pomo:p}, f.pid); }
  }
  renderPomoFriend();
}, 2000);
function onPomoNet(d){
  if(d.type==='pomo-status'){ pomoFriend = {p:d.pomo||{}, me:d.me, at:Date.now()}; renderPomoFriend(); }
  else if(d.type==='pomo-invite') showPomoInvite(d);
  else if(d.type==='pomo-join'){ pomoTogether = d.me.pid; toast(`${d.me.avatar} ${d.me.name} entrou no seu foco! Estudando juntos 🤝`, 'success'); renderPomoFriend(); }
}
function friendPomoState(){
  if(!pomoFriend || Date.now()-pomoFriend.at > 75000) return null;
  const p = pomoFriend.p, left = p.running ? Math.max(0, p.left - Math.round((Date.now()-pomoFriend.at)/1000)) : p.left;
  return Object.assign({}, p, {left});
}
function renderPomoFriend(){
  const box = document.getElementById('pomo-friend'); if(!box) return;
  const f = duelFriend();
  if(!f){ box.innerHTML = ''; return; }
  const fp = f.online ? friendPomoState() : null;
  const together = pomoTogether===f.pid && pomodoroState.running && fp && fp.running;
  const status = !f.online ? `⚪ ${escapeHTML(f.name)} está offline agora.`
    : !fp ? `🟢 ${escapeHTML(f.name)} está online.`
    : fp.running && fp.phase==='work' ? `🍃 ${escapeHTML(f.name)} está focado${fp.subject?` em ${escapeHTML(fp.subject)}`:''}: ${formatTimer(fp.left)} restantes`
    : fp.running ? `💤 ${escapeHTML(f.name)} está na pausa (${formatTimer(fp.left)})`
    : `🟢 ${escapeHTML(f.name)} está online, mas não está num foco agora.`;
  const html = `<div class="pomo-friend-inner"><span class="duel-av" style="--pc:${escapeHTML(f.color)}">${f.avatar}</span><span>${together ? `🤝 Estudando junto com o ${escapeHTML(f.name)}! ${fp.phase==='work'?'':'(ele está na pausa)'}` : status}</span>
    ${f.online && !together ? `<button class="btn btn-ghost btn-sm" id="pomo-together">🤝 Estudar junto</button>` : ''}</div>`;
  if(box._html===html) return;
  box._html = html; box.innerHTML = html;
  const b = document.getElementById('pomo-together'); if(b) b.addEventListener('click', inviteStudyTogether);
}
function inviteStudyTogether(){
  const f = duelFriend(); if(!f || !f.online){ toast('Seu amigo não está online agora.'); return; }
  if(!pomodoroState.running || pomodoroState.phase!=='work'){
    clearInterval(pomodoroState.timerId);
    pomodoroState.phase = 'work'; pomodoroState.secondsLeft = phaseDuration('work');
    unlockAudio(); startPomodoroTimer(); updatePomoPill();
  }
  duelSend('pomo-invite', {pomo:pomoStatusPayload()}, f.pid);
  pomoTogether = f.pid; pomoSig = '';
  toast(`Convite enviado pro ${f.name}. Quando ele entrar, vocês focam juntos 🤝`, 'success');
  if(currentView==='foco') renderFoco(document.getElementById('view-root'));
}
function showPomoInvite(d){
  const p = d.pomo || {}, mins = Math.max(1, Math.round((p.left||0)/60));
  if(isModalOpen() || (quizSession && !quizSession.finished)){ toast(`${d.me.avatar} ${d.me.name} começou um foco de ${mins} min e te chamou pra estudar junto! Vá em ⏱️ Modo Foco.`); return; }
  openModal(`<div class="duel-invite"><div class="duel-vs big"><span class="duel-av" style="--pc:${escapeHTML(d.me.color||'#2F5F8A')}">${d.me.avatar}</span><b>🤝</b><span class="duel-av" style="--pc:${liveMe().color}">${CURRENT_PROFILE.avatar}</span></div>
    <h3>${escapeHTML(d.me.name)} te chamou pra estudar junto!</h3><p>O foco dele${p.subject?` (${escapeHTML(p.subject)})`:''} termina em ${mins} min. Entrando, o seu timer acompanha o dele.</p>
    <div class="card-actions" style="justify-content:center; margin-top:14px;"><button class="btn btn-accent" id="pj-yes">🍃 Entrar junto</button><button class="btn btn-ghost" id="pj-no">Agora não</button></div></div>`);
  document.getElementById('pj-no').addEventListener('click', closeModal);
  document.getElementById('pj-yes').addEventListener('click', ()=>{

function qVisualHTML(q){ return q && q.visual ? `<div class="q-visual md-content">${renderMarkdown(fixVisualMarkdown(q.visual))}</div>` : ''; }
// A IA às vezes esquece de fechar o bloco ``` ou manda o <svg> solto: arruma pra virar figura de verdade
function fixVisualMarkdown(v){
  v = String(v||'').trim();
  if(!v.includes('\n') && v.includes('\\n')) v = v.replace(/\\n/g, '\n');      // quebras de linha que vieram como texto
  v = v.replace(/^```[ \t]+(\w+)/gm, '```$1');
  if(!v.startsWith('```') && /^<(svg|div|canvas|table|style|html|!doctype)/i.test(v)) v = '```html\n' + v + '\n```';
  if(((v.match(/^```/gm)||[]).length) % 2 === 1) v += '\n```';
  return v;
}
// Figura/código que foi parar dentro do enunciado vai pro campo "visual"
function normalizeQuestionVisual(q){
  let changed = false;
  const qt = String(q.question||'');
  const m = qt.match(/```\w*[\s\S]*?(?:```|$)/) || qt.match(/<svg[\s\S]*?(?:<\/svg>|$)/i);
  if(m){ q.visual = ((q.visual||'') + '\n' + m[0]).trim(); q.question = (qt.slice(0, m.index) + qt.slice(m.index + m[0].length)).trim() || qt.slice(0, 80); changed = true; }
  if(q.visual){ const v = fixVisualMarkdown(q.visual); if(v!==q.visual){ q.visual = v; changed = true; } }
  return changed;
}
(function fixSavedQuestionVisuals(){ let n = 0; state.questions.forEach(q=>{ if(normalizeQuestionVisual(q)) n++; }); if(n) persist('questions'); })();
function cardFaceHTML(text, card){ return card && card.fmt==='md' ? `<div class="md-content">${renderMarkdown(text)}</div>` : `<p>${escapeHTML(text)}</p>`; }
function countToolUse(){ state.stats.toolUses = (state.stats.toolUses||0)+1; persist('stats'); }
function optionsHTML(opts, picked, correct, locked){
  return opts.map((o,i)=>{ let cls = 'quiz-option'; if(locked){ cls += ' disabled'; if(i===correct) cls += ' correct'; } if(picked && picked.includes(i) && i!==correct) cls += ' incorrect disabled'; return `<button class="${cls}" data-o="${i}"><b>${'ABCDE'[i]})</b> ${escapeHTML(o)}</button>`; }).join('');
}

/* --- 📖 Leitura guiada de PDF --- */
let leitura = null;
function renderToolLeitura(root){
  const pdfs = state.files.filter(f=> fileKind(f)==='pdf').slice().reverse();
  root.innerHTML = `${toolHeader('leitura')}<div id="lt-box"></div>`;
  bindToolBack();
  if(leitura && state.files.some(f=>f.id===leitura.fileId)){ renderLeituraReader(); return; }
  document.getElementById('lt-box').innerHTML = `<div class="tool-layout"><div class="card">
      <h4>Escolha o PDF</h4>
      ${pdfs.length ? `<div class="lt-list">${pdfs.map(f=>{ const pr = (state.settings.reading||{})[f.id]; return `<button class="lt-item" data-pdf="${f.id}">📕 <span>${escapeHTML(f.name)}</span>${pr?`<small>parou na pág. ${pr.page}</small>`:''}</button>`; }).join('')}</div>` : '<p class="muted-sm">Nenhum PDF guardado ainda.</p>'}
      <div class="field" style="margin-top:12px;"><label for="lt-file">…ou envie um PDF</label><input class="input" type="file" id="lt-file" accept="application/pdf"></div></div>
    <div class="card tool-hint">${capySVG('happy','',64)}<p>Leia umas páginas, diga até onde foi e o Zen faz 3 perguntas sobre aquela parte. Responder com suas palavras é o que faz a leitura grudar na memória.</p></div></div>`;
  root.querySelectorAll('[data-pdf]').forEach(b=> b.addEventListener('click', ()=> openLeitura(b.dataset.pdf)));
  document.getElementById('lt-file').addEventListener('change', async e=>{ const f = e.target.files[0]; if(!f) return; const [m] = await saveFilesWithToast([f], {source:'leitura'}); if(m) openLeitura(m.id); });
}
function openLeitura(fileId){
  const pr = (state.settings.reading||{})[fileId];
  const from = pr ? pr.page+1 : 1;
  leitura = {fileId, from, to:from+4, qs:null, answers:{}, result:null};
  renderLeituraReader();
}
async function renderLeituraReader(){
  const box = document.getElementById('lt-box'); const L = leitura;
  const meta = state.files.find(f=>f.id===L.fileId); if(!box || !meta) return;
  box.innerHTML = `<div class="reader-layout">
    <div class="reader-pdf"><iframe id="lt-frame" title="${escapeHTML(meta.name)}"></iframe></div>
    <div class="card reader-side">
      <div class="card-actions" style="justify-content:space-between;"><b>📕 ${escapeHTML(meta.name)}</b><button class="btn btn-ghost btn-sm" id="lt-close">Trocar PDF</button></div>
      <div class="field-row" style="margin-top:10px; align-items:flex-end;"><div class="field"><label for="lt-from">Li da página</label><input class="input" type="number" min="1" id="lt-from" value="${L.from}"></div><div class="field"><label for="lt-to">até a</label><input class="input" type="number" min="1" id="lt-to" value="${L.to}"></div></div>
      <button class="btn btn-accent btn-block" id="lt-ask">🦫 Perguntas sobre essas páginas</button>
      <div id="lt-qs"></div>
    </div></div>`;
  const url = await fileURL(meta.id);
  const fr = document.getElementById('lt-frame'); if(fr && url) fr.src = `${url}#page=${L.from}`;
  document.getElementById('lt-close').addEventListener('click', ()=>{ leitura = null; renderToolLeitura(document.getElementById('view-root')); });
  document.getElementById('lt-from').addEventListener('change', e=>{ L.from = Math.max(1, parseInt(e.target.value)||1); if(L.to < L.from){ L.to = L.from; document.getElementById('lt-to').value = L.to; } if(fr && url) fr.src = `${url}#page=${L.from}`; });
  document.getElementById('lt-to').addEventListener('change', e=>{ L.to = Math.max(L.from, parseInt(e.target.value)||L.from); });
  document.getElementById('lt-ask').addEventListener('click', e=> leituraQuestions(meta, e.currentTarget));
  renderLeituraQs();
}
async function leituraQuestions(meta, btn){
  const L = leitura;
  setBusy(btn, 'O Zen está lendo…');
  try{
    const parts = await fileToAIParts(meta);
    const r = await askZenJSON(`Leia as páginas ${L.from} a ${L.to} deste PDF (use a numeração das páginas do arquivo). Faça um resumo curto dessa parte e 3 perguntas abertas de compreensão (uma de lembrar, uma de entender e uma de relacionar/aplicar), cada uma com a resposta esperada.
Formato: {"resumo":"2 a 3 frases","perguntas":[{"pergunta":"...","resposta_esperada":"..."}]}`, parts, {cache:true});
    L.qs = (r.perguntas||[]).map(p=>({q:String(p.pergunta||''), exp:String(p.resposta_esperada||'')})).filter(p=>p.q).slice(0,4);
    L.resumo = String(r.resumo||''); L.answers = {}; L.result = null;
    renderLeituraQs();
  }catch(err){ explainZenError(err); }
  resetBusy(btn);
}
function renderLeituraQs(){
  const box = document.getElementById('lt-qs'); const L = leitura; if(!box || !L.qs) return;
  box.innerHTML = `<p class="muted-sm" style="margin-top:12px;">📌 ${escapeHTML(L.resumo)}</p>
    ${L.qs.map((p,i)=>`<div class="lt-q"><b>${i+1}. ${escapeHTML(p.q)}</b><textarea class="input" rows="3" data-lq="${i}" placeholder="Responda com suas palavras…">${escapeHTML(L.answers[i]||'')}</textarea>
      ${L.result && L.result[i] ? `<div class="quiz-explain ${L.result[i].nota>=6?'ok':'bad'}"><strong>${L.result[i].nota}/10</strong> ${escapeHTML(L.result[i].comentario)}<p class="muted-sm">Esperado: ${escapeHTML(p.exp)}</p></div>` : ''}</div>`).join('')}
    ${L.result ? `<div class="card-actions"><button class="btn btn-primary btn-sm" id="lt-nextpart">📖 Próxima parte (pág. ${L.to+1})</button></div>` : `<button class="btn btn-primary btn-block" id="lt-check">Corrigir minhas respostas</button>`}`;
  box.querySelectorAll('[data-lq]').forEach(t=> t.addEventListener('input', ()=>{ L.answers[t.dataset.lq] = t.value; }));
  const ck = document.getElementById('lt-check'); if(ck) ck.addEventListener('click', e=> leituraCheck(e.currentTarget));
  const nx = document.getElementById('lt-nextpart'); if(nx) nx.addEventListener('click', ()=>{ const span = L.to-L.from; L.from = L.to+1; L.to = L.from+span; L.qs = null; renderLeituraReader(); });
}
async function leituraCheck(btn){
  const L = leitura;
  if(L.qs.some((_,i)=> !(L.answers[i]||'').trim())){ toast('Responda todas as perguntas antes 🦫'); return; }
  setBusy(btn, 'Corrigindo…');
  try{
    const r = await askZenJSON(`Avalie as respostas de um estudante sobre uma leitura. Seja justo e gentil: aceite respostas com as palavras dele se a ideia estiver certa.
${L.qs.map((p,i)=>`Pergunta ${i+1}: ${p.q}\nResposta esperada: ${p.exp}\nResposta do estudante: ${L.answers[i]}`).join('\n\n')}
Formato: {"avaliacoes":[{"nota":8,"comentario":"curto"}]}`);
    L.result = (r.avaliacoes||[]).map(a=>({nota:clamp(Math.round(+a.nota||0),0,10), comentario:String(a.comentario||'')}));
    const reading = state.settings.reading = state.settings.reading || {};
    reading[L.fileId] = {page:L.to, at:Date.now(), sessions:((reading[L.fileId]||{}).sessions||0)+1}; persist('settings');
    addXP(10); countToolUse(); logStudyMinutes(Math.max(5, (L.to-L.from+1)*3)); registerActivityToday(); checkAchievements();
    renderLeituraQs();
  }catch(err){ explainZenError(err); resetBusy(btn); }
}

function renderToolProvaEstilo(root){

async function runProvaEstilo(btn){
  const file = document.getElementById('pe-file').files[0];
  const text = document.getElementById('pe-text').value.trim();
  const subject = document.getElementById('pe-subject').value.trim();
  const topic = document.getElementById('pe-topic').value.trim();
  const n = +document.getElementById('pe-n').value, diff = document.getElementById('pe-diff').value;
  const visual = document.getElementById('pe-visual').checked;
  if(!file && !text && !topic){ toast('Mande uma prova, cole questões ou escreva um tema 🦫'); return; }
  setBusy(btn, 'O Zen está criando…');
  try{
    const parts = await toolFileParts(file, subject);
    const r = await askZenJSON(`${file||text ? `Analise o estilo da prova ${file?'anexada':'abaixo'} (formato dos enunciados, tamanho, número de alternativas, tipo de raciocínio, pegadinhas, assuntos cobrados) e crie ${n} questões NOVAS no mesmo estilo (não copie as originais).` : `Crie ${n} questões de múltipla escolha no estilo de prova escolar/ENEM.`}
${subject?`Matéria: ${subject}. `:''}${topic?`Tema: ${topic}. `:''}Dificuldade: ${diff==='mais'?'um pouco mais difícil que a prova':diff==='menos'?'um pouco mais fácil que a prova':'parecida com a prova'}.
${visual ? `Pelo menos metade das questões deve depender de um VISUAL no campo "visual" (markdown que o app desenha): uma tabela markdown, um gráfico em bloco \`\`\`chart (linhas "Rótulo: valor", e opcionais "tipo: barra|linha|pizza" e "título: ..."), um diagrama \`\`\`mermaid ou uma figura em bloco \`\`\`html com um <svg> simples (geometria, circuitos, mapas esquemáticos). Os dados do visual precisam ser coerentes com a resposta. Nas outras, "visual" fica vazio.` : 'Deixe "visual" vazio.'}
"correctIndex" é o índice da alternativa correta. Explique a resolução em "explanation".
Formato: {"estilo":"uma frase sobre o estilo da prova","materia":"...","questions":[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"...","visual":""}]}
${text ? `\nProva/questões de referência:\n${text.slice(0,20000)}` : ''}`, parts);
    const raw = Array.isArray(r.questions) ? r.questions : [];
    const clean = sanitizeQuestions(raw).map(q=>{ const src = raw.find(x=> x && String(x.question||'').trim()===q.question) || {}; const nq = Object.assign(q, {visual:String(src.visual||'').trim()}); normalizeQuestionVisual(nq); return nq; });
    if(!clean.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
    provaGen = {estilo:String(r.estilo||''), subject:ensureSubject(subject || String(r.materia||'') || 'Geral'), qs:clean, saved:null};
    countToolUse(); registerActivityToday();
    renderProvaEstiloResult();
  }catch(err){ explainZenError(err); }
  resetBusy(btn);
}
function renderProvaEstiloResult(){
  const box = document.getElementById('pe-result'); if(!box || !provaGen) return;
  const g = provaGen;
  box.innerHTML = `<div class="card">
    ${g.estilo ? `<div class="zen-explain" style="margin:0 0 12px;">${capySVG('icon')}<div>${escapeHTML(g.estilo)}</div></div>` : ''}
    ${g.qs.map((q,i)=>`<div class="review-item"><div class="rq"><b>${i+1}.</b> ${escapeHTML(q.question)}</div>${qVisualHTML(q)}
      <ol type="A" class="pe-opts">${q.options.map(o=>`<li>${escapeHTML(o)}</li>`).join('')}</ol>
      <details class="er-answer"><summary>Ver gabarito</summary><div class="ra">✔️ <b>${'ABCDE'[q.correctIndex]})</b> ${escapeHTML(q.options[q.correctIndex])}</div>${q.explanation?`<div class="ra muted-sm">💡 ${escapeHTML(q.explanation)}</div>`:''}</details></div>`).join('')}
    <div class="card-actions" style="margin-top:12px;">
      <button class="btn btn-accent" id="pe-quiz">🎯 Salvar e fazer simulado</button>
      <button class="btn btn-ghost" id="pe-save" ${g.saved?'disabled':''}>${g.saved?'✓ Salvas no banco':`💾 Salvar ${g.qs.length} no banco`}</button>
    </div></div>`;
  hydrateVisuals(box);
  const save = ()=>{
    if(!g.saved){ const qs = g.qs.map(q=>{ const nq = newQuestion(g.subject, 'médio', q); if(q.visual) nq.visual = q.visual; return nq; }); state.questions.push(...qs); persist('questions'); g.saved = qs.map(q=>q.id); checkAchievements(); }
    return g.saved;
  };
  document.getElementById('pe-save').addEventListener('click', e=>{ save(); e.currentTarget.disabled = true; e.currentTarget.textContent = '✓ Salvas no banco'; toast('Questões salvas no Banco 📚', 'success'); });
  document.getElementById('pe-quiz').addEventListener('click', ()=>{ const ids = save(); currentTool = null; switchView('quizzes'); startQuiz({questionIds:ids, count:ids.length, mode:'simulado', timeLimit:Math.max(5, ids.length*3)}); });
}

let clozeGen = null;
function renderToolCloze(root){
  const opts = state.resumos.map(r=>`<option value="r:${r.id}">📝 ${escapeHTML(r.title)}</option>`).concat(state.notes.map(n=>`<option value="n:${n.id}">${escapeHTML(n.icon||'🗒️')} ${escapeHTML(n.title)}</option>`)).join('');
  root.innerHTML = `${toolHeader('cloze')}
    <div class="tool-layout"><div class="card">
      <div class="field"><label for="cz-src">De onde?</label><select class="input" id="cz-src"><option value="">✍️ Colar um texto</option>${opts}</select></div>
      <div class="field" id="cz-text-field"><textarea class="input" id="cz-text" rows="8" placeholder="Cole o texto aqui…"></textarea></div>
      <div class="field-row"><div class="field">${subjectSelectHTML('cz-subject')}</div><div class="field"><select class="input" id="cz-n"><option value="8">8 lacunas</option><option value="12" selected>12 lacunas</option><option value="20">20 lacunas</option></select></div></div>
      <button class="btn btn-accent btn-block" id="cz-go">🧩 Criar lacunas</button></div>
      <div id="cz-result">${clozeGen ? '' : `<div class="card tool-hint">${capySVG('happy','',64)}<p>Lacunas nos termos-chave obrigam o cérebro a lembrar (em vez de só reconhecer). É um dos jeitos mais eficientes de revisar.</p></div>`}</div></div>`;
  bindToolBack();
  document.getElementById('cz-src').addEventListener('change', e=>{
    document.getElementById('cz-text-field').hidden = !!e.target.value;
    const [k, id] = e.target.value.split(':'); const it = k==='r' ? state.resumos.find(x=>x.id===id) : k==='n' ? state.notes.find(x=>x.id===id) : null;
    if(it) document.getElementById('cz-subject').value = it.subject||'';
  });
  document.getElementById('cz-go').addEventListener('click', e=> runCloze(e.currentTarget));
  if(clozeGen) renderClozeResult();
}
async function runCloze(btn){
  const src = document.getElementById('cz-src').value;
  const [k, id] = src.split(':');
  const text = k==='r' ? (state.resumos.find(x=>x.id===id)||{}).content : k==='n' ? htmlToPlain((state.notes.find(x=>x.id===id)||{}).contentHTML) : document.getElementById('cz-text').value;
  const n = +document.getElementById('cz-n').value;
  const subject = document.getElementById('cz-subject').value.trim();
  if(!text || text.trim().split(/\s+/).length < 30){ toast('O texto precisa ter pelo menos umas 30 palavras 🦫'); return; }
  setBusy(btn, 'Criando lacunas…');
  try{
    const r = await askZenJSON(`Crie ${n} flashcards de lacuna (cloze) a partir do texto abaixo. Cada frase deve ser curta, fazer sentido sozinha e ter UMA lacuna "____" no termo-chave mais importante (conceito, nome, data, número). Não repita a mesma lacuna.
Formato: {"cards":[{"frase":"A ____ é responsável pela respiração celular.","resposta":"mitocôndria"}]}
Texto:
${text.slice(0,30000)}`, null, {cache:true, light:true});
    const cards = (r.cards||[]).map(c=>({frase:String(c.frase||'').trim(), resposta:String(c.resposta||'').trim(), on:true})).filter(c=> c.frase.includes('__') && c.resposta);
    if(!cards.length) throw Object.assign(new Error('vazio'), {code:'JSON'});
    clozeGen = {subject:ensureSubject(subject||'Geral'), cards, saved:false};
    countToolUse();
    renderClozeResult();
  }catch(err){ explainZenError(err); }
  resetBusy(btn);
}
function renderClozeResult(){
  const box = document.getElementById('cz-result'); if(!box || !clozeGen) return;
  const g = clozeGen;
  box.innerHTML = `<div class="card"><p class="muted-sm">Desmarque as que não quiser.</p>
    ${g.cards.map((c,i)=>`<label class="cloze-row"><input type="checkbox" data-cz="${i}" ${c.on?'checked':''}><span>${escapeHTML(c.frase).replace(/_{2,}/, `<mark>${escapeHTML(c.resposta)}</mark>`)}</span></label>`).join('')}
    <button class="btn btn-accent" id="cz-save" style="margin-top:10px;" ${g.saved?'disabled':''}>${g.saved?'✓ Flashcards criados':'🗂️ Criar flashcards'}</button></div>`;
  box.querySelectorAll('[data-cz]').forEach(cb=> cb.addEventListener('change', ()=>{ g.cards[+cb.dataset.cz].on = cb.checked; }));
  document.getElementById('cz-save').addEventListener('click', e=>{
    const list = g.cards.filter(c=>c.on).map(c=> newFlashcard(g.subject, c.frase.replace(/_{2,}/, '_____'), `${c.resposta}\n\n(${c.frase.replace(/_{2,}/, c.resposta)})`));
    if(!list.length) return;
    state.flashcards.push(...list); persist('flashcards'); addXP(list.length*XP.flashcardCriado); checkAchievements();
    g.saved = true; e.currentTarget.disabled = true; e.currentTarget.textContent = '✓ Flashcards criados';
    toast(`${list.length} flashcards de lacuna criados 🧩`, 'success');
  });
}

function renderTimelineGame(t, box){
  const G = timelineGame, correct = t.events.map(e=>e.id);
  const byId = id=> t.events.find(e=>e.id===id);
  const hits = G.checked ? G.order.filter((id,i)=> id===correct[i]).length : 0;
  box.innerHTML = `<div class="card"><h3>🎮 Coloque em ordem: ${escapeHTML(t.title)}</h3><p class="muted-sm">Do mais antigo (em cima) pro mais recente. Arraste ou use as setas.</p>
    <div class="tl-game" id="tl-game-list">${G.order.map((id,i)=>{ const ev = byId(id); const ok = G.checked && id===correct[i];
      return `<div class="tl-game-item ${G.checked?(ok?'ok':'bad'):''}" draggable="${!G.checked}" data-i="${i}"><span class="tl-n">${i+1}</span><b>${escapeHTML(ev.title)}</b>${G.checked?`<small>${escapeHTML(ev.date)}</small>`:''}
        ${G.checked ? '' : `<span class="tl-move"><button type="button" data-up="${i}" ${i===0?'disabled':''}>▲</button><button type="button" data-down="${i}" ${i===G.order.length-1?'disabled':''}>▼</button></span>`}</div>`; }).join('')}</div>
    ${G.checked ? `<p style="margin-top:12px;"><b>${hits} de ${correct.length}</b> no lugar certo${hits===correct.length?' 🎉 Perfeito!':''}</p>` : ''}
    <div class="card-actions" style="margin-top:10px;">${G.checked ? '<button class="btn btn-accent" id="tl-again">🔀 Jogar de novo</button>' : '<button class="btn btn-primary" id="tl-check">Conferir</button>'}<button class="btn btn-ghost" id="tl-exit">Ver a linha do tempo</button></div></div>`;
  const move = (from, to)=>{ const [x] = G.order.splice(from, 1); G.order.splice(to, 0, x); renderTimelineGame(t, box); };
  box.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> move(+b.dataset.up, +b.dataset.up-1)));
  box.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> move(+b.dataset.down, +b.dataset.down+1)));
  let dragFrom = null;
  box.querySelectorAll('.tl-game-item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ dragFrom = +el.dataset.i; el.classList.add('dragging'); });
    el.addEventListener('dragover', e=> e.preventDefault());
    el.addEventListener('drop', e=>{ e.preventDefault(); if(dragFrom!=null && dragFrom!==+el.dataset.i) move(dragFrom, +el.dataset.i); });
  });
  const ck = document.getElementById('tl-check'); if(ck) ck.addEventListener('click', ()=>{ G.checked = true; const all = G.order.every((id,i)=> id===correct[i]); if(all){ addXP(10); registerActivityToday(); } countToolUse(); renderTimelineGame(t, box); });
  const ag = document.getElementById('tl-again'); if(ag) ag.addEventListener('click', ()=>{ timelineGame = {order:shuffleArray(correct.slice()), checked:false}; renderTimelineGame(t, box); });
  document.getElementById('tl-exit').addEventListener('click', ()=>{ timelineGame = null; renderTimeline(t); });
}

/* ============================================================
   BOLETIM (notas reais da escola e quanto falta pra passar)
   ============================================================ */
function gradesState(){
  const g = state.grades;
  g.config = Object.assign({media:6, periodos:4, nome:'Bimestre'}, g.config);
  g.entries = Array.isArray(g.entries) ? g.entries : [];
  return g;
}
function parseGrade(v){ const n = parseFloat(String(v==null?'':v).replace(',', '.')); return isFinite(n) ? n : null; }
function fmtGrade(n){ return n==null ? '—' : (Math.round(n*10)/10).toFixed(1).replace('.', ','); }
function periodGrade(subject, p){
  const es = gradesState().entries.filter(e=> e.subject===subject && e.period===p && e.value!=null);
  const w = es.reduce((a,e)=> a+(e.weight||1), 0);
  return w ? es.reduce((a,e)=> a + (e.value/(e.max||10)*10)*(e.weight||1), 0)/w : null;
}
// Quanto precisa tirar nas provas que ainda vão acontecer no período pra fechar com a média
function periodNeed(subject, p){
  const {media} = gradesState().config;
  const all = gradesState().entries.filter(e=> e.subject===subject && e.period===p);
  const fut = all.filter(e=> e.value==null); if(!fut.length) return null;
  const wAll = all.reduce((a,e)=> a+(e.weight||1), 0), wFut = fut.reduce((a,e)=> a+(e.weight||1), 0);
  const have = all.filter(e=> e.value!=null).reduce((a,e)=> a + (e.value/(e.max||10)*10)*(e.weight||1), 0);
  return {need:(media*wAll - have)/wFut, tests:fut};
}
function subjectSummary(subject){
  const {media, periodos} = gradesState().config;
  const per = Array.from({length:periodos}, (_,i)=> periodGrade(subject, i+1));
  const done = per.filter(x=> x!=null);
  const avg = done.length ? done.reduce((a,b)=>a+b,0)/done.length : null;
  const left = periodos - done.length;
  const need = left>0 ? (media*periodos - done.reduce((a,b)=>a+b,0))/left : null;
  let status, cls;
  if(!done.length){ status = 'sem notas ainda'; cls = ''; }
  else if(left===0){ status = avg>=media ? '✅ aprovado' : '⚠️ abaixo da média'; cls = avg>=media ? 'ok' : 'bad'; }
  else if(need<=0){ status = '✅ média já garantida'; cls = 'ok'; }
  else if(need>10){ status = `⚠️ precisaria de ${fmtGrade(need)} (fale com o professor sobre recuperação)`; cls = 'bad'; }
  else { status = `${need>media?'⚠️':'👍'} precisa de ${fmtGrade(need)} de média nos próximos ${left} ${plural(left, gradesState().config.nome.toLowerCase())}`; cls = need>media ? 'warn' : 'ok'; }
  return {per, avg, need, left, status, cls};
}
function gradeSubjects(){ return [...new Set(gradesState().entries.map(e=>e.subject))].sort((a,b)=>a.localeCompare(b)); }
function renderBoletim(root){
  const g = gradesState(), cfg = g.config, subs = gradeSubjects();
  const sums = subs.map(s=> ({s, ...subjectSummary(s)}));
  const risk = sums.filter(x=> x.cls==='bad' || x.cls==='warn');
  root.innerHTML = `
    <div class="view-header"><h2>📒 Boletim</h2><p>Lance as notas reais da escola e veja a média de cada matéria e quanto precisa tirar pra passar.</p></div>
    <div class="card bol-config"><div class="field-row" style="align-items:flex-end;">
      <div class="field"><label for="bol-media">Média pra passar</label><input class="input" id="bol-media" type="text" inputmode="decimal" value="${fmtGrade(cfg.media)}"></div>
      <div class="field"><label for="bol-nome">Ano dividido em</label><select class="input" id="bol-nome">${[['Bimestre',4],['Trimestre',3],['Semestre',2]].map(([n,p])=>`<option value="${n}" data-p="${p}" ${cfg.nome===n?'selected':''}>${p} ${n.toLowerCase()}s</option>`).join('')}</select></div>
      <button class="btn btn-primary" id="bol-add">+ Lançar nota</button></div></div>
    ${subs.length ? `<div class="card" style="margin-top:14px; overflow-x:auto;"><table class="bol-table"><thead><tr><th>Matéria</th>${Array.from({length:cfg.periodos}, (_,i)=>`<th>${i+1}º ${cfg.nome.slice(0,3).toLowerCase()}.</th>`).join('')}<th>Média</th><th>Situação</th></tr></thead><tbody>
      ${sums.map(x=>`<tr><td><b>${escapeHTML(x.s)}</b></td>${x.per.map((v,i)=>{ const pn = periodNeed(x.s, i+1); return `<td><button class="bol-cell ${v==null?'':v>=cfg.media?'ok':'bad'}" data-s="${escapeHTML(x.s)}" data-p="${i+1}">${fmtGrade(v)}${pn?`<small>falta prova</small>`:''}</button></td>`; }).join('')}
        <td><b class="bol-avg ${x.avg==null?'':x.avg>=cfg.media?'ok':'bad'}">${fmtGrade(x.avg)}</b></td><td class="bol-status ${x.cls}">${x.status}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card"><h4>Média por matéria</h4>${sums.filter(x=>x.avg!=null).map(x=>`<div class="bol-bar"><span>${escapeHTML(x.s)}</span><div class="bol-track"><div style="width:${Math.min(100, x.avg*10)}%; background:${x.avg>=cfg.media?'var(--success)':'var(--danger)'}"></div><i style="left:${cfg.media*10}%"></i></div><b>${fmtGrade(x.avg)}</b></div>`).join('') || '<p class="muted-sm">Lance notas pra ver o gráfico.</p>'}</div>
      <div class="card"><h4>Próximas provas que contam</h4>${(()=>{ const rows = []; subs.forEach(s=>{ for(let p=1;p<=cfg.periodos;p++){ const pn = periodNeed(s, p); if(pn) rows.push(`<div class="bol-need ${pn.need>10?'bad':pn.need>cfg.media?'warn':'ok'}"><div><b>${escapeHTML(s)}</b> · ${escapeHTML(pn.tests.map(t=>t.name).join(', '))}</div><span>${pn.need<=0 ? 'já garantiu a média do período ✅' : pn.need>10 ? `precisaria de ${fmtGrade(pn.need)} 😬` : `precisa tirar ${fmtGrade(pn.need)}`}</span></div>`); } }); return rows.join('') || '<p class="muted-sm">Lance uma prova que ainda vai acontecer (marque "ainda não fiz") e eu calculo quanto você precisa tirar nela.</p>'; })()}
        ${risk.length ? `<button class="btn btn-accent btn-sm" id="bol-zen" style="margin-top:10px;">🦫 Pedir um plano pra recuperar ${risk.length===1?escapeHTML(risk[0].s):'essas matérias'}</button>` : ''}</div>
    </div>`
    : `<div style="margin-top:14px;">${emptyState('Nenhuma nota lançada', 'Comece lançando a nota de uma prova ou trabalho. Dá pra marcar provas que ainda vão acontecer pra saber quanto precisa tirar.')}</div>`}`;
  document.getElementById('bol-add').addEventListener('click', ()=> openGradeModal({}));
  document.getElementById('bol-media').addEventListener('change', e=>{ const v = parseGrade(e.target.value); if(v!=null && v>0 && v<=10){ cfg.media = v; persist('grades'); renderBoletim(root); } });
  document.getElementById('bol-nome').addEventListener('change', e=>{ const o = e.target.selectedOptions[0]; cfg.nome = o.value; cfg.periodos = +o.dataset.p; g.entries.forEach(x=>{ if(x.period>cfg.periodos) x.period = cfg.periodos; }); persist('grades'); renderBoletim(root); });
  root.querySelectorAll('.bol-cell').forEach(b=> b.addEventListener('click', ()=> openGradeModal({subject:b.dataset.s, period:+b.dataset.p})));
  const z = document.getElementById('bol-zen');
  if(z) z.addEventListener('click', ()=> startChatWith([], `Meu boletim (média pra passar: ${fmtGrade(cfg.media)}):\n${risk.map(x=>`- ${x.s}: notas ${x.per.map(fmtGrade).join(' / ')} · ${x.status.replace(/[✅⚠️👍]/gu,'').trim()}`).join('\n')}\n\nMonta um plano de estudos pra eu recuperar essas notas, com o que priorizar em cada matéria.`));
}
function openGradeModal(pre){
  const cfg = gradesState().config;
  const list = pre.subject && pre.period ? gradesState().entries.filter(e=> e.subject===pre.subject && e.period===pre.period) : [];
  openModal(`<button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
    <h3>${pre.subject ? `${escapeHTML(pre.subject)} · ${pre.period}º ${cfg.nome.toLowerCase()}` : 'Lançar nota'}</h3>
    ${list.length ? `<div class="bol-entries">${list.map(e=>`<div class="bol-entry"><b>${escapeHTML(e.name)}</b><span>${e.value==null?'⏳ ainda não fez':`${fmtGrade(e.value)} de ${fmtGrade(e.max||10)}`}${(e.weight||1)!==1?` · peso ${fmtGrade(e.weight)}`:''}</span>
      ${e.value==null?`<input class="input" style="max-width:90px;" inputmode="decimal" placeholder="nota" data-fill="${e.id}">`:''}<button class="btn btn-ghost btn-sm" data-del-grade="${e.id}">✕</button></div>`).join('')}</div>` : ''}
    <form id="grade-form">
      <div class="field-row">
        <div class="field"><label for="gr-subject">Matéria</label><input class="input" id="gr-subject" list="subjects-datalist" required value="${escapeHTML(pre.subject||'')}"></div>
        <div class="field" style="max-width:150px;"><label for="gr-period">${cfg.nome}</label><select class="input" id="gr-period">${Array.from({length:cfg.periodos}, (_,i)=>`<option value="${i+1}" ${(pre.period||1)===i+1?'selected':''}>${i+1}º</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:2;"><label for="gr-name">O que foi</label><input class="input" id="gr-name" placeholder="Prova 1, Trabalho, Simulado…" required></div>
        <div class="field"><label for="gr-value">Nota</label><input class="input" id="gr-value" inputmode="decimal" placeholder="7,5"></div>
        <div class="field"><label for="gr-max">Valendo</label><input class="input" id="gr-max" inputmode="decimal" value="10"></div>
        <div class="field"><label for="gr-weight">Peso</label><input class="input" id="gr-weight" inputmode="decimal" value="1"></div>
      </div>
      <label class="check-row"><input type="checkbox" id="gr-future"> ⏳ Ainda não fiz (calcular quanto preciso tirar)</label>
      <button class="btn btn-primary btn-block" type="submit">Salvar</button></form>`);
  const fut = document.getElementById('gr-future'), val = document.getElementById('gr-value');
  fut.addEventListener('change', ()=>{ val.disabled = fut.checked; if(fut.checked) val.value = ''; });
  const reopen = ()=>{ closeModal(); if(currentView==='boletim') renderBoletim(document.getElementById('view-root')); };
  document.querySelectorAll('[data-del-grade]').forEach(b=> b.addEventListener('click', ()=>{ const g = gradesState(); g.entries = g.entries.filter(e=>e.id!==b.dataset.delGrade); persist('grades'); reopen(); openGradeModal(pre); }));
  document.querySelectorAll('[data-fill]').forEach(inp=> inp.addEventListener('change', ()=>{ const e = gradesState().entries.find(x=>x.id===inp.dataset.fill); const v = parseGrade(inp.value); if(e && v!=null){ e.value = v; persist('grades'); registerActivityToday(); reopen(); openGradeModal(pre); } }));
  document.getElementById('grade-form').addEventListener('submit', e=>{
    e.preventDefault();
    const value = fut.checked ? null : parseGrade(val.value), max = parseGrade(document.getElementById('gr-max').value) || 10;
    if(!fut.checked && (value==null || value<0 || value>max)){ toast(`Coloque uma nota entre 0 e ${fmtGrade(max)} (ou marque "ainda não fiz").`, 'error'); return; }
    const subject = ensureSubject(document.getElementById('gr-subject').value.trim());
    const entry = {id:uid(), subject, period:+document.getElementById('gr-period').value, name:document.getElementById('gr-name').value.trim(), value, max, weight:parseGrade(document.getElementById('gr-weight').value) || 1, createdAt:Date.now()};
    gradesState().entries.push(entry); persist('grades');
    if(value!=null){ const pct = value/max*10; toast(pct>=gradesState().config.media ? `Nota lançada: ${fmtGrade(pct)} 🎉` : `Nota lançada. Bora recuperar essa, ${userName()}! 💪`, pct>=gradesState().config.media?'success':'info'); }
    reopen();
  });
}

};

async function summarizeCatalogVideo(v, btn){
  const c = catalogState();
  if(c.summaries[v.id]){ document.getElementById('cv-summary').scrollIntoView({behavior:'smooth'}); return; }
  setBusy(btn, 'Zen assistindo…');
  try{
    const text = await askZen([{role:'user', parts:[{fileData:{fileUri:`https://www.youtube.com/watch?v=${v.id}`}}, {text:`Assista a esta vídeo-aula ("${v.titulo}", matéria ${v.materia}) e faça um resumo de estudo em português: comece com 1 frase dizendo do que se trata, depois os conceitos principais em tópicos com **negrito** nos termos-chave, fórmulas ou datas importantes (se houver) e termine com "O que pode cair na prova". Se ajudar, inclua um diagrama em bloco \`\`\`mermaid.`}]}], {cache:true});
    c.summaries[v.id] = text; persist('catalog');
    const saved = state.videos.find(x=> extractYouTubeId(x.url)===v.id);
    if(saved && !saved.summary){ saved.summary = text; persist('videos'); }
    addXP(XP.resumo); registerActivityToday(); logStudyMinutes(2, ensureSubject(v.materia)); checkAchievements();
    const box = document.getElementById('cv-summary');
    if(box){ box.innerHTML = catalogSummaryHTML(v); bindCatalogSummary(v); }
    btn.innerHTML = '✨ Ver resumo do Zen'; btn.disabled = false; delete btn.dataset.label;
    refreshCatalogBehind();
    toast('Resumo do vídeo pronto! 🎬','success');
    return;
  }catch(err){ explainZenError(err); }
  resetBusy(btn);
}
function saveCatalogVideo(v){
  if(state.videos.some(x=> extractYouTubeId(x.url)===v.id)) return;
  state.videos.push({id:uid(), subject:ensureSubject(v.materia), title:v.titulo, url:`https://www.youtube.com/watch?v=${v.id}`, fileId:null, notes:'', watched:!!catalogState().seen[v.id], summary:catalogState().summaries[v.id]||'', createdAt:Date.now()});
  persist('videos'); addXP(XP.video); checkAchievements();
  toast('Vídeo salvo em Meus vídeos 🎬','success');
}
// Confere se um id de vídeo existe: a miniatura de um vídeo inexistente é a imagem padrão de 120x90
function ytExists(id){
  return new Promise(res=>{ const img = new Image(); img.onload = ()=> res(img.naturalWidth > 120); img.onerror = ()=> res(false); img.src = ytThumb(id); setTimeout(()=> res(false), 8000); });
}
async function ytInfo(id){
  try{ const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v='+id)}&format=json`); if(r.ok){ const j = await r.json(); return {titulo:j.title, canal:j.author_name}; } }catch(e){}
  return null;
}

async function catalogSearchAI(btn){
  const topic = document.getElementById('cs-topic').value.trim(), materia = document.getElementById('cs-subject').value;
  if(!topic){ toast('Escreva o tema 🦫'); return; }
  setBusy(btn, 'Pesquisando…');
  const out = document.getElementById('cs-out');
  try{
    if(!hasGeminiKey()) throw Object.assign(new Error('CHAVE_AUSENTE'), {code:'CHAVE_AUSENTE'});
    const body = {contents:[{role:'user', parts:[{text:`Pesquise no Google vídeo-aulas do YouTube, em português do Brasil, sobre "${topic}" (${materia}), de canais educacionais confiáveis, com 5 a 25 minutos. Liste até 6 vídeos, um por linha, no formato:
https://www.youtube.com/watch?v=ID | título do vídeo | canal
Só inclua links que você encontrou na pesquisa. Não invente IDs.`}]}], tools:[{google_search:{}}]};
    const data = await geminiCall(body);
    const text = candidateText(data);
    const ids = [...new Set((text.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/g)||[]).map(u=> extractYouTubeId(u)).filter(Boolean))];
    const known = new Set(catalogAll().map(v=>v.id));
    const found = [];
    for(const id of ids.filter(i=> !known.has(i)).slice(0,8)){
      if(!(await ytExists(id))) continue;
      const line = text.split('\n').find(l=> l.includes(id)) || '';
      const [, t, ch] = line.split('|').map(s=> (s||'').trim());
      const info = await ytInfo(id);
      found.push({id, materia, tema:topic.slice(0,40), titulo:(info && info.titulo) || t || topic, canal:(info && info.canal) || ch || '', extra:true});
    }
    if(!found.length){ out.innerHTML = '<p class="muted-sm">Não achei vídeos confiáveis dessa vez. Tente escrever o tema de outro jeito.</p>'; resetBusy(btn); return; }
    catalogState().extra.push(...found); persist('catalog');
    catalogSubject = materia; catalogSearch = '';
    closeModal(); renderCatalog(document.getElementById('view-root'));
    toast(`${found.length} ${plural(found.length,'aula nova','aulas novas')} no catálogo 🎬`, 'success');
    return;
  }catch(err){ explainZenError(err); out.innerHTML = ''; }
  resetBusy(btn);
}

// Guarda o quadro ao vivo atual: se a página recarregar (no celular isso acontece ao trocar de app), volta pra ele
function rememberLiveSession(){
  if(!live) return;
  state.settings.liveSession = {share:live.share, boardId:live.boardId, role:live.role, at:Date.now()};
  persist('settings');
}
function forgetLiveSession(){ if(state.settings.liveSession){ state.settings.liveSession = null; persist('settings'); } }
// Abrir um quadro que já foi compartilhado (pela lista) entra ao vivo de novo, sem precisar clicar em nada
function autoRejoinLive(b){
  if(!b || !b.shared || !b.share || b.autoLive===false) return;
  if(live && live.share===b.share) return;
  if(live) return;                                     // está ao vivo em outro quadro: não troca sozinho
  const role = b.id.indexOf('live-')===0 ? 'guest' : 'host';
  beginLive(b.share, b.id, role).then(ok=>{ if(ok) rememberLiveSession(); });
}
function resumeLiveSession(){
  const s = state.settings.liveSession;
  if(!s || live || Date.now()-(s.at||0) > 3*3600000) return;
  const b = state.boards.find(x=>x.id===s.boardId);
  if(!b){ forgetLiveSession(); return; }
  beginLive(s.share, b.id, s.role).then(ok=>{
    if(!ok) return;
    rememberLiveSession();
    if(currentView==='dashboard' && !(quizSession && !quizSession.finished)){ switchView('quadro'); openBoard(b.id); }
    toast('🟢 Você voltou pro quadro ao vivo.', 'success');
  });
}
// No celular, ao sair do app o navegador congela a conexão. Ao voltar, reconecta na hora (e avisa a dupla que voltou)
let netHiddenAt = 0;
function netWake(force){
  if(!liveNet) return;
  if(!force && liveNet.clients.every(c=> c.connected)) return;
  liveNet.clients.forEach(c=>{
    try{
      if(c.connected && !force){ return; }
      if(c.connected) c.end(true, {}, ()=>{ try{ c.reconnect(); }catch(e){} });
      else c.reconnect();
    }catch(e){ console.warn('reconectar', c.brName, e); }
  });
  setTimeout(()=>{ publishWho(); if(live){ rememberLiveSession(); livePublish({type:'hello', resync:true}); } renderLiveNetStatus(); }, 2500);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ netHiddenAt = Date.now(); return; }
  if(netHiddenAt && Date.now()-netHiddenAt > 10000) netWake(true);   // ficou um tempo fora: a conexão pode ter morrido sem avisar
  else netWake(false);
  netHiddenAt = 0;
});
window.addEventListener('online', ()=> netWake(true));
window.addEventListener('pageshow', e=>{ if(e.persisted) netWake(true); });

/* ============================================================
   RASCUNHO DO SIMULADO COMO JANELA (arrastar, mudar o tamanho, lado a lado, tela cheia)
   ============================================================ */
// mode: 'float' (janelinha solta), 'dock' (lado a lado com a questão) ou 'max' (quase a tela toda)
function scratchGeom(){ return state.settings.scratchGeom = Object.assign({mode:'float'}, state.settings.scratchGeom); }
function scratchNarrow(){ return window.matchMedia && matchMedia('(max-width:900px)').matches; }
function applyScratchGeom(){
  const el = document.getElementById('scratch-panel'); if(!el) return;
  const g = scratchGeom();
  el.classList.toggle('docked', g.mode==='dock');
  el.classList.toggle('maxed', g.mode==='max');
  document.body.classList.toggle('scratch-docked', g.mode==='dock' && !el.hidden);
  ['left','top','width','height','right','bottom'].forEach(k=> el.style[k] = '');
  const root = document.documentElement;
  if(g.mode==='dock'){
    if(scratchNarrow()) root.style.setProperty('--scratch-h', clamp(g.dockH || Math.round(innerHeight*0.45), 180, innerHeight-200)+'px');
    else {   // a questão sempre fica com pelo menos ~340px do lado
      const room = innerWidth - (document.querySelector('.main')||document.body).getBoundingClientRect().left;
      root.style.setProperty('--scratch-w', clamp(g.dockW || Math.round(room*0.45), 260, Math.max(260, room-340))+'px');
    }
  } else if(g.mode==='float' && g.w){
    const w = clamp(g.w, 240, innerWidth-16), h = clamp(g.h, 180, innerHeight-16);
    Object.assign(el.style, {width:w+'px', height:h+'px', left:clamp(g.x, 0, innerWidth-w)+'px', top:clamp(g.y, 0, innerHeight-h)+'px', right:'auto', bottom:'auto'});
  }
  const dock = document.getElementById('sp-dock'), max = document.getElementById('sp-max');
  if(dock){ dock.classList.toggle('active', g.mode==='dock'); dock.title = g.mode==='dock' ? 'Voltar a ser janelinha' : 'Lado a lado com a questão'; }
  if(max){ max.textContent = g.mode==='max' ? '⤡' : '⤢'; max.title = g.mode==='max' ? 'Tamanho normal' : 'Aumentar (quase a tela toda)'; }
}
function setScratchMode(mode){ const g = scratchGeom(); g.mode = g.mode===mode ? 'float' : mode; persist('settings'); applyScratchGeom(); }
// Arrastar pela barra de cima e mudar o tamanho pelo cantinho (funciona com mouse, dedo e caneta)
function initScratchWindow(el){
  const head = el.querySelector('.sp-head'), grip = el.querySelector('.sp-resize');
  document.getElementById('sp-dock').addEventListener('click', ()=> setScratchMode('dock'));
  document.getElementById('sp-max').addEventListener('click', ()=> setScratchMode('max'));
  head.addEventListener('dblclick', e=>{ if(!e.target.closest('button')) setScratchMode('max'); });
  const toFloatFromRect = ()=>{ const r = el.getBoundingClientRect(), g = scratchGeom(); Object.assign(g, {mode:'float', x:r.left, y:r.top, w:r.width, h:r.height}); return g; };
  let drag = null;
  head.addEventListener('pointerdown', e=>{
    if(e.target.closest('button') || e.button>0) return;
    const g = scratchGeom();
    if(g.mode==='dock') return;                       // lado a lado fica preso no canto
    const r = el.getBoundingClientRect();
    if(g.mode==='max'){ Object.assign(g, {mode:'float', w:Math.min(r.width, 520), h:Math.min(r.height, 520)}); g.x = e.clientX - g.w/2; g.y = e.clientY - 18; applyScratchGeom(); }
    else toFloatFromRect();
    const now = el.getBoundingClientRect();
    drag = {kind:'move', dx:e.clientX-now.left, dy:e.clientY-now.top};
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  grip.addEventListener('pointerdown', e=>{
    const g = scratchGeom();
    if(g.mode==='max') toFloatFromRect();
    drag = {kind: g.mode==='dock' ? (scratchNarrow() ? 'dockH' : 'dockW') : 'size'};
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); e.stopPropagation();
  });
  const move = e=>{
    if(!drag) return;
    const g = scratchGeom();
    if(drag.kind==='move'){ g.x = e.clientX - drag.dx; g.y = e.clientY - drag.dy; }
    else if(drag.kind==='size'){ const r = el.getBoundingClientRect(); g.w = Math.max(240, e.clientX - r.left); g.h = Math.max(180, e.clientY - r.top); g.x = r.left; g.y = r.top; }
    else if(drag.kind==='dockW') g.dockW = innerWidth - e.clientX;
    else if(drag.kind==='dockH') g.dockH = el.getBoundingClientRect().bottom - e.clientY;
    applyScratchGeom();
  };
  const up = ()=>{ if(drag){ drag = null; persist('settings'); } };
  [head, grip].forEach(t=>{ t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up); });
  window.addEventListener('resize', debounce(()=>{ if(!el.hidden) applyScratchGeom(); }, 150));
}

/* ============================================================

// O timer guarda o horário de término (endsAt), então continua certo mesmo trocando de aba ou de seção
let pomodoroState = { running:false, phase:'work', secondsLeft:0, endsAt:null, timerId:null, subject:'' };
let audioCtx = null;

function phaseDuration(phase){
  const s = state.settings;
  return (phase==='work' ? s.pomodoroWork : phase==='long' ? s.pomodoroLongBreak : s.pomodoroBreak)*60;
}
function phaseLabel(phase){ return phase==='work' ? 'Foco' : phase==='long' ? 'Pausa longa' : 'Pausa'; }
function pomodoroCyclesToday(){ return state.stats.pomodoroLog[todayKey()]||0; }

function renderFoco(root){
  if(!pomodoroState.running && pomodoroState.secondsLeft<=0) pomodoroState.secondsLeft = phaseDuration(pomodoroState.phase);

  const msg = isBreak ? 'Pausa! A capivara tá tirando um cochilo. Levanta, bebe água, estica as pernas. 💧'
    : pomodoroState.running ? 'Foco total. Celular longe, uma coisa de cada vez. 🍃'
    : 'Escolha a matéria (opcional) e aperte começar quando estiver pronto.';
  root.innerHTML = `
    <div class="view-header foco-header">
      <h2>⏱️ Modo Foco</h2>
      <p>Técnica Pomodoro: foque, descanse, repita. A capivara cochila nas pausas, e você também pode.</p>
    </div>
    <div class="pomo-wrap">
      <div class="pomo-subject">
        <select class="input" id="pomo-subject" aria-label="Matéria que você está estudando">
          <option value="">📚 Estudando: escolha a matéria (opcional)</option>
          ${state.subjects.map(s=>`<option value="${escapeHTML(s)}" ${s===pomodoroState.subject?'selected':''}>${escapeHTML(s)}</option>`).join('')}
        </select>
      </div>
      <div class="pomo-circle">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" class="pomo-track"/><circle cx="100" cy="100" r="90" class="pomo-progress ${isBreak?'break':''}" id="pomo-progress-ring"/></svg>
        <div class="pomo-center">
          <div class="pomo-capy">
            ${capySVG(isBreak?'sleep':'icon', isBreak?'capy-breathe':(pomodoroState.running?'mascot-float':''), 56)}
            ${isBreak ? '<span class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></span>' : ''}
          </div>
          <div class="pomo-time" id="pomo-time" role="timer">${formatTimer(pomodoroState.secondsLeft)}</div>
          <div class="pomo-phase">${phaseLabel(pomodoroState.phase)}${isBreak?' · 🦫💤':''}</div>
        </div>
      </div>
      <p class="pomo-msg">${msg}</p>
      <div class="pomo-controls">
        <button class="btn btn-primary" id="pomo-toggle">${pomodoroState.running?'Pausar':(paused?'Continuar':'Começar')}</button>
        ${isBreak ? '<button class="btn btn-ghost" id="pomo-skip">Pular pausa</button>' : ''}
        <button class="btn btn-ghost" id="pomo-reset">Reiniciar</button>
        <button class="btn btn-ghost" id="pomo-zen" title="Esconde os menus e deixa só o timer">${zen?'↩ Sair do modo imersivo':'🧘 Modo imersivo'}</button>
      </div>
      <div id="pomo-friend" class="pomo-friend"></div>
      <p class="muted-sm" style="text-align:center;">${cycles} ${plural(cycles,'ciclo')} ${plural(cycles,'completo')} hoje · ${state.stats.pomodorosDone||0} no total</p>
      <details class="pomo-settings">
        <summary>Ajustar tempos e som</summary>
        <div class="field-row" style="margin-top:10px;">
          <div class="field"><label for="pomo-work-input">Foco (min)</label><input class="input" id="pomo-work-input" type="number" min="5" max="90" value="${state.settings.pomodoroWork}"></div>
          <div class="field"><label for="pomo-break-input">Pausa curta (min)</label><input class="input" id="pomo-break-input" type="number" min="1" max="30" value="${state.settings.pomodoroBreak}"></div>
          <div class="field"><label for="pomo-longbreak-input">Pausa longa (min)</label><input class="input" id="pomo-longbreak-input" type="number" min="5" max="60" value="${state.settings.pomodoroLongBreak}"></div>
        </div>
        <label class="check-row"><input type="checkbox" id="pomo-sound" ${state.settings.soundOn?'checked':''}> 🔔 Tocar um som quando cada fase terminar</label>
        <button class="btn btn-ghost btn-sm" id="pomo-save-settings">Salvar</button>
        <p class="muted-sm" style="margin-top:8px; font-size:12px;">A cada 4 ciclos de foco vem uma pausa longa.</p>
      </details>
    </div>
  `;
  updatePomoRing();
  renderPomoFriend();
  document.getElementById('pomo-subject').addEventListener('change', e=>{ pomodoroState.subject = e.target.value; });
  document.getElementById('pomo-toggle').addEventListener('click', togglePomodoro);
  document.getElementById('pomo-reset').addEventListener('click', resetPomodoro);
  const skip = document.getElementById('pomo-skip');
  if(skip) skip.addEventListener('click', ()=>{ endPomodoroBreak(false); });
  document.getElementById('pomo-zen').addEventListener('click', ()=>{ setZenMode(!document.body.classList.contains('zen-mode')); renderFoco(root); });
  document.getElementById('pomo-save-settings').addEventListener('click', ()=>{
    state.settings.pomodoroWork = clamp(parseInt(document.getElementById('pomo-work-input').value)||25, 5, 90);

    state.settings.pomodoroLongBreak = clamp(parseInt(document.getElementById('pomo-longbreak-input').value)||15, 5, 60);

    persist('settings');
    toast('Configurações salvas!','success');
