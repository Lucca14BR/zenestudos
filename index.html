  });
}
function togglePomodoro(){
  if(pomodoroState.running){
    pomodoroState.secondsLeft = Math.max(0, Math.ceil((pomodoroState.endsAt-Date.now())/1000));
    pomodoroState.running = false;
    clearInterval(pomodoroState.timerId);
  } else {
    unlockAudio();
    startPomodoroTimer();
  }
  updatePomoPill();
  if(currentView==='foco') renderFoco(document.getElementById('view-root'));
}
function startPomodoroTimer(){
  if(pomodoroState.secondsLeft<=0) pomodoroState.secondsLeft = phaseDuration(pomodoroState.phase);
  pomodoroState.endsAt = Date.now() + pomodoroState.secondsLeft*1000;
  pomodoroState.running = true;
  clearInterval(pomodoroState.timerId);
  pomodoroState.timerId = setInterval(pomodoroTick, 500);
}
function resetPomodoro(){
  clearInterval(pomodoroState.timerId);
  pomodoroState.running = false; pomodoroState.phase = 'work';
  pomodoroState.secondsLeft = phaseDuration('work');
  updatePomoPill();
  renderFoco(document.getElementById('view-root'));
}
function pomodoroTick(){
  if(!pomodoroState.running) return;
  pomodoroState.secondsLeft = Math.max(0, Math.ceil((pomodoroState.endsAt-Date.now())/1000));
  if(pomodoroState.secondsLeft<=0){ onPomodoroPhaseEnd(); return; }
  const timeEl = document.getElementById('pomo-time');
  if(timeEl) timeEl.textContent = formatTimer(pomodoroState.secondsLeft);
  updatePomoRing();
  updatePomoPill();
}
function onPomodoroPhaseEnd(){
  if(pomodoroState.phase==='work'){
    const mins = state.settings.pomodoroWork;
    state.stats.pomodorosDone = (state.stats.pomodorosDone||0)+1;
    state.stats.pomodoroLog[todayKey()] = pomodoroCyclesToday()+1;
    persist('stats');
    logStudyMinutes(mins, pomodoroState.subject||null);
    addXP(XP.pomodoro);
    registerActivityToday();
    // depois do foco, a pausa começa sozinha
    pomodoroState.phase = pomodoroCyclesToday()%4===0 ? 'long' : 'break';
    pomodoroState.secondsLeft = phaseDuration(pomodoroState.phase);
    pomodoroState.endsAt = Date.now() + pomodoroState.secondsLeft*1000;
    playChime('break');
    toast(`Ciclo completo! +${XP.pomodoro} XP. Hora da pausa, a capivara vai tirar um cochilo 🦫💤`,'success');
    if(currentView==='foco') renderFoco(document.getElementById('view-root'));
    updatePomoPill();
  } else {
    endPomodoroBreak(true);
  }
}
// Fim da pausa: o próximo foco espera você apertar "Começar" (pra não contar estudo se você saiu)
function endPomodoroBreak(natural){
  clearInterval(pomodoroState.timerId);
  pomodoroState.running = false;
  pomodoroState.phase = 'work';
  pomodoroState.secondsLeft = phaseDuration('work');
  if(natural){ playChime('work'); toast('Pausa acabou! Bora pro próximo ciclo? 🦫','info'); }
  updatePomoPill();
  if(currentView==='foco') renderFoco(document.getElementById('view-root'));
}
function updatePomoRing(){
  const ring = document.getElementById('pomo-progress-ring');
  if(!ring) return;
  const totalSec = phaseDuration(pomodoroState.phase);
  const frac = 1 - (pomodoroState.secondsLeft/totalSec);
  const circumference = 2*Math.PI*90;
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference*(1-Math.min(1,Math.max(0,frac)));
}
// Timer visível no topo (e no título da aba) enquanto você estuda em outras seções
function updatePomoPill(){
  const pill = document.getElementById('topbar-pomo');
  if(!pill) return;
  const active = pomodoroState.running;
  pill.classList.toggle('show', active && currentView!=='foco');
  if(active){
    document.getElementById('topbar-pomo-time').textContent = formatTimer(pomodoroState.secondsLeft);
    pill.firstChild.textContent = pomodoroState.phase==='work' ? '⏱️ ' : '💤 ';
  }
  document.title = active ? `${formatTimer(pomodoroState.secondsLeft)} · ${phaseLabel(pomodoroState.phase)} | Zen Estudos` : 'Zen Estudos';
}
function setZenMode(on){
  if(document.body.classList.contains('zen-mode')===on) return;
  document.body.classList.toggle('zen-mode', on);
  try{
    if(on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  }catch(e){}
}
// Somzinho gerado na hora (sem arquivos externos)
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function playChime(kind){
  if(!state.settings.soundOn || !audioCtx) return;
  try{
    const notes = kind==='break' ? [784, 659, 523] : [523, 659, 784];
    notes.forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + i*0.18;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.6);
    });
  }catch(e){}
}
VIEW_RENDERERS.foco = renderFoco;

/* ============================================================
   BACKUP E DADOS
   ============================================================ */
function openSettingsModal(){
  let used = 0;
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith(STORAGE_PREFIX) && !PROFILES.some(p=> p.prefix!==STORAGE_PREFIX && p.prefix.startsWith(STORAGE_PREFIX) && k.startsWith(p.prefix))) used += (localStorage.getItem(k)||'').length; } }catch(e){}
  openModal(`
    <button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
    <h3>⚙️ Perfil, backup e dados</h3>
    ${profileSettingsHTML()}
    <p class="muted-sm" style="margin-bottom:16px;">Seus dados ficam salvos só neste navegador (${Math.max(1,Math.round(used/1024))} KB). Baixe um backup de vez em quando pra não perder nada, ou pra levar tudo pra outro computador. O backup inclui os arquivos anexados.</p>
    <div class="field"><button class="btn btn-primary btn-block" id="backup-export">⬇️ Baixar backup (.json)</button></div>
    <div class="field"><label for="backup-import">Restaurar um backup</label><input type="file" id="backup-import" class="input" accept="application/json,.json"></div>
    <label class="check-row"><input type="checkbox" id="set-sound" ${state.settings.soundOn?'checked':''}> 🔔 Som ao terminar cada fase do Modo Foco</label>
    <label class="check-row"><input type="checkbox" id="set-fast" ${state.settings.fastMode?'checked':''}> ⚡ Modo rápido do Zen (usa <code>${escapeHTML(GEMINI_FAST_MODEL)}</code>, que responde em segundos)</label>
    <p class="muted-sm">Zen (IA): ${hasGeminiKey() ? `ativo, usando o modelo <code id="set-model">${escapeHTML(activeModel())}</code>` : 'sem chave. Coloque sua chave em <code>GEMINI_API_KEY</code>, no começo do script do index.html.'}</p>
    ${hasGeminiKey() ? `<div class="notice" style="margin-top:12px; display:block;">
      <b>Perguntas de hoje ao ${escapeHTML(GEMINI_MODEL)}:</b> ${aiUsageToday().counts[GEMINI_MODEL]||0} (no plano gratuito o Google limita as perguntas por dia e o limite muda de modelo pra modelo; no gemini-3.8-flash eram ${GEMINI_FREE_DAILY_LIMIT})${mainQuotaBlocked() ? ` · cota esgotada até ~${new Date(state.settings.mainQuotaUntil).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}, usando o modelo rápido` : ''}.<br>
      <span style="font-size:12.5px;">No plano gratuito do Google o ${escapeHTML(GEMINI_MODEL)} fica no fim da fila (por isso demora minutos) e tem poucas perguntas por dia. Com o faturamento (billing) ativado no projeto da chave, em aistudio.google.com, o limite sobe bastante e os pedidos deixam de ser do plano gratuito.</span>
    </div>` : ''}
    ${techSettingsHTML()}
  `);
  document.getElementById('set-fast').addEventListener('change', e=>{ state.settings.fastMode = e.target.checked; persist('settings'); const m = document.getElementById('set-model'); if(m) m.textContent = activeModel(); toast(e.target.checked ? '⚡ Modo rápido ligado' : `Usando ${GEMINI_MODEL} de novo`, 'success'); });
  document.getElementById('backup-export').addEventListener('click', exportBackup);
  document.getElementById('backup-import').addEventListener('change', e=>{ const f = e.target.files && e.target.files[0]; if(f) importBackup(f); });
  document.getElementById('set-sound').addEventListener('change', e=>{ state.settings.soundOn = e.target.checked; persist('settings'); });
  bindProfileSettings();
  bindTechSettings();
}
async function exportBackup(){
  if(state.files.length) toast('Preparando o backup (com os arquivos)… 📦');
  const payload = {app:'zen-estudos', version:3, exportedAt:new Date().toISOString(), data:state, files: await backupFilesPayload()};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zen-estudos-${CURRENT_PROFILE.id}-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Backup baixado! Guarde num lugar seguro. 🦫','success');
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data, parsed;
    try{ parsed = JSON.parse(reader.result); data = parsed && parsed.app==='zen-estudos' && parsed.data; }catch(e){ data = null; }
    if(!data || typeof data!=='object'){ toast('Esse arquivo não parece um backup do Zen Estudos.','error'); return; }
    if(!confirm('Restaurar este backup? Os dados atuais deste navegador serão substituídos.')) return;
    Object.keys(state).forEach(k=>{ if(k in data) state[k] = data[k]; });
    normalizeState();
    Object.keys(state).forEach(k=> persist(k));
    restoreBackupFiles(parsed.files);
    applyTheme(); refreshSubjectsDatalist(); updateStreakUI();
    closeModal();
    switchView('dashboard');
    toast('Backup restaurado! 🦫','success');
  };
  reader.readAsText(file);
}

/* ============================================================
   ATALHOS DE TECLADO
   ============================================================ */
function onGlobalKeydown(e){
  if(e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if(isModalOpen() || document.getElementById('celebrate-overlay')) return;
  const t = e.target;
  if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if(e.key==='Escape' && document.body.classList.contains('wide-mode') && !document.body.classList.contains('zen-mode') && !document.getElementById('lightbox')){
    setWideMode(false);
    if(state.settings.noteFocus){ state.settings.noteFocus = false; persist('settings'); if(currentView==='notas') renderNoteEditor(); }
    if(currentView==='mapas'){ const b = document.getElementById('map-expand-btn'); if(b) b.textContent = '⤢ Expandir'; }
    return;
  }
  if(e.key==='Escape' && document.body.classList.contains('zen-mode')){
    setZenMode(false);
    if(currentView==='foco') renderFoco(document.getElementById('view-root'));
    return;
  }
  const onButton = t && t.tagName==='BUTTON';
  // Revisão de flashcards: espaço/Enter vira o cartão, 1–4 avaliam
  if(document.getElementById('flip-card')){
    if((e.key===' ' || e.key==='Enter') && !onButton){ e.preventDefault(); flipReviewCard(); return; }
    const n = parseInt(e.key, 10);
    if(n>=1 && n<=4 && reviewShowingBack){ e.preventDefault(); rateReviewCard([0,3,4,5][n-1]); }
    return;
  }
  // Quiz: 1–5 marcam a alternativa, Enter confirma/avança
  if(quizSession && !quizSession.finished && document.getElementById('qz-options')){
    const n = parseInt(e.key, 10);
    if(n>=1 && n<=5){
      const b = document.querySelector(`#qz-options .quiz-option[data-i="${n-1}"]`);
      if(b && !b.classList.contains('disabled')){ e.preventDefault(); b.click(); }
      return;
    }
    if(e.key==='Enter' && !onButton){
      const main = document.getElementById('qz-main-btn');
      if(main && !main.disabled){ e.preventDefault(); main.click(); }
    }
  }
}

/* ============================================================
   INIT
   ============================================================ */
const SPLASH_MSGS = [`Preparando tudo pra você, ${userName()}…`,'Afiando os lápis…','Separando os marca-textos…','A capivara está arrumando a mesa de estudos…','Passando um cafezinho…','Alongando os neurônios…'];
function hideSplash(){
  const splash = document.getElementById('splash');
  if(!splash){ checkAchievements(); return; }
  const msg = document.getElementById('splash-msg');
  if(msg) msg.textContent = pick(SPLASH_MSGS);
  setTimeout(()=>{
    splash.classList.add('hide');
    setTimeout(()=>{ splash.remove(); checkAchievements(); }, 480);
  }, 850);
}
function init(){
  normalizeState();
  applyTheme();
  buildNav();
  refreshSubjectsDatalist();
  registerVisit();
  refreshStreak();
  syncModelChange();
  updateProfileUI();
  techInit();
  switchView('dashboard');
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('expand-btn').addEventListener('click', ()=>{ setWideMode(!state.settings.wideMode); if(currentView==='mapas'){ const b = document.getElementById('map-expand-btn'); if(b) b.textContent = state.settings.wideMode ? '⤡ Tamanho normal' : '⤢ Expandir'; } });
  setWideMode(!!state.settings.wideMode);
  document.getElementById('settings-btn').addEventListener('click', openSettingsModal);
  document.getElementById('topbar-pomo').addEventListener('click', ()=> switchView('foco'));
  document.getElementById('profile-btn').addEventListener('click', ()=> showProfilePicker());
  document.addEventListener('keydown', onGlobalKeydown);
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && document.body.classList.contains('zen-mode')){
      setZenMode(false);
      if(currentView==='foco') renderFoco(document.getElementById('view-root'));
    }
  });
  // Evita fechar a aba sem querer no meio de um simulado ou de um ciclo de foco
  window.addEventListener('beforeunload', e=>{
    flushNoteSave();
    if(quizSession && !quizSession.finished) saveQuizProgress('você fechou o app');
    if((quizSession && !quizSession.finished) || pomodoroState.running){ e.preventDefault(); e.returnValue=''; }
  });
  hideSplash();
  setTimeout(maybeAskProfile, 950);   // "Quem vai estudar agora?"
  setTimeout(()=> liveNetStart().then(resumeLiveSession), 2500); // conecta na "sala da dupla" (e volta pro quadro ao vivo, se estava num)
}
init();
