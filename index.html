  const type = {barra:'bar', bar:'bar', linha:'line', line:'line', pizza:'pie', pie:'pie', rosca:'doughnut', doughnut:'doughnut'}[c.type] || 'bar';
  const css = getComputedStyle(document.documentElement), v = n=> css.getPropertyValue(n).trim();
  const palette = [v('--primary'), v('--accent'), v('--info'), v('--success'), v('--danger'), '#B98957', '#8E7CC3', '#5FB3B3'];
  holder.innerHTML = `<div style="position:relative; height:${big?'70vh':'260px'};"><canvas></canvas></div>`;
  new Chart(holder.querySelector('canvas'), {
    type,
    data:{labels:c.labels, datasets:[{label:c.title||'valor', data:c.values, backgroundColor: ['pie','doughnut'].includes(type) ? c.labels.map((x,i)=>palette[i%palette.length]) : palette[0], borderColor:palette[0], borderRadius: type==='bar'?4:0, tension:.3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:['pie','doughnut'].includes(type)}, title:{display:!!c.title, text:c.title}}}
  });
}

// Texto curto de cada material para a busca
function materialIndex(){
  const out = [];
  state.resumos.forEach(r=> out.push({tipo:'resumo', id:r.id, titulo:r.title, materia:r.subject, texto:r.content}));
  state.notes.forEach(n=> out.push({tipo:'anotacao', id:n.id, titulo:n.title, materia:n.subject, texto:htmlToPlain(n.contentHTML)}));
  state.flashcards.forEach(f=> out.push({tipo:'flashcard', id:f.id, titulo:f.front, materia:f.subject, texto:f.back}));
  state.questions.forEach(q=> out.push({tipo:'questao', id:q.id, titulo:q.question, materia:q.subject, texto:q.options.join(' | ')}));
  state.videos.forEach(v=> out.push({tipo:'video', id:v.id, titulo:v.title, materia:v.subject, texto:(v.notes||'')+' '+(v.summary||'')}));
  state.mindmaps.forEach(m=> out.push({tipo:'mapa', id:m.id, titulo:m.title, materia:m.subject, texto:m.nodes.map(n=>n.text).join(', ')}));
  state.files.forEach(f=> out.push({tipo:'arquivo', id:f.id, titulo:f.name, materia:f.subject||'', texto:''}));
  return out;
}
function htmlToPlain(html){ const d = document.createElement('div'); d.innerHTML = sanitizeHTML(html||''); d.querySelectorAll('li,p,h1,h2,h3,div,br').forEach(el=> el.append('\n')); return d.textContent.replace(/\n{3,}/g,'\n\n').trim(); }
async function runZenTool(name, a, actions){
  const act = (icon, text, go)=> actions.push({icon, text, go});
  switch(name){
    case 'buscar_materiais': {
      const q = String(a.consulta||'').toLowerCase().trim();
      const words = q.split(/\s+/).filter(Boolean);
      const hits = materialIndex().filter(m=> (!a.tipo || m.tipo===a.tipo) && words.every(w=> (m.titulo+' '+m.materia+' '+m.texto).toLowerCase().includes(w)));
      return {total:hits.length, resultados:hits.slice(-25).reverse().map(m=>({tipo:m.tipo, id:m.id, titulo:String(m.titulo).slice(0,120), materia:m.materia, trecho:String(m.texto).slice(0,160)}))};
    }
    case 'ler_material': {
      if(a.tipo==='resumo'){ const r = state.resumos.find(x=>x.id===a.id); return r ? {titulo:r.title, materia:r.subject, conteudo:r.content} : {erro:'resumo não encontrado'}; }
      if(a.tipo==='anotacao'){ const n = state.notes.find(x=>x.id===a.id); return n ? {titulo:n.title, materia:n.subject, conteudo:htmlToMarkdown(n.contentHTML).slice(0,40000)} : {erro:'anotação não encontrada'}; }
      if(a.tipo==='video'){ const v = state.videos.find(x=>x.id===a.id); return v ? {titulo:v.title, materia:v.subject, url:v.url||'(arquivo de vídeo enviado)', anotacoes:v.notes||'', resumo_do_video:v.summary||'(ainda não resumido)'} : {erro:'vídeo não encontrado'}; }
      if(a.tipo==='mapa'){ const m = state.mindmaps.find(x=>x.id===a.id); return m ? {tema:m.title, materia:m.subject, nos:m.nodes.map(n=>n.text), ligacoes:m.edges.map(e=>{ const f = m.nodes.find(n=>n.id===e.from), t = m.nodes.find(n=>n.id===e.to); return f&&t ? `${f.text} → ${t.text}` : null; }).filter(Boolean)} : {erro:'mapa não encontrado'}; }
      if(a.tipo==='arquivo'){
        const f = state.files.find(x=>x.id===a.id);
        if(!f) return {erro:'arquivo não encontrado'};
        if(['doc','text'].includes(fileKind(f))){ const parts = await fileToAIParts(f); return {nome:f.name, conteudo:parts.map(p=>p.text||'').join('\n').slice(0,60000)}; }
        return {nome:f.name, tipo:f.type, aviso:'Para eu ver PDFs, imagens, áudios e vídeos, o estudante precisa anexar o arquivo na conversa (📎) ou usar "Perguntar ao Zen" na aba Arquivos.'};
      }
      return {erro:'tipo desconhecido'};
    }
    case 'criar_resumo': {
      const subject = ensureSubject(a.materia||'Geral');
      state.resumos.push({id:uid(), subject, title:String(a.titulo||'Resumo'), content:String(a.conteudo||''), createdAt:Date.now()});
      persist('resumos'); addXP(XP.resumo);
      act('📝', `Resumo "${a.titulo}" criado`, 'resumos');
      return {ok:true};
    }
    case 'criar_anotacao': {
      const note = createNote({subject:ensureSubject(a.materia||'Geral'), title:String(a.titulo||'Anotação do Zen'), icon:a.icone||'🦫', contentHTML:markdownToNoteHTML(a.conteudo||'')});
      act(note.icon, `Anotação "${note.title}" criada`, 'notas:'+note.id);
      return {ok:true, id:note.id};
    }
    case 'adicionar_na_anotacao': {
      const n = state.notes.find(x=>x.id===a.id);
      if(!n) return {erro:'anotação não encontrada'};
      n.contentHTML = (n.contentHTML||'') + markdownToNoteHTML(a.conteudo||''); n.updatedAt = Date.now(); persist('notes');
      act('🗒️', `Conteúdo adicionado em "${n.title}"`, 'notas:'+n.id);
      return {ok:true};
    }
    case 'criar_flashcards': {
      const subject = ensureSubject(a.materia||'Geral');
      const cards = sanitizeCards((a.cards||[]).map(c=>({front:c.frente, back:c.verso}))).map(c=> newFlashcard(subject, c.front, c.back));
      state.flashcards.push(...cards); persist('flashcards'); addXP(cards.length*XP.flashcardCriado);
      act('🗂️', `${cards.length} flashcards em ${subject}`, 'flashcards');
      return {ok:true, criados:cards.length};
    }
    case 'criar_questoes': {
      const subject = ensureSubject(a.materia||'Geral');
      const qs = sanitizeQuestions((a.questoes||[]).map(q=>({question:q.enunciado, options:q.alternativas, correctIndex:q.correta, explanation:q.explicacao}))).map(q=> newQuestion(subject, a.dificuldade||'médio', q));
      state.questions.push(...qs); persist('questions');
      act('📚', `${qs.length} questões no Banco (${subject})`, 'banco');
      return {ok:true, criadas:qs.length};
    }
    case 'criar_mapa_mental': {
      const subject = ensureSubject(a.materia||'Geral');
      const branches = (a.ramos||[]).map(r=>({title:String(r.titulo||'').trim(), children:(r.subtopicos||[]).map(String).filter(Boolean).slice(0,5)})).filter(b=>b.title);
      if(!branches.length) return {erro:'sem ramos'};
      const layout = layoutMindMap(String(a.tema||'Tema'), branches);
      const id = uid();
      state.mindmaps.push({id, subject, title:String(a.tema||'Mapa'), nodes:layout.nodes, edges:layout.edges, createdAt:Date.now()});
      persist('mindmaps'); addXP(XP.mapa);
      act('🧠', `Mapa mental "${a.tema}" criado`, 'mapas:'+id);
      return {ok:true};
    }
    case 'adicionar_evento': {
      if(!/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')) return {erro:'data inválida, use AAAA-MM-DD'};
      const type = EVENT_TYPES[a.tipo] ? a.tipo : 'prova';
      state.events.push({id:uid(), date:a.data, title:String(a.titulo), type, subject:ensureSubject(a.materia||'')});
      persist('events');
      act(EVENT_TYPES[type].icon, `${a.titulo} marcado para ${formatShort(a.data)}`, 'calendario');
      return {ok:true};
    }
    case 'adicionar_meta': {
      const date = /^\d{4}-\d{2}-\d{2}$/.test(a.data||'') ? a.data : todayKey();
      if(a.semanal) addWeekGoal(date, String(a.texto)); else addCalendarGoal(date, String(a.texto));
      act('✅', `Meta ${a.semanal?'da semana':'do dia'}: ${a.texto}`, 'calendario');
      return {ok:true};
    }
    case 'ver_agenda': {
      const t = todayKey();
      return {hoje:t, eventos:upcomingEvents(clamp(parseInt(a.dias)||30,1,365)).map(e=>({data:e.date, titulo:e.title, tipo:e.type, materia:e.subject, faltam_dias:daysBetween(t,e.date)})),
        metas_hoje:((state.calendar[t]||{}).goals||[]).map(g=>({texto:g.text, feita:g.done})),
        metas_semana:weekGoals(t).map(g=>({texto:g.text, feita:g.done})), flashcards_pendentes:dueFlashcards().length};
    }
    case 'ver_desempenho': {
      const totalMin = Object.values(state.stats.studyLog||{}).reduce((x,y)=>x+y,0);
      return {sequencia_dias:state.stats.streak||0, recorde:state.stats.bestStreak||0, minutos_totais:Math.round(totalMin), nivel:levelInfo(state.stats.totalXP||0).level,
        acerto_por_materia:subjectAccuracy().map(m=>({materia:m.subject, questoes_pct:m.qPct, questoes_respondidas:m.qt, flashcards_pct:m.fPct})),
        pontos_fracos:getWeakSubjects(), simulados_recentes:state.quizAttempts.slice(-5).map(x=>({data:new Date(x.date).toLocaleDateString('pt-BR'), materia:x.subject, acertos:`${x.score}/${x.total}`}))};
    }
    case 'salvar_video': {
      const url = safeUrl(a.url);
      if(!url) return {erro:'link inválido'};
      state.videos.push({id:uid(), subject:ensureSubject(a.materia||'Geral'), title:String(a.titulo||'Vídeo'), url, notes:'', watched:false, createdAt:Date.now()});
      persist('videos');
      act('🎬', `Vídeo "${a.titulo}" salvo`, 'videos');
      return {ok:true};
    }
  }
  if(ZEN_EXTRA_TOOLS[name]) return ZEN_EXTRA_TOOLS[name](a, act);
  return {erro:'ferramenta desconhecida'};
}
// Conversa com ferramentas: repete enquanto a IA pedir ferramentas (no máximo 6 rodadas)
async function askZenAgent(messages){
  const contents = buildContents(messages);
  const body = {contents, systemInstruction:{parts:[{text:zenSystemPrompt()}]}, tools:[{functionDeclarations:ZEN_TOOLS}]};
  const actions = [];
  let model = null;   // depois da 1ª resposta, segue com o mesmo modelo (as rodadas de ferramenta dependem disso)
  for(let step=0; step<6; step++){
    const data = await geminiCall(body, model);
    model = data.__model;
    const content = data && data.candidates && data.candidates[0] && data.candidates[0].content;
    const calls = ((content && content.parts) || []).filter(p=>p.functionCall);
    if(!calls.length){
      try{ return {text:candidateText(data), actions, model}; }
      catch(e){ if(actions.length) return {text:'Prontinho! ✅', actions, model}; throw e; }
    }
    contents.push(content);   // devolve a resposta original (com as "assinaturas" de raciocínio que o Gemini exige)
    const responses = [];
    for(const p of calls){
      let result;
      try{ result = await runZenTool(p.functionCall.name, p.functionCall.args||{}, actions); }
      catch(e){ console.error(e); result = {erro:String(e.message||e)}; }
      const fr = {name:p.functionCall.name, response:result};
      if(p.functionCall.id) fr.id = p.functionCall.id;
      responses.push({functionResponse:fr});
    }
    contents.push({role:'user', parts:responses});
  }
  checkAchievements();
  return {text:'Fiz tudo que deu por aqui! 🦫', actions};
}

  const c = bCanvas;

function setBoardTool(t){ bTool = t; document.querySelectorAll('[data-tool]').forEach(b=> b.classList.toggle('active', b.dataset.tool===t)); if(bCanvas) bCanvas.style.cursor = t==='hand' ? 'grab' : t==='text' ? 'text' : 'crosshair'; }
function setBoardColor(c){ bColor = c; document.querySelectorAll('.bt-color').forEach(b=> b.classList.toggle('active', b.dataset.color===c)); const inp = document.getElementById('qb-color'); if(inp) inp.value = c; if(bTool==='eraser' || bTool==='hand') setBoardTool('pen'); }
function setBoardMeta(m){
  const oldInk = paperOf().ink;
  Object.assign(board, m); saveBoardSoon(); liveSendBoard(Object.assign({type:'meta'}, m));
  if(m.paper && bColor===oldInk) setBoardColor(paperOf().ink);
  scheduleBoardRender();
}
function resizeBoardCanvas(){
  if(!bCanvas) return;
  const wrap = bCanvas.parentElement, dpr = window.devicePixelRatio||1;
  bCanvas.width = Math.max(1, Math.round(wrap.clientWidth*dpr)); bCanvas.height = Math.max(1, Math.round(wrap.clientHeight*dpr));
  bCanvas.style.width = wrap.clientWidth+'px'; bCanvas.style.height = wrap.clientHeight+'px';
  scheduleBoardRender();
}
function boardPoint(e){ const r = bCanvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/bv.s + bv.x, y:(e.clientY-r.top)/bv.s + bv.y, sx:e.clientX-r.left, sy:e.clientY-r.top}; }
function zoomBoard(f, at){
  const r = bCanvas.getBoundingClientRect();
  at = at || {sx:r.width/2, sy:r.height/2, x:r.width/2/bv.s + bv.x, y:r.height/2/bv.s + bv.y};
  const ns = clamp(bv.s*f, 0.15, 6);
  bv = {s:ns, x:at.x - at.sx/ns, y:at.y - at.sy/ns};
  scheduleBoardRender();
}
function strokeBounds(s){
  if(s.t==='text'){ const fs = 12 + s.w*3, lines = String(s.s||'').split('\n'); const w = Math.max(...lines.map(l=>l.length))*fs*0.6; return {x0:s.p[0], y0:s.p[1], x1:s.p[0]+w, y1:s.p[1]+lines.length*fs*1.25}; }
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for(let i=0;i<s.p.length;i+=2){ x0=Math.min(x0,s.p[i]); x1=Math.max(x1,s.p[i]); y0=Math.min(y0,s.p[i+1]); y1=Math.max(y1,s.p[i+1]); }
  const pad = (s.t==='hl' ? s.w*3 : s.w)/2;
  return {x0:x0-pad, y0:y0-pad, x1:x1+pad, y1:y1+pad};
}
function boardBounds(strokes){
  strokes = strokes || board.strokes;
  if(!strokes.length) return null;
  return strokes.map(strokeBounds).reduce((a,b)=>({x0:Math.min(a.x0,b.x0), y0:Math.min(a.y0,b.y0), x1:Math.max(a.x1,b.x1), y1:Math.max(a.y1,b.y1)}));
}
function fitBoard(){
  const bb = boardBounds(); const r = bCanvas.getBoundingClientRect();
  if(!bb || !r.width){ bv = {x:-40, y:-40, s:1}; return; }
  const s = clamp(Math.min((r.width-60)/Math.max(1,bb.x1-bb.x0), (r.height-60)/Math.max(1,bb.y1-bb.y0)), 0.15, 2);
  bv = {s, x:(bb.x0+bb.x1)/2 - r.width/2/s, y:(bb.y0+bb.y1)/2 - r.height/2/s};
}
/* --- desenho --- */
function onBoardDown(e){
  if(!board || (e.button!==undefined && e.button>1)) return;
  const p = boardPoint(e);
  try{ bCanvas.setPointerCapture(e.pointerId); }catch(err){}
  if(bTool==='hand' || bSpace || e.button===1){ bPan = {sx:e.clientX, sy:e.clientY, x:bv.x, y:bv.y}; bCanvas.style.cursor = 'grabbing'; return; }
  if(bTool==='text'){
    const text = prompt('Texto para colocar no quadro:');
    if(text && text.trim()) commitStrokes([{id:uid(), t:'text', c:bColor, w:bSize, p:[Math.round(p.x), Math.round(p.y)], s:text.trim(), by:CURRENT_PROFILE.id}]);
    return;
  }
  if(bTool==='eraser'){ bErasing = []; eraseAt(p); return; }
  bDrawing = {id:uid(), t:bTool, c:bColor, w:bSize, p:[Math.round(p.x), Math.round(p.y)], by:CURRENT_PROFILE.id};
  if(bTool!=='pen' && bTool!=='hl') bDrawing.p.push(Math.round(p.x), Math.round(p.y));
  scheduleBoardRender();
}
const sendCursorThrottled = throttle(p=> liveSendBoard({type:'cursor', x:Math.round(p.x), y:Math.round(p.y)}), 70);
const sendProgressThrottled = throttle(()=>{ if(bDrawing) liveSendBoard({type:'progress', stroke:bDrawing}); }, 60);
function onBoardMove(e){
  if(!board) return;
  const p = boardPoint(e);
  if(live) sendCursorThrottled(p);
  if(bPan){ bv.x = bPan.x - (e.clientX-bPan.sx)/bv.s; bv.y = bPan.y - (e.clientY-bPan.sy)/bv.s; scheduleBoardRender(); return; }
  if(bErasing){ eraseAt(p); return; }
  if(!bDrawing) return;
  const x = Math.round(p.x), y = Math.round(p.y), pts = bDrawing.p;
  if(bDrawing.t==='pen' || bDrawing.t==='hl'){
    const lx = pts[pts.length-2], ly = pts[pts.length-1];
    if(Math.hypot(x-lx, y-ly) < 1.5/bv.s) return;
    pts.push(x, y);
  } else { pts[2] = x; pts[3] = y; }
  sendProgressThrottled();
  scheduleBoardRender();
}
function onBoardUp(){
  if(bPan){ bPan = null; setBoardTool(bTool); return; }
  if(bErasing){
    if(bErasing.length){ bUndo.push({type:'remove', strokes:bErasing}); bRedo = []; saveBoardSoon(); }
    bErasing = null; return;
  }
  if(!bDrawing) return;
  const s = bDrawing; bDrawing = null;
  const bb = strokeBounds(s);
  const tiny = s.t!=='pen' && s.t!=='hl' && (bb.x1-bb.x0) < 3 && (bb.y1-bb.y0) < 3;
  if(!tiny) commitStrokes([s]); else { liveSendBoard({type:'remove', ids:[s.id]}); scheduleBoardRender(); }
}
function commitStrokes(list){

function distToSeg(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1, l = dx*dx+dy*dy;
  const t = l ? clamp(((px-x1)*dx + (py-y1)*dy)/l, 0, 1) : 0;
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function hitStroke(s, x, y, tol){
  const bb = strokeBounds(s);
  if(x < bb.x0-tol || x > bb.x1+tol || y < bb.y0-tol || y > bb.y1+tol) return false;
  if(s.t==='text' || s.t==='rect' || s.t==='ellipse') return true;
  const w = (s.t==='hl' ? s.w*3 : s.w)/2 + tol;
  if(s.p.length===2) return Math.hypot(x-s.p[0], y-s.p[1]) <= w;
  for(let i=0;i<s.p.length-2;i+=2) if(distToSeg(x, y, s.p[i], s.p[i+1], s.p[i+2], s.p[i+3]) <= w) return true;

}
function eraseAt(p){

  const ids = new Set(hit.map(s=>s.id));
  boardTomb(board, [...ids]); board.strokes = board.strokes.filter(s=> !ids.has(s.id));

function boardUndo(){

function boardRedo(){

function applyBoardOp(op, reverse){

    const ids = new Set(op.strokes.map(s=>s.id));

    liveSendBoard({type:'remove', ids:[...ids]});
  } else {
    board.strokes.push(...op.strokes); boardUntomb(board, op.strokes.map(s=>s.id));

function drawBoardPattern(ctx, b, x0, y0, x1, y1, s){
  const pat = b.pattern || 'plain'; if(pat==='plain') return;
  const dark = b.paper!=='branco';
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = dark ? 'rgba(255,255,255,.10)' : 'rgba(28,43,38,.10)';
  ctx.lineWidth = 1/s;
  const step = 32;
  if(pat==='dots'){ for(let x=Math.floor(x0/step)*step; x<x1; x+=step) for(let y=Math.floor(y0/step)*step; y<y1; y+=step){ ctx.beginPath(); ctx.arc(x, y, 1.6/s, 0, Math.PI*2); ctx.fill(); } }
  else {
    ctx.beginPath();
    if(pat==='grid') for(let x=Math.floor(x0/step)*step; x<x1; x+=step){ ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for(let y=Math.floor(y0/step)*step; y<y1; y+=step){ ctx.moveTo(x0, y); ctx.lineTo(x1, y); }

  }
  ctx.restore();
}
function drawStroke(ctx, s){
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = s.t==='hl' ? s.w*3 : s.w;
  if(s.t==='hl') ctx.globalAlpha = 0.35;
  const p = s.p;
  if(s.t==='pen' || s.t==='hl'){
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    if(p.length===2){ ctx.lineTo(p[0]+0.01, p[1]); }
    else{
      for(let i=2;i<p.length-2;i+=2){ const mx = (p[i]+p[i+2])/2, my = (p[i+1]+p[i+3])/2; ctx.quadraticCurveTo(p[i], p[i+1], mx, my); }
      ctx.lineTo(p[p.length-2], p[p.length-1]);
    }
    ctx.stroke();
  } else if(s.t==='line' || s.t==='arrow'){
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.stroke();
    if(s.t==='arrow'){
      const a = Math.atan2(p[3]-p[1], p[2]-p[0]), h = Math.max(12, s.w*3.5);
      ctx.beginPath(); ctx.moveTo(p[2], p[3]); ctx.lineTo(p[2]-h*Math.cos(a-0.45), p[3]-h*Math.sin(a-0.45));
      ctx.moveTo(p[2], p[3]); ctx.lineTo(p[2]-h*Math.cos(a+0.45), p[3]-h*Math.sin(a+0.45)); ctx.stroke();
    }
  } else if(s.t==='rect'){
    ctx.strokeRect(Math.min(p[0],p[2]), Math.min(p[1],p[3]), Math.abs(p[2]-p[0]), Math.abs(p[3]-p[1]));
  } else if(s.t==='ellipse'){
    ctx.beginPath(); ctx.ellipse((p[0]+p[2])/2, (p[1]+p[3])/2, Math.abs(p[2]-p[0])/2||0.5, Math.abs(p[3]-p[1])/2||0.5, 0, 0, Math.PI*2); ctx.stroke();
  } else if(s.t==='text'){
    const fs = 12 + s.w*3; ctx.font = `600 ${fs}px Sora, sans-serif`; ctx.textBaseline = 'top';
    String(s.s||'').split('\n').forEach((l,i)=> ctx.fillText(l, p[0], p[1] + i*fs*1.25));
  }
  ctx.restore();
}
function renderBoard(){
  bRaf = 0;
  if(!bCanvas || !board || !bCanvas.isConnected) return;
  const ctx = bCtx, dpr = window.devicePixelRatio||1, W = bCanvas.width, H = bCanvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = paperOf().color; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(dpr*bv.s, 0, 0, dpr*bv.s, -bv.x*bv.s*dpr, -bv.y*bv.s*dpr);
  drawBoardPattern(ctx, board, bv.x, bv.y, bv.x + W/dpr/bv.s, bv.y + H/dpr/bv.s, bv.s);
  board.strokes.forEach(s=> drawStroke(ctx, s));
  if(live && live.boardId===board.id) Object.values(remoteProgress).forEach(s=> drawStroke(ctx, s));

      ctx.font = '600 12px Sora, sans-serif'; const label = `${c.avatar||''} ${c.name||''}`.trim(); const tw = ctx.measureText(label).width;

// Desenha o quadro inteiro (ou um pedaço vazio) num canvas separado
function boardToCanvas(b, maxSide){
  const bb = boardBounds(b.strokes) || {x0:0, y0:0, x1:600, y1:400};
  const pad = 30, w = bb.x1-bb.x0+pad*2, h = bb.y1-bb.y0+pad*2;
  const scale = Math.min(2, maxSide/Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*scale)); c.height = Math.max(1, Math.round(h*scale));
  const ctx = c.getContext('2d');
  ctx.fillStyle = paperOf(b).color; ctx.fillRect(0, 0, c.width, c.height);
  ctx.setTransform(scale, 0, 0, scale, (pad-bb.x0)*scale, (pad-bb.y0)*scale);
  b.strokes.forEach(s=> drawStroke(ctx, s));
  return c;
}

const LIVE_VERSION = 3;                                // as duas cópias do app precisam ser da mesma versão
const SALA_DA_DUPLA = 'rfpy5fn84ex3x7rr';              // mesma nas duas cópias do arquivo (não mude só numa)

const LIVE_NS = 'zenestudos/v3';
const LIVE_CHUNK = 60000;

let liveFriends = {};        // quem da dupla está online e em qual quadro

function liveMe(){ return {pid:CURRENT_PROFILE.id, name:userName(), avatar:CURRENT_PROFILE.avatar, color:profilePalette(CURRENT_PROFILE).light.primary}; }
function liveShareId(){ const a = 'ABCDFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:6}, ()=> a[Math.floor(Math.random()*a.length)]).join(''); }

/* --- rede: 3 servidores ao mesmo tempo, mensagens repetidas são ignoradas --- */
async function liveNetStart(){
  if(liveNet) return liveNet;
  try{ await loadScript(MQTT_LIB); }catch(e){ return null; }
  if(liveNet) return liveNet;
  liveNet = {clients:[], subs:new Set([`${LIVE_NS}/${SALA_DA_DUPLA}/who/+`, duelInbox(CURRENT_PROFILE.id)]), seen:new Map(), src:'s_'+uid()};
  LIVE_BROKERS.forEach(br=>{
    let c;
    try{
      c = window.mqtt.connect(br.url, {clientId:'zen_'+uid(), clean:true, connectTimeout:12000, reconnectPeriod:4000, keepalive:45,
        will:{topic:whoTopic(CURRENT_PROFILE.id), payload:'', qos:1, retain:true}});   // se cair, o servidor avisa a dupla
    }catch(e){ console.warn('servidor', br.name, e); return; }
    c.brName = br.name;
    c.on('connect', ()=>{
      c.everConnected = true;
      liveNet.subs.forEach(t=> c.subscribe(t, {qos:1}));
      publishWho();
      if(live) setTimeout(()=> live && livePublish({type:'hello', resync:true}), 400);
      renderLiveNetStatus();
    });
    c.on('close', renderLiveNetStatus);
    c.on('offline', renderLiveNetStatus);
    c.on('error', err=> console.warn('servidor', br.name, err && err.message));
    c.on('message', onNetMessage);
    liveNet.clients.push(c);
  });
  clearInterval(liveNet.whoTimer);
  liveNet.whoTimer = setInterval(()=>{ publishWho(); pruneFriends(); }, 25000);
  return liveNet;
}
function liveOnlineCount(){ return liveNet ? liveNet.clients.filter(c=>c.connected).length : 0; }
function netSubscribe(t){ if(!liveNet) return; liveNet.subs.add(t); liveNet.clients.forEach(c=>{ if(c.connected) c.subscribe(t, {qos:1}); }); }
function netUnsubscribe(t){ if(!liveNet) return; liveNet.subs.delete(t); liveNet.clients.forEach(c=>{ if(c.connected) c.unsubscribe(t); }); }
function netPublish(topic, payload, opts){ if(!liveNet) return 0; let n = 0; liveNet.clients.forEach(c=>{ if(c.connected){ try{ c.publish(topic, payload, Object.assign({qos:1}, opts)); n++; }catch(e){} } }); return n; }
function publishWho(){
  if(!liveNet) return;
  const b = liveBoard();
  netPublish(whoTopic(CURRENT_PROFILE.id), JSON.stringify({v:LIVE_VERSION, me:liveMe(), board: live && b ? {share:live.share, title:b.title} : null, rank:myRankPayload(), ts:Date.now()}), {retain:true});
}
function onNetMessage(topic, payload){
  const s = payload.toString();
  if(topic.indexOf('/who/') > 0){
    const pid = topic.split('/').pop();
    if(pid===CURRENT_PROFILE.id) return;
    let info = null; try{ info = s ? JSON.parse(s) : null; }catch(e){}
    const before = liveFriends[pid];
    if(!info){ delete liveFriends[pid]; }
    else {
      liveFriends[pid] = Object.assign(info, {seen:Date.now()});
      if(info.rank) storeFriendRank(pid, info.rank);   // placar da semana pro ranking da dupla
      if(info.board && (!before || !before.board || before.board.share!==info.board.share) && Date.now()-info.ts < 180000 && !(live && live.share===info.board.share))
        toast(`${info.me.avatar} ${info.me.name} abriu o quadro "${info.board.title}" ao vivo! Vá em 🎨 Quadro branco e clique em Entrar.`, 'success');
    }
    renderLobby(); renderDuelCard();
    return;
  }
  if(!s) return;
  let d; try{ d = JSON.parse(s); }catch(e){ return; }
  if(!d || !d.mid || liveNet.seen.has(d.mid)) return;           // a mesma mensagem chega por até 3 servidores
  liveNet.seen.set(d.mid, Date.now());
  if(liveNet.seen.size > 4000){ const cut = Date.now()-120000; liveNet.seen.forEach((t,k)=>{ if(t<cut) liveNet.seen.delete(k); }); }
  if(topic.indexOf('/sync/') > 0){ if(d.src!==liveNet.src) onSyncMessage(d); return; }   // sincronizar aparelhos
  if(topic.indexOf('/duel/') > 0){ if(d.src!==liveNet.src) onDuelMessage(d); return; }   // desafios de duelo
  if(d.src===liveNet.src || !live || d.share!==live.share) return;
  if(d.v!==LIVE_VERSION){ if(!live.warnedVersion){ live.warnedVersion = true; toast('O app do seu amigo está numa versão diferente. Usem o mesmo index.html (o mais novo) nos dois computadores.','error'); } return; }
  onLiveData(d);
}
function pruneFriends(){ const cut = Date.now()-180000; Object.keys(liveFriends).forEach(k=>{ if((liveFriends[k].ts||0) < cut && (liveFriends[k].seen||0) < cut) delete liveFriends[k]; }); renderLobby(); renderDuelCard(); }
function livePublish(msg){
  if(!live) return 0;

}
function liveSend(msg){
  if(!live) return;
  if(msg.type==='set'){ livePublish({type:'clear'}); (msg.strokes||[]).forEach(s=> livePublish({type:'add', stroke:s})); return; }
  livePublish(msg);
}

/* --- sincronização: quando alguém chega (ou volta a conexão), cada um manda o quadro que tem e os dois juntam --- */
function sendBoardState(to){
  const b = liveBoard(); if(!b) return;
  const meta = {title:b.title, pattern:b.pattern, paper:b.paper, tomb:(b.tomb||[]).slice(-3000)};
  const parts = []; let cur = [], size = 0;
  b.strokes.forEach(s=>{ const n = JSON.stringify(s).length; if(size + n > LIVE_CHUNK && cur.length){ parts.push(cur); cur = []; size = 0; } cur.push(s); size += n; });
  parts.push(cur);
  const id = uid();
  parts.forEach((strokes, i)=> livePublish({type:'state', to, sid:id, part:i, parts:parts.length, board:Object.assign({strokes}, i===0 ? meta : {})}));
}
function mergeBoardState(d){
  live.stateParts = live.stateParts || {};
  const sp = live.stateParts[d.sid] = live.stateParts[d.sid] || {got:{}, n:d.parts};
  sp.got[d.part] = d.board;
  if(Object.keys(sp.got).length < sp.n) return;
  delete live.stateParts[d.sid];
  const pieces = Object.keys(sp.got).sort((a,b)=>a-b).map(k=> sp.got[k]);
  const meta = pieces[0], incoming = [].concat(...pieces.map(p=> p.strokes||[]));
  const b = liveBoard(); if(!b) return;
  const tomb = new Set((b.tomb||[]).concat(meta.tomb||[]));
  const map = new Map();
  b.strokes.concat(incoming).forEach(s=>{ if(!tomb.has(s.id)) map.set(s.id, s); });
  b.tomb = Array.from(tomb).slice(-3000);
  b.strokes = Array.from(map.values());
  if(live.role==='guest' && !live.gotState){ if(meta.title && /^Quadro ao vivo /.test(b.title)) b.title = `${meta.title} (com ${d.me.name})`; if(meta.paper) b.paper = meta.paper; if(meta.pattern) b.pattern = meta.pattern; }
  const first = !live.gotState; live.gotState = true;
  b.updatedAt = Date.now(); persist('boards');
  if(board===b){ scheduleBoardRender(); const t = document.getElementById('qb-title'); if(t && document.activeElement!==t) t.value = b.title; }
  if(first && live.role==='guest'){ toast(`Conectado ao quadro de ${d.me.name}! Tudo que um desenha o outro vê. 🎨`, 'success'); registerActivityToday(); }
  renderLivePanel();
}
function onLiveData(d){
  if(d.me && d.src) live.partners[d.src] = Object.assign({}, d.me, {seen:Date.now()});
  const b = liveBoard();
  switch(d.type){
    case 'hello':
      if(!d.resync) toast(`${d.me.avatar} ${d.me.name} entrou no quadro! 👥`, 'success');
      sendBoardState(d.src);
      if(!d.reply) livePublish({type:'hello', reply:true, resync:true});    // pede o quadro dele também
      renderLivePanel(); break;
    case 'state': if(!d.to || d.to===liveNet.src) mergeBoardState(d); break;
    case 'add': if(b && d.stroke){ boardUntomb(b, [d.stroke.id]); b.strokes = b.strokes.filter(s=>s.id!==d.stroke.id); b.strokes.push(d.stroke); delete remoteProgress[d.stroke.id]; liveStored(b); } break;
    case 'remove': if(b){ const ids = new Set(d.ids||[]); boardTomb(b, [...ids]); b.strokes = b.strokes.filter(s=>!ids.has(s.id)); ids.forEach(i=> delete remoteProgress[i]); liveStored(b); } break;
    case 'clear': if(b){ boardTomb(b, b.strokes.map(s=>s.id)); b.strokes = []; remoteProgress = {}; liveStored(b); } break;
    case 'meta': if(b){ ['title','pattern','paper'].forEach(k=>{ if(d[k]) b[k] = d[k]; }); liveStored(b); if(board===b){ const t = document.getElementById('qb-title'); if(t && d.title && document.activeElement!==t) t.value = d.title; } } break;
    case 'progress': if(d.stroke){ remoteProgress[d.stroke.id] = d.stroke; scheduleBoardRender(); } break;
    case 'cursor': remoteCursors[d.src] = {x:d.x, y:d.y, name:d.me && d.me.name, avatar:d.me && d.me.avatar, color:d.me && d.me.color, ts:Date.now()}; scheduleBoardRender(); break;
    case 'chat': live.chat.push({me:d.me, text:String(d.text||'').slice(0,500), ts:Date.now()}); renderLiveChat(true); liveChatNotify(d); break;
    case 'bye': delete live.partners[d.src]; delete remoteCursors[d.src]; if(d.me) toast(`${d.me.avatar} ${d.me.name} saiu do quadro.`); renderLivePanel(); scheduleBoardRender(); break;
  }
}

// Usa a mesma "sala da dupla" do quadro ao vivo. Quem desafia (anfitrião) manda as questões e comanda as rodadas;

let duel = null;
const DUEL_REACTIONS = ['👏','🔥','😅','🤯','😎','🦫'];
function duelInbox(pid){ return `${LIVE_NS}/${SALA_DA_DUPLA}/duel/${pid}`; }
function duelFriend(){
  const f = friendProfile(); if(!f) return null;
  const info = liveFriends[f.id];
  return {pid:f.id, name:(info && info.me && info.me.name) || f.name, avatar:(info && info.me && info.me.avatar) || f.avatar, color:(info && info.me && info.me.color) || profilePalette(f).light.primary,
    online: !!(info && Date.now()-(info.ts||0) < 180000), oldVersion: !!(info && info.v!==LIVE_VERSION)};
}
function duelSend(type, extra, toPid){
  if(!liveNet) return 0;
  const to = toPid || (duel && duel.opp.pid);
  if(!to) return 0;
  const msg = Object.assign({type, v:LIVE_VERSION, mid:uid(), src:liveNet.src, me:liveMe(), did:duel ? duel.did : null}, extra||{});
  return netPublish(duelInbox(to), JSON.stringify(msg), {qos:1});
}
function duelPoints(a, q, secs){ return a && a.choice===q.correctIndex ? 100 + Math.round(50*Math.max(0, 1 - a.ms/(secs*1000))) : 0; }

      resetBusy(btn);
      if(qs.length < 3){ toast('O Zen não conseguiu criar questões suficientes. Tenta de novo?','error'); return; }
      label = topic;
    }
    const best = duelBest();
    closeModal();
    startDuelSeries({n, secs, label, best, src}, qs);
  });
}

/* --- convite --- */

/* --- rodadas --- */
function duelTimer(fn, ms){ const t = setTimeout(fn, ms); if(duel) duel.timers.push(t); return t; }
function clearDuelTimers(){ if(duel){ (duel.timers||[]).forEach(clearTimeout); duel.timers = []; clearInterval(duel.tick); } }
function duelCountdown(then){
  duel.phase = 'countdown';
  let n = 3;
  const step = ()=>{
    if(!duel) return;
    renderDuelBody(`<div class="duel-count">${n>0 ? n : 'Valendo! ⚡'}</div>`);
    if(n-- > 0) duelTimer(step, 850); else duelTimer(then, 650);
  };
  step();
}
function hostNextQuestion(i){
  if(!duel) return;
  if(i >= duel.qs.length){ hostEnd(); return; }
  duelSend('q', {i});
  showDuelQuestion(i);
  duelTimer(()=> hostReveal(i), duel.secs*1000 + 1500);
}
function showDuelQuestion(i){
  if(!duel) return;
  clearInterval(duel.tick);
  duel.i = i; duel.phase = 'q'; duel.qStart = Date.now();
  const q = duel.qs[i];
  renderDuelBody(`
    <div class="duel-qhead"><span class="badge badge-primary">${escapeHTML(q.subject||'')}</span><span>Questão ${i+1} de ${duel.qs.length}</span><span class="duel-secs" id="du-secs">${duel.secs}s</span></div>
    <div class="duel-timebar"><div id="du-bar"></div></div>
    <p class="duel-question">${escapeHTML(q.question)}</p>
    <div class="duel-opts">${q.options.map((o,oi)=>`<button class="quiz-option duel-opt" data-o="${oi}"><b>${'ABCDE'[oi]})</b> ${escapeHTML(o)}</button>`).join('')}</div>
    <p class="muted-sm duel-status" id="du-status"></p>`);
  document.querySelectorAll('.duel-opt').forEach(b=> b.addEventListener('click', ()=> duelAnswer(+b.dataset.o)));
  renderDuelStatus();
  duel.tick = setInterval(()=>{
    if(!duel || duel.phase!=='q' || duel.i!==i){ clearInterval(duel && duel.tick); return; }
    const left = Math.max(0, duel.secs*1000 - (Date.now()-duel.qStart));
    const bar = document.getElementById('du-bar'), sec = document.getElementById('du-secs');
    if(bar) bar.style.width = (left/(duel.secs*1000)*100)+'%';
    if(sec){ sec.textContent = Math.ceil(left/1000)+'s'; sec.classList.toggle('hurry', left<5000); }
    if(left<=0 && !duel.my[i]){ duelAnswer(null); }
  }, 100);
}
function duelAnswer(choice){
  if(!duel || duel.phase!=='q' || duel.my[duel.i]) return;
  const i = duel.i;
  duel.my[i] = {choice, ms:Math.min(duel.secs*1000, Date.now()-duel.qStart)};
  duelSend('ans', {i, choice, ms:duel.my[i].ms});
  document.querySelectorAll('.duel-opt').forEach(b=>{ b.classList.add('disabled'); b.classList.toggle('selected', +b.dataset.o===choice); });
  renderDuelStatus();
  if(duel.role==='host' && duel.op[i]) hostReveal(i);
}
function renderDuelStatus(){
  const el = document.getElementById('du-status'); if(!el || !duel) return;
  const i = duel.i, mine = duel.my[i], theirs = duel.op[i];
  el.innerHTML = `${mine ? (mine.choice==null ? '⏰ Tempo esgotado!' : '✅ Resposta enviada!') : 'Escolha uma alternativa…'} · ${theirs ? `${duel.opp.avatar} ${escapeHTML(duel.opp.name)} já respondeu` : `${duel.opp.avatar} ${escapeHTML(duel.opp.name)} está pensando…`}`;
}
function hostReveal(i){
  if(!duel || duel.revealed[i]) return;
  duel.revealed[i] = true;
  const q = duel.qs[i], me = duel.my[i] || {choice:null, ms:duel.secs*1000}, op = duel.op[i] || {choice:null, ms:duel.secs*1000};
  const pm = duelPoints(me, q, duel.secs), po = duelPoints(op, q, duel.secs);
  duel.scores.me += pm; duel.scores.op += po;
  const picks = {[CURRENT_PROFILE.id]:{choice:me.choice, pts:pm}, [duel.opp.pid]:{choice:op.choice, pts:po}};
  const scores = {[CURRENT_PROFILE.id]:duel.scores.me, [duel.opp.pid]:duel.scores.op};
  duelSend('reveal', {i, picks, scores});
  showDuelReveal(i, picks);
  duelTimer(()=> hostNextQuestion(i+1), 3600);
}
function applyDuelReveal(d){
  duel.revealed[d.i] = true;
  duel.scores = {me:d.scores[CURRENT_PROFILE.id]||0, op:d.scores[duel.opp.pid]||0};
  showDuelReveal(d.i, d.picks);
}
function showDuelReveal(i, picks){
  clearInterval(duel.tick);
  duel.phase = 'reveal';
  duel.history = duel.history || {};
  duel.history[i] = picks;
  const q = duel.qs[i];
  const mine = picks[CURRENT_PROFILE.id] || {}, theirs = picks[duel.opp.pid] || {};
  const line = (who, av, p)=> `<div class="duel-pick ${p.pts?'ok':'bad'}">${av} <b>${escapeHTML(who)}</b>: ${p.choice==null ? 'não respondeu' : `${'ABCDE'[p.choice]}) ${p.pts?'✅':'❌'}`} <span class="duel-pts">${p.pts?'+'+p.pts:'+0'}</span></div>`;
  document.querySelectorAll('.duel-opt').forEach(b=>{ const o = +b.dataset.o; b.classList.add('disabled'); if(o===q.correctIndex) b.classList.add('correct'); else if(o===mine.choice) b.classList.add('incorrect'); });
  const st = document.getElementById('du-status');
  if(st) st.outerHTML = `<div class="duel-reveal">${line(userName(), CURRENT_PROFILE.avatar, mine)}${line(duel.opp.name, duel.opp.avatar, theirs)}${q.explanation?`<p class="muted-sm" style="margin:6px 0 0;">💡 ${escapeHTML(q.explanation)}</p>`:''}</div>`;
  updateDuelScores();
}
function hostEnd(){ duelSend('end', {scores:{[CURRENT_PROFILE.id]:duel.scores.me, [duel.opp.pid]:duel.scores.op}}); showDuelEnd(false); }

/* --- fim --- */
function showDuelEnd(aborted){
  if(!duel) return;
  clearDuelTimers();
  const wasPlaying = duel.phase!=='invite' && duel.phase!=='accepted';
  duel.phase = 'end';
  const me = duel.scores.me, op = duel.scores.op;
  const result = aborted ? 'aborted' : me>op ? 'win' : me<op ? 'loss' : 'draw';
  if(!aborted && !duel.recorded){
    duel.recorded = true;
    const st = state.stats.duels = state.stats.duels || {played:0, wins:0, losses:0, draws:0};
    st.played++; if(result==='win') st.wins++; else if(result==='loss') st.losses++; else st.draws++;
    persist('stats');
    addXP(result==='win' ? 40 : result==='draw' ? 25 : 15);
    logStudyMinutes(Math.max(1, Math.round(duel.qs.length*duel.secs/60)));
    registerActivityToday();
    afterDuelRecorded(result);
  }
  if(aborted && !wasPlaying){ endDuel(); return; }
  const title = result==='win' ? `Você venceu, ${escapeHTML(userName())}! 🏆` : result==='loss' ? `${escapeHTML(duel.opp.name)} venceu dessa vez 💪` : result==='draw' ? 'Empate! 🤝' : 'Duelo interrompido';
  const answered = Object.keys(duel.history||{}).length;
  const myHits = Object.values(duel.history||{}).filter(p=> (p[CURRENT_PROFILE.id]||{}).pts).length;
  const opHits = Object.values(duel.history||{}).filter(p=> (p[duel.opp.pid]||{}).pts).length;
  const notInBank = duel.qs.filter(q=> !state.questions.some(x=> x.question===q.question)).length;
  renderDuelBody(`<div class="duel-end">
    ${capySVG(result==='win'||result==='draw'?'happy':'icon', 'mascot-float', 84)}
    <h2>${title}</h2>
    <div class="duel-final"><div><span>${CURRENT_PROFILE.avatar} ${escapeHTML(userName())}</span><b>${me}</b><small>${myHits}/${answered} acertos</small></div><div class="vs">×</div><div><span>${duel.opp.avatar} ${escapeHTML(duel.opp.name)}</span><b>${op}</b><small>${opHits}/${answered} acertos</small></div></div>
    ${aborted ? '<p class="muted-sm">O duelo parou no meio (alguém saiu ou a conexão caiu), então não valeu pro placar.</p>' : `<p class="muted-sm">+${result==='win'?40:result==='draw'?25:15} XP pela partida</p>`}
    <div class="card-actions" style="justify-content:center; margin-top:12px;">
      ${duelFriend() && duelFriend().online ? '<button class="btn btn-accent" id="du-rematch">🔁 Revanche</button>' : ''}
      ${notInBank ? `<button class="btn btn-ghost" id="du-save">💾 Salvar as ${notInBank} questões no meu banco</button>` : ''}
      <button class="btn btn-ghost" id="du-close">Fechar</button>
    </div></div>`);
  updateDuelScores();
  const rm = document.getElementById('du-rematch');
  if(rm) rm.addEventListener('click', ()=>{ const s = duel.settings, qs = shuffleArray(duel.qs.slice()); sendDuelInvite(s, qs); });
  const sv = document.getElementById('du-save');
  if(sv) sv.addEventListener('click', ()=>{
    const add = duel.qs.filter(q=> !state.questions.some(x=> x.question===q.question)).map(q=> newQuestion(ensureSubject(q.subject||'Geral'), 'médio', q));
    state.questions.push(...add); persist('questions'); sv.disabled = true; sv.textContent = '✓ Salvas no banco'; checkAchievements();
  });
  document.getElementById('du-close').addEventListener('click', endDuel);
  renderSeriesBox(result, aborted);
  checkAchievements();
  renderDuelCard();
}
function endDuel(){
  clearDuelTimers();
  duel = null;
  const o = document.getElementById('duel-overlay'); if(o) o.remove();
  renderDuelCard();
}

function updateDuelScores(){

  if(a) a.textContent = duel.scores.me; if(b) b.textContent = duel.scores.op;

function showDuelReaction(emoji, from){
  const el = document.getElementById(from ? 'du-bubble-op' : 'du-bubble-me');

}

/* --- mensagens da rede --- */
function onDuelMessage(d){
  if(!d || d.v!==LIVE_VERSION || !d.me) return;
  if(d.type==='invite'){
    if(duel && duel.phase!=='end'){ duelSend('decline', {did:d.did, reason:'já estava num duelo'}, d.me.pid); return; }
    if(quizSession && !quizSession.finished){ duelSend('decline', {did:d.did, reason:'estava fazendo uma prova'}, d.me.pid); toast(`${d.me.avatar} ${d.me.name} te desafiou pra um duelo, mas você está numa prova. Depois desafia ele de volta!`); return; }
    if(duel) endDuel();
    showDuelInvite(d); return;
  }
  if(String(d.type).indexOf('pomo-')===0){ onPomoNet(d); return; }   // estudo junto (Modo Foco)
  if(!duel || d.did!==duel.did) return;
  duel.lastSeen = Date.now();
  switch(d.type){
    case 'accept':
      if(duel.role==='host' && duel.phase==='invite'){ clearDuelTimers(); duelSend('start'); duelCountdown(()=> hostNextQuestion(0)); }
      break;
    case 'decline': toast(`${duel.opp.name} não quis duelar agora${d.reason?` (${d.reason})`:''}.`); endDuel(); break;
    case 'start': if(duel.role==='guest'){ clearDuelTimers(); duelCountdown(()=>{}); } break;
    case 'q': if(duel.role==='guest') showDuelQuestion(d.i); break;
    case 'ans':
      duel.op[d.i] = {choice:d.choice, ms:d.ms};
      if(duel.i===d.i && duel.phase==='q') renderDuelStatus();
      if(duel.role==='host' && duel.my[d.i]) hostReveal(d.i);
      break;
    case 'reveal': if(duel.role==='guest') applyDuelReveal(d); break;
    case 'end':
      if(duel.role==='guest'){ duel.scores = {me:d.scores[CURRENT_PROFILE.id]||0, op:d.scores[duel.opp.pid]||0}; showDuelEnd(false); }
      break;
    case 'react': showDuelReaction(d.emoji, d.me); break;
    case 'quit': toast(`${duel.opp.name} saiu do duelo.`); showDuelEnd(true); break;
  }
}

// Ditado por voz reaproveitável (português)
function setupDictation(btn, target){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.disabled = true; btn.title = 'Seu navegador não tem reconhecimento de voz'; return; }
  let rec = null;
  btn.addEventListener('click', ()=>{
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = e=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) target.value = (target.value.trim()+' '+e.results[i][0].transcript).trim(); };
    rec.onend = ()=>{ rec = null; btn.textContent = '🎤 Falar em vez de digitar'; btn.classList.remove('listening'); };
    rec.onerror = ()=>{ if(rec) rec.stop(); };
    rec.start(); btn.textContent = '⏹️ Parar de gravar'; btn.classList.add('listening');
  });
}

async function checkTutorAnswer(btn){
  const t = tutor; const answer = document.getElementById('tt-answer').value.trim();
  if(!answer) return;
  setBusy(btn, '…');
  try{
    const r = await askZenJSON(`Exercício: ${t.enunciado}\nResposta correta: ${t.resposta}\nResposta do estudante: ${answer}\nA resposta do estudante está correta (aceite formas equivalentes, arredondamentos razoáveis e unidades equivalentes)? Se estiver errada, NÃO revele a resposta certa: diga só onde provavelmente está o erro. Formato: {"correta":true,"feedback":"..."}`);
    const ok = !!r.correta;
    t.checks.push({answer, ok, feedback:String(r.feedback||'')});
    if(ok){ t.solved = true; addXP(15); logStudyMinutes(5, t.subject); celebrateSmall(); checkAchievements(); state.stats.tutorSolved = (state.stats.tutorSolved||0)+1; persist('stats'); }
    renderTutorBox();
  }catch(err){ explainZenError(err); resetBusy(btn); }
}
function celebrateSmall(){ toast('Mandou bem! Resolveu com as próprias pernas 🦫🎉', 'success'); }

async function buildStudyPlan(btn){
  const goal = document.getElementById('pl-goal').value.trim();
  const date = document.getElementById('pl-date').value;
  const mins = +document.getElementById('pl-hours').value;
  const subjects = document.getElementById('pl-subjects').value.trim();
  const dows = [...document.querySelectorAll('#pl-days .chip.active')].map(c=>+c.dataset.dow);
  const t = todayKey();
  if(!goal || !subjects){ toast('Diga o objetivo e as matérias/conteúdos 🦫'); return; }
  if(!date || daysBetween(t, date) < 1){ toast('Escolha uma data a partir de amanhã.','error'); return; }
  if(!dows.length){ toast('Escolha pelo menos um dia livre.','error'); return; }
  const total = daysBetween(t, date);
  const weekly = total > 42;
  const studyDays = []; for(let i=0;i<total;i++){ const k = addDaysKey(t,i); if(dows.includes(keyToDate(k).getDay())) studyDays.push(k); }
  const weekStarts = [...new Set(studyDays.map(weekStartKey))];
  const weak = getWeakSubjects().slice(0,4).map(w=>`${w.subject} (${w.pct}% de acerto)`).join(', ');
  setBusy(btn, 'Planejando…');
  try{
    const r = await askZenJSON(`Monte um plano de estudos realista para o ${userName()}.
Objetivo: ${goal}. Data da prova: ${date} (hoje é ${t}, faltam ${total} dias).
Conteúdos: ${subjects}
Tempo disponível: ${mins} minutos por dia de estudo.${weak ? `\nPontos fracos nos simulados: ${weak}.` : ''}
${weekly ? `Como falta bastante tempo, organize POR SEMANA. Use exatamente estas semanas (data de início): ${weekStarts.join(', ')}. Cada semana com 2 a 5 metas.`
  : `Organize POR DIA, usando só estes dias: ${studyDays.join(', ')}. Cada dia com 1 a 3 metas curtas e concretas que caibam em ${mins} min (ex: "Funções do 1º grau: resumo + 10 questões").`}
Use técnicas que funcionam: estudo ativo (questões, flashcards, explicar com as próprias palavras), revisão espaçada do que já viu, intercalar matérias, simulado na reta final e véspera leve.
Formato: {"visao_geral":"2-3 frases","${weekly?'semanas':'dias'}":[{"data":"AAAA-MM-DD","foco":"tema principal","metas":["..."]}],"dicas":["..."]}`);
    const list = (Array.isArray(weekly ? r.semanas : r.dias) ? (weekly ? r.semanas : r.dias) : [])
      .filter(d=> /^\d{4}-\d{2}-\d{2}$/.test(d.data||'')).map(d=>({date:d.data, foco:String(d.foco||''), metas:(d.metas||[]).map(String).filter(Boolean).slice(0,5)})).filter(d=>d.metas.length);
    if(!list.length) throw Object.assign(new Error('plano vazio'), {code:'JSON'});
    const plan = {id:uid(), goal, date, weekly, overview:String(r.visao_geral||''), days:list, tips:(r.dicas||[]).map(String).slice(0,6), createdAt:Date.now(), added:false};
    state.settings.lastPlan = plan; persist('settings');
    registerActivityToday();
    renderStudyPlan(plan);
  }catch(err){ explainZenError(err); }
  resetBusy(btn);
}

  box.innerHTML = `<div class="card">
    <h3 style="margin-bottom:4px;">🗓️ ${escapeHTML(plan.goal)}</h3>
    <p class="muted-sm">${plan.weekly?'Plano semanal':'Plano dia a dia'} até ${formatDateBR(plan.date)} · ${plan.days.length} ${plan.weekly?plural(plan.days.length,'semana'):plural(plan.days.length,'dia')} de estudo</p>
    ${plan.overview ? `<div class="zen-explain" style="margin:12px 0;">${capySVG('icon')}<div>${escapeHTML(plan.overview)}</div></div>` : ''}
    <div class="plan-list">${plan.days.map(d=>`<div class="plan-day ${d.date===todayKey()?'today':''}">
      <div class="plan-date">${plan.weekly ? 'Semana de<br>' : ''}<b>${formatShort(d.date)}</b><small>${plan.weekly?'':keyToDate(d.date).toLocaleDateString('pt-BR',{weekday:'short'})}</small></div>
      <div>${d.foco?`<b>${escapeHTML(d.foco)}</b>`:''}<ul>${d.metas.map(m=>`<li>${escapeHTML(m)}</li>`).join('')}</ul></div></div>`).join('')}
      <div class="plan-day exam"><div class="plan-date"><b>${formatShort(plan.date)}</b><small>prova</small></div><div><b>📌 ${escapeHTML(plan.goal)}</b><p class="muted-sm">Você vai arrasar! 🦫</p></div></div>
    </div>
    ${plan.tips.length ? `<h4 style="margin-top:14px;">💡 Dicas do Zen</h4><ul class="tool-list">${plan.tips.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>` : ''}
    <div class="card-actions" style="margin-top:14px;">
      <button class="btn btn-accent" id="pl-add" ${plan.added?'disabled':''}>${plan.added?'✓ Já está no calendário':'📅 Colocar no calendário'}</button>
      <button class="btn btn-ghost btn-sm" id="pl-note">🗒️ Salvar como anotação</button>
    </div></div>`;
  document.getElementById('pl-add').addEventListener('click', e=>{
    plan.days.forEach(d=> d.metas.forEach(m=> plan.weekly ? addWeekGoal(d.date, m) : addCalendarGoal(d.date, (d.foco ? d.foco+': ' : '')+m)));
    if(plan.weekly) persist('weeklyGoals');
    if(!state.events.some(ev=> ev.date===plan.date && ev.title===plan.goal)){ state.events.push({id:uid(), date:plan.date, title:plan.goal, type:'prova', subject:''}); persist('events'); }
    plan.added = true; persist('settings');
    e.currentTarget.disabled = true; e.currentTarget.textContent = '✓ Já está no calendário';
    updateNavBadges();
    toast('Plano no calendário! As metas aparecem no Início todo dia 📅', 'success');
  });
  document.getElementById('pl-note').addEventListener('click', ()=>{
    const md = `${plan.overview}\n\n${plan.days.map(d=>`### ${plan.weekly?'Semana de ':''}${formatShort(d.date)}${d.foco?' · '+d.foco:''}\n${d.metas.map(m=>'- [ ] '+m).join('\n')}`).join('\n\n')}\n\n## Dicas\n${plan.tips.map(x=>'- '+x).join('\n')}`;
    const n = createNote({subject:'Geral', title:`Plano: ${plan.goal}`.slice(0,90), icon:'🗓️', contentHTML:markdownToNoteHTML(md)});
    toast(`Salvo em Anotações: "${n.title}"`, 'success');
  });
}

/* --- 🔎 Diagnóstico do Zen --- */
function studySnapshot(){
  const t = todayKey();
  let min14 = 0, days14 = 0; for(let i=0;i<14;i++){ const m = state.stats.studyLog[addDaysKey(t,-i)]||0; min14 += m; if(m>0) days14++; }
  const acc = subjectAccuracy();
  const attempts = state.quizAttempts.slice(-10);
  return {
    hoje: t, sequencia: state.stats.streak||0, nivel: levelInfo(state.stats.totalXP||0).level,
    minutos_14_dias: Math.round(min14), dias_estudados_14: days14,
    minutos_por_materia: Object.fromEntries(Object.entries(state.stats.subjectMinutes||{}).map(([k,v])=>[k, Math.round(v)])),
    acerto_por_materia: acc.map(m=>({materia:m.subject, questoes_pct:m.qPct, respondidas:m.qt, flashcards_pct:m.fPct})),
    simulados: attempts.map(a=>({data:new Date(a.date).toLocaleDateString('pt-BR'), materia:a.subject, modo:a.mode, acertos:`${a.score}/${a.total}`, seg_por_questao: a.total ? Math.round(a.timeSpentSec/a.total) : null})),
    flashcards_total: state.flashcards.length, flashcards_pendentes: dueFlashcards().length,
    erros_para_revisar: wrongQuestions().length,
    redacoes: state.essays.slice(-5).map(e=>({nota:e.total, competencias:e.comps.map(c=>c.nota)})),
    provas_proximas: upcomingEvents(45).map(e=>({titulo:e.title, data:e.date, faltam:daysBetween(t,e.date)})),
    metas_semana: weekGoals(t).map(g=>({texto:g.text, feita:g.done}))
  };
}
function renderToolDiagnostico(root){
  const snap = studySnapshot();
  const acc = subjectAccuracy().filter(m=>m.qt>0).sort((a,b)=>a.qPct-b.qPct);
  const lastQuizPct = state.quizAttempts.length ? Math.round(state.quizAttempts.slice(-5).reduce((s,a)=>s+(a.total?a.score/a.total:0),0)/Math.min(5,state.quizAttempts.length)*100) : null;
  root.innerHTML = `${toolHeader('diagnostico')}
    <div class="grid grid-4 diag-stats">
      <div class="card diag-stat"><b>${snap.minutos_14_dias>=60 ? Math.floor(snap.minutos_14_dias/60)+'h'+String(snap.minutos_14_dias%60).padStart(2,'0') : snap.minutos_14_dias+' min'}</b><small>estudo nos últimos 14 dias</small></div>
      <div class="card diag-stat"><b>${snap.dias_estudados_14}/14</b><small>dias com estudo</small></div>
      <div class="card diag-stat"><b>${lastQuizPct===null?'—':lastQuizPct+'%'}</b><small>acerto nos últimos simulados</small></div>
      <div class="card diag-stat"><b>${snap.erros_para_revisar}</b><small>erros pra revisar</small></div>
    </div>
    <div class="tool-layout" style="margin-top:16px;">
      <div class="card"><h4>Acerto por matéria</h4>
        ${acc.length ? acc.map(m=>`<div class="comp-row"><div class="comp-head"><span>${escapeHTML(m.subject)}</span><b class="comp-score">${m.qPct}%</b></div><div class="progress-bar"><div style="width:${m.qPct}%; background:${scoreColor(m.qPct)}"></div></div><p class="muted-sm" style="font-size:12px;">${m.qt} ${plural(m.qt,'resposta')}</p></div>`).join('')
          : `<p class="muted-sm">Faça alguns simulados pra eu conseguir medir o acerto por matéria.</p>`}
      </div>
      <div id="dg-result"><div class="card tool-hint">${capySVG('happy','',64)}<p>O Zen olha seus números de verdade (tempo, acertos, erros, provas chegando) e diz onde focar agora, com metas pra semana.</p>

    </div>`;
  bindToolBack();
  document.getElementById('dg-go').addEventListener('click', e=> runDiagnosis(e.currentTarget));
  if(state.settings.lastDiagnosis) renderDiagnosis(state.settings.lastDiagnosis);
}
async function runDiagnosis(btn){
  setBusy(btn, 'Analisando…');
  try{
    const r = await askZenJSON(`Você é o Zen, mentor de estudos do ${userName()}. Analise os dados reais de estudo abaixo e faça um diagnóstico honesto e motivador. Aponte padrões (ex: estuda pouco no fim de semana, erra mais em X, demora muito por questão, flashcards acumulando, prova chegando sem preparação).
Se tiver poucos dados, diga isso e sugira como começar.
Formato: {"resumo":"2-3 frases","pontos_fortes":["..."],"atencao":[{"titulo":"...","detalhe":"...","acao":"..."}],"metas_semana":["meta concreta e mensurável"],"foco_hoje":"o que fazer hoje, em uma frase"}
Dados: ${JSON.stringify(studySnapshot())}`);
    const d = {resumo:String(r.resumo||''), fortes:(r.pontos_fortes||[]).map(String).slice(0,5),
      atencao:(r.atencao||[]).map(a=>({titulo:String(a.titulo||''), detalhe:String(a.detalhe||''), acao:String(a.acao||'')})).slice(0,5),
      metas:(r.metas_semana||[]).map(String).filter(Boolean).slice(0,6), hoje:String(r.foco_hoje||''), createdAt:Date.now(), added:false};
    state.settings.lastDiagnosis = d; persist('settings');
    renderDiagnosis(d);
  }catch(err){ explainZenError(err); resetBusy(btn); }
}

/* --- ❌ Caderno de erros --- */
// Questões cuja última resposta foi errada (acertou depois? sai do caderno)
function wrongQuestions(subject){
  return state.questions.filter(q=>{ const h = q.history||[]; return h.length && !h[h.length-1].correct && (!subject || q.subject===subject); })
    .sort((a,b)=> b.history[b.history.length-1].date - a.history[a.history.length-1].date);
}
function lastWrongPick(qid){
  for(let i=state.quizAttempts.length-1;i>=0;i--){ const d = (state.quizAttempts[i].details||[]).find(x=>x.questionId===qid && !x.correct); if(d) return d.selected; }
  return null;
}
let errosSubject = '';
function renderToolErros(root){
  const all = wrongQuestions();
  const subjects = [...new Set(all.map(q=>q.subject))];
  if(errosSubject && !subjects.includes(errosSubject)) errosSubject = '';
  const list = wrongQuestions(errosSubject);
  root.innerHTML = `${toolHeader('erros')}
    ${all.length ? `<div class="card" style="margin-bottom:14px;">
      <div class="chip-row" id="er-chips" style="margin-bottom:10px;"></div>
      <div class="card-actions">
        <button class="btn btn-primary" id="er-redo">🔁 Refazer ${list.length>20?'20 delas':list.length===1?'a questão':`as ${list.length}`}</button>
        <button class="btn btn-accent" id="er-cards">🗂️ Virar flashcards</button>
        <button class="btn btn-ghost" id="er-pattern">🦫 Achar o padrão dos meus erros</button>
      </div>
      <div id="er-pattern-box"></div></div>
      <div id="er-list">${list.map((q,i)=>{ const wrongs = q.history.filter(h=>!h.correct).length; const pick = lastWrongPick(q.id);
        return `<div class="review-item bad">
          <div class="rq"><span class="badge">${escapeHTML(q.subject)}</span> ${escapeHTML(q.question)}</div>
          ${pick!=null && q.options[pick] ? `<div class="ra">❌ Você marcou: <b>${'ABCDE'[pick]})</b> ${escapeHTML(q.options[pick])}</div>` : ''}
          <details class="er-answer"><summary>Ver resposta certa</summary>
            <div class="ra">✔️ <b>${'ABCDE'[q.correctIndex]})</b> ${escapeHTML(q.options[q.correctIndex])}</div>
            ${q.explanation ? `<div class="ra muted-sm">💡 ${escapeHTML(q.explanation)}</div>` : ''}</details>
          <p class="muted-sm" style="font-size:12px;">Errou ${wrongs}x · última vez em ${new Date(q.history[q.history.length-1].date).toLocaleDateString('pt-BR')}</p>
          <div id="er-zen-${i}"></div>
          <div class="card-actions" style="margin-top:6px;"><button class="btn btn-ghost btn-sm" data-er-explain="${i}">🦫 Explicar com o Zen</button></div>
        </div>`; }).join('')}</div>`
    : emptyState('Nenhum erro pra revisar! 🎉', 'Quando errar alguma questão nos simulados, ela aparece aqui até você acertar de novo.', `<button class="btn btn-primary" onclick="switchView('quizzes')">Fazer um simulado</button>`)}`;
  bindToolBack();
  if(!all.length) return;
  renderSubjectChips(document.getElementById('er-chips'), subjects, errosSubject, s=>{ errosSubject = s; renderToolErros(root); });
  document.getElementById('er-redo').addEventListener('click', ()=>{
    const ids = list.slice(0,20).map(q=>q.id);
    currentTool = null; switchView('quizzes');
    startQuiz({questionIds:ids, count:ids.length, mode:'pratica'});
  });
  document.getElementById('er-cards').addEventListener('click', e=>{ errorsToFlashcards(list); e.currentTarget.disabled = true; });
  document.getElementById('er-pattern').addEventListener('click', e=> findErrorPatterns(list, e.currentTarget));
  root.querySelectorAll('[data-er-explain]').forEach(b=> b.addEventListener('click', ()=>{
    const i = +b.dataset.erExplain;
    explainWithZen(list[i], lastWrongPick(list[i].id), document.getElementById('er-zen-'+i), b);
  }));
}
async function findErrorPatterns(list, btn){
  setBusy(btn, 'Investigando…');
  try{
    const sample = list.slice(0,30).map(q=>{ const p = lastWrongPick(q.id); return {materia:q.subject, enunciado:q.question.slice(0,300), marcou:p!=null?q.options[p]:null, correta:q.options[q.correctIndex]}; });
    const r = await askZenJSON(`Estas são questões que o ${userName()} errou. Encontre PADRÕES nos erros (ex: confunde dois conceitos, erra sinal/unidade, lê rápido e cai em pegadinha, falta base em X). Para cada padrão, explique e dê uma dica prática.
Formato: {"resumo":"1-2 frases","padroes":[{"titulo":"...","explicacao":"...","dica":"..."}],"estudar_primeiro":["tema"]}
Erros: ${JSON.stringify(sample)}`);
    document.getElementById('er-pattern-box').innerHTML = `<div style="margin-top:14px;">
      <div class="zen-explain">${capySVG('icon')}<div>${escapeHTML(String(r.resumo||''))}</div></div>
      ${(r.padroes||[]).map(p=>`<div class="essay-err"><b>${escapeHTML(String(p.titulo||''))}</b><span>${escapeHTML(String(p.explicacao||''))}</span><span class="ee-fix">💡 ${escapeHTML(String(p.dica||''))}</span></div>`).join('')}
      ${(r.estudar_primeiro||[]).length ? `<p class="muted-sm" style="margin-top:8px;"><b>Estude primeiro:</b> ${(r.estudar_primeiro||[]).map(x=>escapeHTML(String(x))).join(' · ')}</p>` : ''}</div>`;

/* --- Cache de respostas: a mesma pergunta (mesma questão, mesmo vídeo…) não gasta pedido de novo --- */
const AI_CACHE_MAX = 150;
let aiCache = loadData('aiCache', {});
// hash rápido (cyrb53) — serve de chave, não de segurança
function quickHash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36);
}
function aiCacheKey(body, opts){ return quickHash(JSON.stringify({c:body.contents, j:!!opts.json, s:opts.system||''})); }
function aiCacheGet(k){
  const hit = aiCache[k]; if(!hit) return null;
  hit.at = Date.now();
  state.settings.aiCacheHits = (state.settings.aiCacheHits||0)+1; persist('settings');
  return hit.t;
}
function aiCacheSet(k, text){
  aiCache[k] = {t:text, at:Date.now()};
  const keys = Object.keys(aiCache);
  if(keys.length > AI_CACHE_MAX) keys.sort((a,b)=> aiCache[a].at-aiCache[b].at).slice(0, keys.length-AI_CACHE_MAX).forEach(x=> delete aiCache[x]);
  if(!saveData('aiCache', aiCache)){ aiCache = {}; saveData('aiCache', aiCache); }
}
function clearAICache(){ aiCache = {}; saveData('aiCache', aiCache); }
// resposta que veio quebrada não fica guardada
function aiCacheDropText(text){ let n = 0; Object.keys(aiCache).forEach(k=>{ if(aiCache[k].t===text){ delete aiCache[k]; n++; } }); if(n) saveData('aiCache', aiCache); }

/* --- Sincronizar com outro aparelho (código + criptografia, pelos mesmos servidores da dupla) --- */
const SYNC_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const SYNC_CHUNK = 40000;
let sync = null;
function newSyncCode(){ const r = crypto.getRandomValues(new Uint8Array(10)); const s = Array.from(r, x=> SYNC_ALPHA[x % SYNC_ALPHA.length]).join(''); return s.slice(0,5)+'-'+s.slice(5); }
function bytesToB64(u8){ let s = ''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function b64ToBytes(b64){ const s = atob(b64); const u8 = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u8[i] = s.charCodeAt(i); return u8; }
async function streamBytes(u8, Stream, mode){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new Stream(mode))).arrayBuffer()); }
async function syncKeys(code){
  if(!window.crypto || !crypto.subtle) throw Object.assign(new Error('sem crypto'), {code:'SEGURO'});
  const norm = code.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const enc = new TextEncoder();
  const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('zen-sync-topic:'+norm))), b=> b.toString(16).padStart(2,'0')).join('');
  const base = await crypto.subtle.importKey('raw', enc.encode(norm), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:enc.encode('zen-estudos-sync-v1'), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  return {topic:`${LIVE_NS}/sync/${hash.slice(0,24)}`, key};
}
async function syncNetReady(){
  await liveNetStart();
  for(let i=0;i<40 && !liveOnlineCount();i++) await new Promise(r=> setTimeout(r, 250));
  if(!liveOnlineCount()) throw Object.assign(new Error('offline'), {code:'REDE'});
}
function syncSend(type, extra){ return sync ? netPublish(sync.topic, JSON.stringify(Object.assign({type, mid:uid(), src:liveNet.src}, extra||{})), {qos:1}) : 0; }
function stopSync(){ if(sync){ clearTimeout(sync.expire); clearInterval(sync.needTimer); netUnsubscribe(sync.topic); } sync = null; }
function syncStatus(html){ const el = document.getElementById('sync-status'); if(el) el.innerHTML = html; }
function syncErrorText(err){ return err && err.code==='SEGURO' ? 'Este navegador não liberou a criptografia aqui. Abra o app pelo arquivo ou por um site https.' : err && err.code==='REDE' ? 'Sem conexão com os servidores agora. Confira a internet.' : 'Não deu certo. Tente de novo.'; }
function openSyncModal(){
  openModal(`
    <button class="modal-close" onclick="stopSync(); closeModal()" aria-label="Fechar">✕</button>
    <h3>🔄 Sincronizar com outro aparelho</h3>
    <p class="muted-sm">Leve o progresso do perfil <b>${escapeHTML(userName())}</b> pro celular, outro computador etc. Os dois aparelhos precisam estar com o app aberto e com internet. Tudo vai criptografado com o código.</p>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="card"><h4>📤 Enviar daqui</h4><p class="muted-sm">Este aparelho manda os dados e mostra um código.</p>
        <label class="check-row"><input type="checkbox" id="sync-files"> Incluir arquivos anexados (pode demorar)</label>
        <button class="btn btn-primary btn-block" id="sync-send">Gerar código</button></div>
      <div class="card"><h4>📥 Receber aqui</h4><p class="muted-sm">Digite o código que apareceu no outro aparelho.</p>
        <div class="field"><input class="input sync-code-input" id="sync-code" placeholder="XXXXX-XXXXX" maxlength="11" autocomplete="off"></div>
        <button class="btn btn-accent btn-block" id="sync-recv">Receber</button></div>
    </div>
    <div id="sync-status" class="sync-status"></div>
    <p class="muted-sm" style="font-size:12px; margin-top:10px;">Prefere sem internet? Use "Baixar backup" num aparelho e "Restaurar um backup" no outro (no ⚙️).</p>`, {size:'lg'});
  document.getElementById('sync-send').addEventListener('click', e=> startSyncSend(e.currentTarget));
  document.getElementById('sync-recv').addEventListener('click', e=> startSyncReceive(e.currentTarget));
  const inp = document.getElementById('sync-code');
  inp.addEventListener('input', ()=>{ const v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10); inp.value = v.length>5 ? v.slice(0,5)+'-'+v.slice(5) : v; });
}
async function startSyncSend(btn){
  stopSync();
  setBusy(btn, 'Preparando…');
  try{
    await syncNetReady();
    const code = newSyncCode();
    const {topic, key} = await syncKeys(code);
    const withFiles = document.getElementById('sync-files').checked;
    let raw = new TextEncoder().encode(JSON.stringify({app:'zen-estudos', profile:{name:userName(), avatar:CURRENT_PROFILE.avatar}, data:state, files: withFiles ? await backupFilesPayload() : []}));
    const gz = typeof CompressionStream!=='undefined';
    if(gz) raw = await streamBytes(raw, CompressionStream, 'gzip');
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const b64 = bytesToB64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, raw)));
    const chunks = []; for(let i=0;i<b64.length;i+=SYNC_CHUNK) chunks.push(b64.slice(i, i+SYNC_CHUNK));
    sync = {role:'send', topic, chunks, iv:bytesToB64(iv), gz, sent:false};
    netSubscribe(topic);
    sync.expire = setTimeout(()=>{ stopSync(); syncStatus('<p class="muted-sm">O código expirou. Gere outro.</p>'); }, 10*60000);
    syncStatus(`<div class="sync-code">${code}</div><p>Digite este código no outro aparelho (em ⚙️ → 🔄 Sincronizar → Receber aqui). Esperando… <span class="spinner"></span></p><p class="muted-sm">${Math.max(1, Math.round(b64.length*0.75/1024))} KB pra enviar · o código vale por 10 minutos</p>`);
  }catch(err){ console.error(err); syncStatus(`<p class="muted-sm">⚠️ ${syncErrorText(err)}</p>`); stopSync(); }
  resetBusy(btn);
}
async function syncPushChunks(list){
  for(const i of list){ if(!sync) return; syncSend('chunk', {i, d:sync.chunks[i]}); await new Promise(r=> setTimeout(r, 30)); }
}
async function startSyncReceive(btn){
  const code = document.getElementById('sync-code').value.trim();
  if(code.replace(/[^A-Z0-9]/gi,'').length!==10){ toast('O código tem 10 letras/números (XXXXX-XXXXX).','error'); return; }
  stopSync();
  setBusy(btn, 'Conectando…');
  try{
    await syncNetReady();
    const {topic, key} = await syncKeys(code);
    sync = {role:'recv', topic, key, got:{}, total:null, lastAt:Date.now()};
    netSubscribe(topic);
    await new Promise(r=> setTimeout(r, 600));
    syncSend('hello');
    syncStatus('<p>Conectado! Pedindo os dados… <span class="spinner"></span></p>');
    sync.expire = setTimeout(()=>{ if(sync && sync.total==null){ syncStatus('<p class="muted-sm">⚠️ O outro aparelho não respondeu. Confira o código e se o app está aberto lá.</p>'); stopSync(); } }, 25000);
    sync.needTimer = setInterval(()=>{
      if(!sync || sync.total==null || Date.now()-sync.lastAt < 4000) return;
      const missing = []; for(let i=0;i<sync.total;i++) if(!(i in sync.got)) missing.push(i);
      if(missing.length){ sync.lastAt = Date.now(); syncSend('need', {list:missing.slice(0,60)}); }
    }, 2000);
  }catch(err){ console.error(err); syncStatus(`<p class="muted-sm">⚠️ ${syncErrorText(err)}</p>`); stopSync(); }
  resetBusy(btn);
}
function onSyncMessage(d){
  if(!sync) return;
  if(sync.role==='send'){
    if(d.type==='hello'){ clearTimeout(sync.expire); syncSend('meta', {total:sync.chunks.length, iv:sync.iv, gz:sync.gz}); syncStatus('<p>Enviando… <span class="spinner"></span></p>'); syncPushChunks(sync.chunks.map((_,i)=>i)); }
    else if(d.type==='need') syncPushChunks((d.list||[]).filter(i=> i>=0 && i<sync.chunks.length));
    else if(d.type==='ok'){ syncStatus('<p>✅ Pronto! O outro aparelho recebeu tudo.</p>'); toast('Dados enviados pro outro aparelho 🔄','success'); stopSync(); }
    else if(d.type==='no'){ syncStatus('<p class="muted-sm">O outro aparelho cancelou.</p>'); stopSync(); }
    return;
  }
  if(d.type==='meta'){ clearTimeout(sync.expire); sync.total = +d.total; sync.iv = d.iv; sync.gz = !!d.gz; sync.lastAt = Date.now(); }
  if(d.type==='chunk' && sync.total!=null && !(d.i in sync.got)){
    sync.got[d.i] = d.d; sync.lastAt = Date.now();
    const n = Object.keys(sync.got).length;
    syncStatus(`<p>Recebendo… ${Math.round(n/sync.total*100)}%</p><div class="progress-bar"><div style="width:${n/sync.total*100}%"></div></div>`);
    if(n===sync.total) finishSyncReceive();
  }
}
async function finishSyncReceive(){
  const s = sync; clearInterval(s.needTimer);
  try{
    const enc = b64ToBytes(Array.from({length:s.total}, (_,i)=> s.got[i]).join(''));
    let raw = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(s.iv)}, s.key, enc));
    if(s.gz) raw = await streamBytes(raw, DecompressionStream, 'gzip');
    const parsed = JSON.parse(new TextDecoder().decode(raw));
    if(!parsed || parsed.app!=='zen-estudos' || !parsed.data) throw new Error('formato');
    const who = parsed.profile || {};
    if(!confirm(`Recebido o progresso de ${who.avatar||''} ${who.name||'outro aparelho'}. Substituir os dados do perfil ${userName()} neste aparelho por eles?`)){ syncSend('no'); stopSync(); syncStatus('<p class="muted-sm">Cancelado. Nada mudou aqui.</p>'); return; }
    Object.keys(state).forEach(k=>{ if(k in parsed.data) state[k] = parsed.data[k]; });
    normalizeState();
    Object.keys(state).forEach(k=> persist(k));
    if(parsed.files && parsed.files.length) await restoreBackupFiles(parsed.files);
    syncSend('ok'); stopSync();
    applyTheme(); refreshSubjectsDatalist(); updateStreakUI();
    closeModal(); switchView('dashboard');
    toast('Sincronizado! Agora este aparelho tem o mesmo progresso 🔄','success');
  }catch(err){ console.error(err); syncStatus('<p class="muted-sm">⚠️ Não consegui abrir os dados (código errado ou envio incompleto). Gere outro código e tente de novo.</p>'); stopSync(); }
}

// Chamado pelo addXP: guarda o XP de cada dia (ranking semanal) e vai juntando congelamentos de sequência
const FREEZE_XP = 300, FREEZE_MAX = 2;
function onXPGained(amount){
  const s = state.stats;
  s.xpLog = s.xpLog || {};
  s.xpLog[todayKey()] = (s.xpLog[todayKey()]||0) + amount;
  if(amount <= 0) return;
  s.freezes = s.freezes||0;
  if(s.freezes >= FREEZE_MAX){ s.freezeXP = 0; return; }
  s.freezeXP = (s.freezeXP||0) + amount;
  if(s.freezeXP >= FREEZE_XP){ s.freezes++; s.freezeXP -= FREEZE_XP; setTimeout(()=> toast(`🧊 Você ganhou um congelamento de sequência (${s.freezes}/${FREEZE_MAX}). Se faltar um dia, ele salva sua sequência!`, 'success'), 400); }
  const before = levelInfo((s.totalXP||0) - amount).level, after = levelInfo(s.totalXP||0).level;
  if(after > before){ const novos = CAPY_ACC.filter(a=> a.level>before && a.level<=after); if(novos.length) setTimeout(()=> toast(`🎁 Acessório novo pra capivara: ${novos.map(a=>a.icon+' '+a.name).join(', ')}! Equipe em 🏆 Conquistas.`, 'success'), 1200); }
}
// Ao abrir o app: se faltou estudar e tem congelamento, ele é gasto e a sequência continua
function useStreakFreeze(){
  const s = state.stats, missed = daysBetween(s.lastActiveDate, todayKey()) - 1;
  if(missed < 1 || (s.freezes||0) < missed) return false;
  s.freezes -= missed;
  s.lastActiveDate = addDaysKey(todayKey(), -1);
  s.freezeUsed = todayKey();
  persist('stats');
  setTimeout(()=> toast(`🧊 ${missed===1 ? 'Um congelamento salvou' : missed+' congelamentos salvaram'} sua sequência de ${s.streak} ${plural(s.streak,'dia')}! Estude hoje pra continuar.`, 'success'), 2200);
  return true;
}

/* --- ▶ Revisão do dia: flashcards vencidos + caderno de erros + ponto fraco, numa sessão só --- */
let dailyRev = null;
function dailyReviewPlan(){
  const cards = dueFlashcards().sort((a,b)=> (a.nextReview||0)-(b.nextReview||0)).slice(0,15);
  const errs = wrongQuestions().slice(0,5);
  const used = new Set(errs.map(q=>q.id));
  const weak = getWeakSubjects()[0];
  const extra = weak ? state.questions.filter(q=> q.subject===weak.subject && !used.has(q.id)).sort((a,b)=> questionWeakScore(b)-questionWeakScore(a)).slice(0,3) : [];
  const qs = errs.concat(extra);
  return {cards, qs, mins: Math.max(1, Math.round(cards.length*0.6 + qs.length*1.5)), weak};
}
function dailyReviewCardHTML(){
  const p = dailyReviewPlan(), done = state.stats.dailyReviewDate===todayKey();
  const n = p.cards.length + p.qs.length;
  return `<div class="card daily-card ${done?'done':''}">
    <div class="daily-head"><span class="daily-icon">${done?'✅':'▶️'}</span><div><h3 style="margin:0;">Revisão do dia</h3>
      <p class="muted-sm" style="margin:2px 0 0;">${n ? `${p.cards.length} ${plural(p.cards.length,'flashcard')} · ${p.qs.length} ${plural(p.qs.length,'questão','questões')} pra refazer · ~${p.mins} min` : 'Nada vencido hoje. Memória em dia! ✨'}</p></div></div>
    ${n ? `<button class="btn ${done?'btn-ghost':'btn-accent'} btn-block" id="daily-go">${done ? '🔁 Revisar de novo' : '▶ Estudar agora'}</button>` : `<button class="btn btn-ghost btn-block" id="daily-go2">🎯 Fazer um simulado</button>`}
  </div>`;
}
function startDailyReview(){
  const p = dailyReviewPlan();
  const items = [];
  let ci = 0, qi = 0;
  while(ci < p.cards.length || qi < p.qs.length){
    for(let k=0;k<3 && ci<p.cards.length;k++) items.push({kind:'card', ref:p.cards[ci++]});
    if(qi < p.qs.length) items.push({kind:'q', ref:p.qs[qi++]});
  }
  if(!items.length){ toast('Nada pra revisar agora ✨'); return; }
  dailyRev = {items, i:0, ok:0, bad:0, xp0:state.stats.totalXP||0, flipped:false, answered:null, total:items.length, startedAt:Date.now()};
  switchView('revisao');
}

  } else {

    body = `<div class="card"><p class="quiz-question-text">${escapeHTML(q.question)}</p>${qVisualHTML(q)}
      <div>${q.options.map((o,i)=>{ let cls = 'quiz-option'; if(a!=null){ cls += ' disabled'; if(i===q.correctIndex) cls += ' correct'; else if(i===a) cls += ' incorrect'; } return `<button class="${cls}" data-o="${i}"><b>${'ABCDE'[i]})</b> ${escapeHTML(o)}</button>`; }).join('')}</div>
      ${a!=null ? `<div class="quiz-explain ${a===q.correctIndex?'ok':'bad'}"><strong>${a===q.correctIndex?'Certinho! ✅':`A correta é a ${'ABCDE'[q.correctIndex]}.`}</strong>${q.explanation?`<p>${escapeHTML(q.explanation)}</p>`:''}</div>
        <div id="dr-zen"></div><div class="card-actions" style="margin-top:10px;">${a!==q.correctIndex?'<button class="btn btn-ghost btn-sm" id="dr-explain">🦫 Explicar com o Zen</button>':''}<button class="btn btn-primary" id="dr-next">Próxima →</button></div>` : ''}</div>`;
  }
  root.innerHTML = `<div class="view-header"><h2>▶ Revisão do dia</h2><p>${done} de ${r.total} · ${it.kind==='card'?'🗂️ flashcard':'🎯 questão'} · <span class="badge badge-primary">${escapeHTML(it.ref.subject||'')}</span></p></div>

  hydrateVisuals(root);
  document.getElementById('dr-stop').addEventListener('click', ()=>{ r.i = r.items.length; renderRevisao(root); });
  if(it.kind==='card'){
    document.getElementById('dr-card').addEventListener('click', ()=>{ r.flipped = !r.flipped; renderRevisao(root); });
    root.querySelectorAll('[data-q]').forEach(b=> b.addEventListener('click', ()=>{
      const q = +b.dataset.q, c = it.ref;
      scheduleFlashcard(c, q); persist('flashcards');
      state.stats.flashcardsReviewed = (state.stats.flashcardsReviewed||0)+1; persist('stats');
      addXP(XP.flashcardRevisado); logStudyMinutes(0.5, c.subject); registerActivityToday();

      if(r.answered!=null) return;
      const q = it.ref, choice = +b.dataset.o, ok = choice===q.correctIndex;
      r.answered = choice;
      q.history = q.history||[]; q.history.push({date:Date.now(), correct:ok}); persist('questions');
      if(ok){ r.ok++; addXP(XP.questaoCerta); } else r.bad++;
      logStudyMinutes(1, q.subject); registerActivityToday();

  {id:'fc20',   icon:'🗂️', text:'Revisar 20 flashcards',            m:'fc',       n:20, need:()=> state.flashcards.length>=5},
